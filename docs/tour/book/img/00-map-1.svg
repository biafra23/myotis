<svg xmlns="http://www.w3.org/2000/svg" class="wide-diagram" viewBox="0 0 960 610" role="img" fill="currentColor" aria-label="Crate map. Wallets and dapps reach myotis-rpcd over HTTP JSON-RPC; myotis-rpcd calls the engine's exported functions directly as a Rust library. JVM hosts reach myotis-engine through UniFFI and JNA, iOS through the plain C ABI, Node through myotis-node which calls the C ABI functions. myotis-engine starts the sync loop and the EL reader in myotis-net, which does all I/O and depends on the sans-I/O crates myotis-wire, myotis-consensus, myotis-core and myotis-evm. myotis-wire uses myotis-core and myotis-consensus; myotis-evm uses myotis-core; myotis-consensus uses myotis-bls, which the Java engine also loads through JNI. roost and tor-poc are standalone binaries built on myotis-net." width="960" height="610">
    <style>svg{color:#121a22;--ground:#eef1f4;--ground-2:#e6eaee;--surface:#f8fafb;--ink:#121a22;--ink-2:#47525f;--ink-3:#6b7784;--rule:#d3dae1;--rule-strong:#b7c1cb;--oxide:#b4441a;--oxide-ink:#8f3310;--oxide-wash:#f6e4dc;--jvm:#6a4bd8;--jvm-ink:#4f33b3;--jvm-wash:#ebe6fb;--ok:#1f7a4d;--ok-ink:#1f7a4d;--ok-wash:#dcefe4;--warn:#9a620a;--warn-ink:#7a4d08;--warn-wash:#f5ead3;--bad:#b42335;--bad-ink:#8f1c2a;--bad-wash:#f7dfe2}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#6b7784}</style><rect x="0.0" y="0.0" width="960.0" height="610.0" fill="#f8fafb" /><defs>
