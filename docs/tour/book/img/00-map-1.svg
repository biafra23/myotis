      <text x="108" y="59" text-anchor="middle">MetaMask, Bee, dapps</text>
      <text x="294" y="59" text-anchor="middle">desktop · daemon · Android</text>
      <text x="480" y="59" text-anchor="middle">Kotlin/Native · :app-ios</text>
