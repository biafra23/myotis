<svg xmlns="http://www.w3.org/2000/svg" class="wide-diagram" viewBox="0 0 940 320" role="img" fill="currentColor" aria-label="Trust chain for a state read. A sync-committee BLS signature feeds the ExecAnchor, which holds the optimistic head (number, block hash, slot), the finalized block, a window of up to 8192 attested state roots and the last 128 heads. Under Gloas the light client proves only a block hash; the pool fetches the header and the anchor adopts it only if keccak of its RLP equals the hash. The header chain runs from the peer's block up to the anchor block: the anchor header's keccak must equal the attested block hash, each header's hash must equal its child's parentHash, and the peer block's stateRoot must equal the root the proof was checked against. A dashed fast path goes straight from the known-roots window to the MPT proof." width="940" height="320">
    <style>svg{color:#121a22;--ground:#eef1f4;--ground-2:#e6eaee;--surface:#f8fafb;--ink:#121a22;--ink-2:#47525f;--ink-3:#6b7784;--rule:#d3dae1;--rule-strong:#b7c1cb;--oxide:#b4441a;--oxide-ink:#8f3310;--oxide-wash:#f6e4dc;--jvm:#6a4bd8;--jvm-ink:#4f33b3;--jvm-wash:#ebe6fb;--ok:#1f7a4d;--ok-ink:#1f7a4d;--ok-wash:#dcefe4;--warn:#9a620a;--warn-ink:#7a4d08;--warn-wash:#f5ead3;--bad:#b42335;--bad-ink:#8f1c2a;--bad-wash:#f7dfe2}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#6b7784}</style><rect x="0.0" y="0.0" width="940.0" height="320.0" fill="#f8fafb" /><defs>
      <marker id="m-stop12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
      </marker>
    </defs>
    <rect x="20" y="30" width="170" height="80" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="105" y="58" text-anchor="middle" font-size="13" font-weight="700">Sync committee</text>
    <text x="105" y="78" text-anchor="middle" font-size="10.5" style="fill:var(--ink-2)">BLS signature over</text>
    <text x="105" y="94" text-anchor="middle" font-size="10.5" style="fill:var(--ink-2)">a beacon header</text>
    <line x1="190" y1="70" x2="237" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />

    <rect x="240" y="20" width="310" height="112" rx="10" stroke-width="1.6" style="fill:var(--oxide-wash);stroke:var(--oxide)" />
    <text x="256" y="44" font-size="13" font-weight="700">ExecAnchor</text>
    <text x="256" y="66" font-size="10.5" class="mono">optimistic head: number · hash · slot</text>
    <text x="256" y="84" font-size="10.5" class="mono">finalized: number · root · hash</text>
    <text x="256" y="102" font-size="10.5" class="mono">known roots ≤ 8192 (fast path)</text>
    <text x="256" y="120" font-size="10.5" class="mono">recent heads ≤ 128 (eth_getProof)</text>

    <rect x="590" y="30" width="330" height="80" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-3)" />
    <text x="606" y="54" font-size="12" font-weight="700">Gloas (EIP-7732)</text>
    <text x="606" y="74" font-size="10.5" style="fill:var(--ink-2)">the light client proves only a block hash;</text>
    <text x="606" y="90" font-size="10.5" style="fill:var(--ink-2)">the pool fetches that header, and the anchor</text>
    <text x="606" y="104" font-size="10.5" style="fill:var(--ink-2)">adopts it iff keccak(RLP) == the hash</text>
    <line x1="590" y1="70" x2="553" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />

    <rect x="40" y="190" width="200" height="70" rx="8" stroke-width="1.4" style="fill:var(--ok-wash);stroke:var(--ok)" />
    <text x="140" y="216" text-anchor="middle" font-size="12.5" font-weight="700">MPT proof</text>
    <text x="140" y="234" text-anchor="middle" font-size="10.5">account / storage value</text>
    <text x="140" y="248" text-anchor="middle" font-size="10.5">against that state root</text>

    <rect x="300" y="190" width="140" height="70" rx="8" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="370" y="214" text-anchor="middle" font-size="12.5" font-weight="700">H(peer block)</text>
    <text x="370" y="232" text-anchor="middle" font-size="10.5" class="mono">stateRoot ==</text>
    <text x="370" y="246" text-anchor="middle" font-size="10.5" class="mono">the proof's root</text>
    <text x="471" y="230" text-anchor="middle" font-size="16" style="fill:var(--ink-3)">…</text>
    <rect x="500" y="190" width="140" height="70" rx="8" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="570" y="214" text-anchor="middle" font-size="12.5" font-weight="700">H(anchor − 1)</text>
    <text x="570" y="232" text-anchor="middle" font-size="10.5" class="mono">hash == child's</text>
    <text x="570" y="246" text-anchor="middle" font-size="10.5" class="mono">parentHash</text>
    <rect x="690" y="190" width="160" height="70" rx="8" stroke-width="1.6" style="fill:var(--oxide-wash);stroke:var(--oxide)" />
    <text x="770" y="214" text-anchor="middle" font-size="12.5" font-weight="700">H(anchor)</text>
    <text x="770" y="232" text-anchor="middle" font-size="10.5" class="mono">keccak(RLP) ==</text>
    <text x="770" y="246" text-anchor="middle" font-size="10.5" class="mono">attested block hash</text>

    <line x1="690" y1="225" x2="643" y2="225" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />
    <text x="666" y="216" text-anchor="middle" font-size="10">pins</text>
    <line x1="500" y1="225" x2="485" y2="225" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />
    <line x1="458" y1="225" x2="443" y2="225" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />
    <line x1="300" y1="225" x2="243" y2="225" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop12-arrow)" />
    <text x="271" y="216" text-anchor="middle" font-size="10">root</text>

    <path d="M480 132 C 600 160, 740 150, 770 187" fill="none" stroke-width="1.6" style="stroke:var(--oxide)" marker-end="url(#m-stop12-arrow)" />
    <text x="640" y="160" text-anchor="middle" font-size="10.5" style="fill:var(--oxide-ink)">hash ==</text>
    <path d="M300 132 C 260 152, 170 152, 140 187" fill="none" stroke-width="1.4" stroke-dasharray="5 4" style="stroke:var(--ink-3)" marker-end="url(#m-stop12-arrow)" />
    <text x="160" y="160" text-anchor="end" font-size="10" style="fill:var(--ink-2)">fast path</text>

    <text x="470" y="290" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">verify_header_chain: last hash == anchor · every parentHash link · first stateRoot == peer root · at most 8192 headers → “headerChain”</text>
    <text x="470" y="308" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">dashed: the peer's root is already a known attested root → “stateRootMatch”, no header walk</text>
  </svg>