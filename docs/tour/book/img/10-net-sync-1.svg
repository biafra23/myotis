<svg xmlns="http://www.w3.org/2000/svg" class="wide-diagram" viewBox="0 0 940 450" role="img" fill="currentColor" aria-label="Ownership across tasks. The engine host owns the SyncHandle, writes the WsPolicy atomics that the run_sync task reads, and keeps one Arc ClForkWatch per handle whose advisory it reads at status time. SyncHandle holds a watch receiver, a ReqRespClient, the run_sync JoinHandle and an Arc ExecAnchor. The run_sync task exclusively owns the peer pool, the light-client processor, the CL peer cache, staged updates, hunt state and the resume guard, and sends SyncStatus over the watch channel. It talks to the swarm task through mpsc commands and a shared Arc LocalStatus, receives discovered peers from the discovery task over an mpsc channel, shares an Arc AtomicBool hunt boost with it and aborts it on drop, and feeds the EL reader through an Arc ExecAnchor. The swarm task feeds peer Status digests and the discovery task feeds ENR eth2 fields into the ClForkWatch." width="940" height="450">
    <style>svg{color:#121a22;--ground:#eef1f4;--ground-2:#e6eaee;--surface:#f8fafb;--ink:#121a22;--ink-2:#47525f;--ink-3:#6b7784;--rule:#d3dae1;--rule-strong:#b7c1cb;--oxide:#b4441a;--oxide-ink:#8f3310;--oxide-wash:#f6e4dc;--jvm:#6a4bd8;--jvm-ink:#4f33b3;--jvm-wash:#ebe6fb;--ok:#1f7a4d;--ok-ink:#1f7a4d;--ok-wash:#dcefe4;--warn:#9a620a;--warn-ink:#7a4d08;--warn-wash:#f5ead3;--bad:#b42335;--bad-ink:#8f1c2a;--bad-wash:#f7dfe2}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#6b7784}</style><rect x="0.0" y="0.0" width="940.0" height="450.0" fill="#f8fafb" /><defs>
      <marker id="m-stop10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
      </marker>
    </defs>
    <rect x="20" y="20" width="230" height="200" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="34" y="44" font-size="13" font-weight="700">SyncHandle</text>
    <text x="34" y="60" font-size="10.5" style="fill:var(--ink-3)">held by the engine host</text>
    <g font-size="11.5" class="mono">
      <text x="34" y="88">status_rx: watch::Receiver</text>
      <text x="34" y="112">client: ReqRespClient</text>
      <text x="34" y="136">tasks: Vec&lt;JoinHandle&gt;</text>
      <text x="34" y="160">exec_anchor: Arc&lt;ExecAnchor&gt;</text>
    </g>
    <text x="34" y="200" font-size="10.5" style="fill:var(--ink-3)">stop(self): shutdown → abort → await</text>

    <rect x="330" y="20" width="280" height="250" rx="10" stroke-width="1.6" style="fill:var(--oxide-wash);stroke:var(--oxide)" />
    <text x="344" y="44" font-size="13" font-weight="700">run_sync task</text>
    <text x="344" y="60" font-size="10.5" style="fill:var(--ink-2)">sole owner, lent out as &amp;mut, no locks</text>
    <g font-size="11.5" class="mono">
      <text x="344" y="86">PeerPool</text>
      <text x="344" y="104">LightClientProcessor (store)</text>
      <text x="344" y="122">ClPeerCache · staged updates</text>
      <text x="344" y="140">HuntState · ResumeGuard</text>
    </g>
    <line x1="344" y1="154" x2="596" y2="154" stroke-width="1" style="stroke:var(--rule)" />
    <text x="344" y="172" font-size="10.5" style="fill:var(--ink-2)">also holds:</text>
    <g font-size="11.5" class="mono">
      <text x="344" y="192">ChainConfig · status_tx · client</text>
      <text x="344" y="210">Arc&lt;LocalStatus&gt; · Arc&lt;ExecAnchor&gt;</text>
      <text x="344" y="228">DiscoveryGuard(JoinHandle)</text>
      <text x="344" y="246">peer_rx · peer_tx (for respawns)</text>
    </g>

    <rect x="690" y="20" width="200" height="96" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="704" y="44" font-size="13" font-weight="700">swarm task</text>
    <text x="704" y="64" font-size="11" style="fill:var(--ink-2)">owns Swarm + SwarmCtx</text>
    <text x="704" y="82" font-size="11" style="fill:var(--ink-2)">answers inbound Status</text>
    <text x="704" y="98" font-size="11" style="fill:var(--ink-2)">from LocalStatus</text>

    <rect x="690" y="150" width="200" height="100" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="704" y="174" font-size="13" font-weight="700">discovery task</text>
    <text x="704" y="194" font-size="11" style="fill:var(--ink-2)">owns Discv5 (+ consumer task)</text>
    <text x="704" y="212" font-size="11" class="mono" style="fill:var(--ink-2)">Arc&lt;AtomicUsize&gt; table</text>
    <text x="704" y="230" font-size="11" class="mono" style="fill:var(--ink-2)">Arc&lt;AtomicBool&gt; boost</text>

    <rect x="690" y="320" width="230" height="110" rx="10" stroke-width="1.4" style="fill:var(--jvm-wash);stroke:var(--jvm)" />
    <text x="704" y="344" font-size="13" font-weight="700">ClForkWatch</text>
    <text x="704" y="362" font-size="11" class="mono" style="fill:var(--ink-2)">Arc, Mutex&lt;Inner&gt; inside</text>
    <text x="704" y="380" font-size="11" style="fill:var(--ink-2)">one vote per /24 source</text>
    <text x="704" y="398" font-size="11" style="fill:var(--ink-2)">one per handle, survives pause</text>

    <rect x="330" y="300" width="280" height="60" rx="10" stroke-width="1.4" stroke-dasharray="5 4" style="fill:none;stroke:var(--ink-3)" />
    <text x="470" y="326" text-anchor="middle" font-size="13" font-weight="700">EL reader (Stop 14)</text>
    <text x="470" y="346" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">anchors every verified read on ExecAnchor</text>

    <rect x="20" y="300" width="230" height="130" rx="10" stroke-width="1.4" style="fill:var(--surface);stroke:var(--ink-2)" />
    <text x="34" y="324" font-size="13" font-weight="700">engine host (Stop 16)</text>
    <text x="34" y="344" font-size="11" style="fill:var(--ink-2)">owns the SyncHandle</text>
    <text x="34" y="362" font-size="11" style="fill:var(--ink-2)">writes WsPolicy atomics</text>
    <text x="34" y="380" font-size="11" style="fill:var(--ink-2)">keeps Arc&lt;ClForkWatch&gt; per handle</text>
    <text x="34" y="398" font-size="11" style="fill:var(--ink-2)">merges EL + CL advisories</text>

    <line x1="330" y1="88" x2="253" y2="88" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop10-arrow)" />
    <text x="291" y="80" text-anchor="middle" font-size="10.5">watch</text>
    <line x1="250" y1="136" x2="327" y2="136" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m-stop10-arrow)" />
    <text x="289" y="128" text-anchor="middle" font-size="10.5">abort()</text>

    <line x1="610" y1="50" x2="687" y2="50" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop10-arrow)" />
    <text x="650" y="42" text-anchor="middle" font-size="10.5">mpsc</text>
    <line x1="610" y1="90" x2="687" y2="90" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="650" y="82" text-anchor="middle" font-size="10.5" style="fill:var(--oxide-ink)">set()</text>

    <line x1="690" y1="176" x2="613" y2="176" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop10-arrow)" />
    <text x="650" y="168" text-anchor="middle" font-size="10.5">peers</text>
    <line x1="610" y1="208" x2="687" y2="208" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="650" y="200" text-anchor="middle" font-size="10.5" style="fill:var(--oxide-ink)">boost</text>
    <line x1="610" y1="238" x2="687" y2="238" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m-stop10-arrow)" />
    <text x="650" y="258" text-anchor="middle" font-size="10.5">abort on drop</text>

    <line x1="470" y1="270" x2="470" y2="297" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="478" y="290" font-size="10.5" style="fill:var(--oxide-ink)">update_exec_anchor()</text>

    <line x1="790" y1="250" x2="790" y2="317" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="798" y="290" font-size="10.5" style="fill:var(--oxide-ink)">observe_enr</text>
    <path d="M890,68 H912 V317" fill="none" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="905" y="140" font-size="10.5" text-anchor="end" style="fill:var(--oxide-ink)" transform="rotate(-90 905 140)">observe_status</text>

    <line x1="135" y1="300" x2="135" y2="223" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop10-arrow)" />
    <text x="143" y="266" font-size="10.5">owns</text>
    <path d="M250,320 H292 V255 H327" fill="none" stroke-width="1.4" style="stroke:var(--oxide)" marker-end="url(#m-stop10-arrow)" />
    <text x="296" y="290" font-size="10.5" style="fill:var(--oxide-ink)">store()</text>
    <line x1="250" y1="415" x2="687" y2="415" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop10-arrow)" />
    <text x="470" y="408" text-anchor="middle" font-size="10.5">advisory() at status time</text>
  </svg>