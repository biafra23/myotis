      <line x1="875" y1="464" x2="715" y2="464" stroke-dasharray="5 4" marker-end="url(#m-stop17-arrow)" />
      <line x1="705" y1="518" x2="505" y2="518" stroke-dasharray="5 4" marker-end="url(#m-stop17-arrow)" />
      <line x1="495" y1="580" x2="140" y2="580" stroke-dasharray="5 4" marker-end="url(#m-stop17-arrow)" />
      <line x1="140" y1="652" x2="495" y2="652" marker-end="url(#m-stop17-arrow)" />
    </g>
    <g style="fill:var(--ink-3)">
      <circle cx="325" cy="140" r="3" /><circle cx="325" cy="178" r="3" /><circle cx="325" cy="250" r="3" />
      <circle cx="325" cy="580" r="3" /><circle cx="325" cy="652" r="3" />
    </g>
    <rect x="650" y="560" width="300" height="128" rx="8" stroke-width="1.5" style="fill:var(--bad-wash);stroke:var(--bad)" />
    <g font-size="10.5">
      <text x="664" y="580" font-weight="700" style="fill:var(--bad-ink)">If the Rust code panics</text>
      <text x="664" y="598">Release build (panic = "abort"), as shipped:</text>
      <text x="664" y="612">the process aborts; nothing returns.</text>
      <text x="664" y="634">Unwinding build (dev profile): catch_unwind</text>
      <text x="664" y="648">sets code 2 plus a message buffer, and</text>
      <text x="664" y="662">Kotlin throws InternalException.</text>
    </g>
    <line x1="15" y1="722" x2="795" y2="722" stroke-width="3" style="stroke:var(--jvm)" />
    <line x1="815" y1="722" x2="945" y2="722" stroke-width="3" style="stroke:var(--ink-3)" />
    <g font-size="11">
      <text x="405" y="742" text-anchor="middle" style="fill:var(--jvm-ink)">steps ① to ⑫ all run on ONE thread: the JVM thread that called. JNA does not switch threads.</text>
      <text x="880" y="742" text-anchor="middle" style="fill:var(--ink-2)">the runtime's own threads</text>
    </g>
  </svg>