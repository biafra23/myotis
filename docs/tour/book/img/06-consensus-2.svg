<svg xmlns="http://www.w3.org/2000/svg" class="wide-diagram" viewBox="0 0 900 250" role="img" fill="currentColor" aria-label="Store state machine. Uninitialized moves to period P without next committee through initialize or restore. A verified update attested in P whose next-committee branch checks out moves it to period P with next committee held. When the finalized slot crosses into a later period, or the wall clock is past P, next is taken into current and the period increments, returning to the no-next state at P plus one." width="900" height="250">
      <style>svg{color:#121a22;--ground:#eef1f4;--ground-2:#e6eaee;--surface:#f8fafb;--ink:#121a22;--ink-2:#47525f;--ink-3:#6b7784;--rule:#d3dae1;--rule-strong:#b7c1cb;--oxide:#b4441a;--oxide-ink:#8f3310;--oxide-wash:#f6e4dc;--jvm:#6a4bd8;--jvm-ink:#4f33b3;--jvm-wash:#ebe6fb;--ok:#1f7a4d;--ok-ink:#1f7a4d;--ok-wash:#dcefe4;--warn:#9a620a;--warn-ink:#7a4d08;--warn-wash:#f5ead3;--bad:#b42335;--bad-ink:#8f1c2a;--bad-wash:#f7dfe2}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#6b7784}</style><rect x="0.0" y="0.0" width="900.0" height="250.0" fill="#f8fafb" /><defs>
        <marker id="m-stop06-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
      </defs>
      <rect x="20" y="70" width="170" height="70" rx="10" stroke-width="1.4" stroke-dasharray="5 4" style="fill:none;stroke:var(--ink-3)" />
      <text x="105" y="100" text-anchor="middle" font-size="13.5" font-weight="700">Uninitialized</text>
      <text x="105" y="119" text-anchor="middle" font-size="11" class="mono" style="fill:var(--ink-3)">current = None</text>

      <rect x="330" y="70" width="210" height="70" rx="10" stroke-width="1.5" style="fill:var(--surface);stroke:var(--ink-2)" />
      <text x="435" y="98" text-anchor="middle" font-size="13.5" font-weight="700">Period P</text>
      <text x="435" y="117" text-anchor="middle" font-size="11.5" class="mono">next = None</text>
      <text x="435" y="133" text-anchor="middle" font-size="10.5" style="fill:var(--ink-3)">only P verifies (current keys)</text>

      <rect x="680" y="70" width="200" height="70" rx="10" stroke-width="1.5" style="fill:var(--oxide-wash);stroke:var(--oxide)" />
      <text x="780" y="98" text-anchor="middle" font-size="13.5" font-weight="700">Period P</text>
      <text x="780" y="117" text-anchor="middle" font-size="11.5" class="mono">next = Some(committee)</text>
      <text x="780" y="133" text-anchor="middle" font-size="10.5" style="fill:var(--ink-3)">P current keys · P+1 next keys</text>

      <line x1="190" y1="105" x2="327" y2="105" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop06-arrow2)" />
      <text x="258" y="95" text-anchor="middle" font-size="11" class="mono" style="fill:var(--ink-2)">initialize()</text>
      <text x="258" y="124" text-anchor="middle" font-size="11" class="mono" style="fill:var(--ink-2)">restore()</text>

      <line x1="540" y1="96" x2="677" y2="96" stroke="currentColor" stroke-width="1.4" marker-end="url(#m-stop06-arrow2)" />
      <text x="608" y="46" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">an update attested in P</text>
      <text x="608" y="62" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">verifies, and its next-</text>
      <text x="608" y="78" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">committee branch checks</text>

      <path d="M780 140 C 780 215, 435 215, 435 143" fill="none" stroke-width="1.6" style="stroke:var(--oxide)" marker-end="url(#m-stop06-arrow2)" />
      <text x="608" y="188" text-anchor="middle" font-size="11.5" class="mono" style="fill:var(--oxide-ink)">current = next.take(); period += 1</text>
      <text x="608" y="206" text-anchor="middle" font-size="11" style="fill:var(--ink-2)">finalized slot crosses a period, or wall clock is past P</text>
      <text x="608" y="236" text-anchor="middle" font-size="11" style="fill:var(--ink-3)">(back in “next = None”, now at P+1)</text>
    </svg>