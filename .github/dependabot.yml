# Dependency updates as reviewed PRs (#734, Part 3, decision D-e). Every pin in
# this repo is exact — actions by commit SHA, crates by Cargo.lock, Gradle
# modules by lockfile + verification-metadata.xml — so nothing moves on its own;
# this is how the pins move ON PURPOSE.
#
# Gradle PRs need their pins regenerated (Dependabot edits the catalog but not
# the lockfiles or the hash list): gradle-pins-dependabot.yml does that on the
# Linux host and pushes the result to the PR branch; per-host hashes, if a bump
# needs any, come from the `gradle pins` check's merged artifact
# (scripts/update_gradle_pins.sh --from-ci). Review the hash diff like code.
#
# Not covered by any ecosystem here, so bumped by hand in a reviewed PR:
# rust/rust-toolchain.toml, gradle/libs.versions.toml's android-ndk /
# android-build-tools / cargo-ndk, .java-version, .xcode-version and the runner
# image labels. claude-review.yml's actions stay on tags (see its header).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - "/rust"
      - "/rust/roost"
      - "/rust/tor-poc"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
