name: Go engine

on:
  # Pushes to main. (It also built feature/go-engine, whose work landed with
  # #773; that entry is dropped.) The path filter keeps Gradle/Rust work from
  # paying for this job and vice versa.
  push:
    branches: [ "main" ]
    paths:
      - "go/**"
      - ".github/workflows/go-engine.yml"
      # The Go tests read these and no one else re-checks them for Go:
      # TestCheckpointMatchesRustEngine compares against the Rust anchor
      # (a release refresh MUST turn the Go build red on its own PR, not
      # on the next unrelated go/ touch), and the lc/chain replays read
      # the shared corpus.
      - "rust/myotis-net/src/sync.rs"
      - "rust/testdata/**"
  # pull_request unscoped (any base branch), like every other workflow here:
  # part PRs into feature/go-engine must get these checks too.
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-engine.yml"
      - "rust/myotis-net/src/sync.rs"
      - "rust/testdata/**"
  workflow_dispatch:

jobs:
  build:
    # Distinct from ci.yml's "Build and Test" — required-check matching is by
    # name, and this job is path-filtered so it is absent on most PRs.
    name: Go build and test
    # A fixed runner image and SHA-pinned actions, like every other workflow:
    # a tag or `-latest` label moves under the build without a commit here.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # The blst the reproducible-builds gate compares (scripts/repro/build_linux.sh
    # defines these flags): portable, run-time ADX/BMI2 dispatch, as the Rust
    # engine's. Without them the tests would run the bindings' -D__ADX__ build.
    env:
      CGO_CFLAGS: "-O2 -g -D__BLST_PORTABLE__"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Test
        working-directory: go
        # -race: the discovery package is goroutines + mutexes + a
        # close/iterator handshake; keep the race detector on it.
        run: go test -race ./...
