name: Go engine

on:
  # Pushes to main. (It also built feature/go-engine, whose work landed with
  # #773; that entry is dropped.) The path filter keeps Gradle/Rust work from
  # paying for this job and vice versa.
  push:
    branches: [ "main" ]
    paths:
      - "go/**"
      - ".github/workflows/go-engine.yml"
      # The Go tests read these and no one else re-checks them for Go:
      # TestCheckpointMatchesRustEngine compares against the Rust anchor
      # (a release refresh MUST turn the Go build red on its own PR, not
      # on the next unrelated go/ touch), and the lc/chain replays read
      # the shared corpus.
      - "rust/myotis-net/src/sync.rs"
      - "rust/testdata/**"
      # The read-selector window pins (TestReadWindowConstantsMatchRustEngine)
      # read the tolerances out of the Rust engine's host.rs, and no other Go
      # trigger covers it: moving CALL_BLOCK_LAG_TOLERANCE there MUST turn the
      # Go build red on its own PR, not on the next unrelated go/ touch
      # (PR #889 review).
      - "rust/myotis-engine/src/host.rs"
      # cmd/myotis-capi's cgo preamble INCLUDES the C ABI header, so a
      # prototype added there MUST turn the Go build red on its own PR
      # (PR #827 review: the symbol check alone compares names).
      - "rust/include/myotis_engine.h"
  # pull_request unscoped (any base branch), like every other workflow here:
  # part PRs into feature/go-engine must get these checks too.
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-engine.yml"
      - "rust/myotis-net/src/sync.rs"
      - "rust/testdata/**"
      - "rust/myotis-engine/src/host.rs"
      - "rust/include/myotis_engine.h"
  workflow_dispatch:

jobs:
  build:
    # Distinct from ci.yml's "Build and Test" — required-check matching is by
    # name, and this job is path-filtered so it is absent on most PRs.
    name: Go build and test
    # A fixed runner image and SHA-pinned actions, like every other workflow:
    # a tag or `-latest` label moves under the build without a commit here.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # ONE env block for the job (a merge of main's and the feature's — the
    # file carried two `env:` keys between the two merges and the workflow
    # parser rejects a duplicate mapping key, which silently cost this PR its
    # Go CI). These are the reproducible-builds gate's own CGO_CFLAGS:
    # scripts/repro/build_linux.sh pairs them with this workflow by name, so
    # the blst CONFIGURATION tested here is the one the gate builds and
    # compares between its two legs — the same flags, not the same bytes
    # (the gate additionally builds with -trimpath and the builder image's
    # pinned gcc, both of which change object bytes; build_linux.sh:95-97
    # calls the C compiler a build input for exactly that reason). The
    # PORTABLE define is the cross-build constant (#734 D3) — blst's Go
    # binding compiles ADX paths on amd64, and its load-time constructor
    # answers SIGILL with _exit(132), which would KILL whatever process
    # dlopens the c-shared library on a pre-Broadwell/pre-Zen machine, past
    # every UnsatisfiedLinkError handler; goBuildCShared, the Rust workspace
    # and the gate all carry it. goBuildCShared (whose library the desktop
    # launches — not yet a release artifact, build.gradle.kts notes) omits
    # -g, which adds debug info and no instructions; whether its objects
    # match CI's instruction-for-instruction depends on the compiler being
    # the same, which the task does not promise (it uses the local one).
    # (PR #832 round-3 review added this block, which built bare before.)
    env:
      CGO_CFLAGS: "-O2 -g -D__BLST_PORTABLE__"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Test
        working-directory: go
        # -race: the discovery package is goroutines + mutexes + a
        # close/iterator handshake; keep the race detector on it.
        run: go test -race ./...

      - name: c-shared C ABI
        working-directory: go
        # The part 1b contract: the c-shared build links AND exports
        # every symbol myotis_engine.h declares (functional or honest
        # refusal), so the JVM binding in part 1c is a library-name
        # swap — see go/scripts/check_capi_symbols.sh.
        run: |
          go build -buildmode=c-shared -o build/libmyotis_engine_go.so ./cmd/myotis-capi
          scripts/check_capi_symbols.sh
