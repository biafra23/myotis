# Automated Claude code review on every pull request (replaces the sunset
# Gemini Code Assist reviews).
#
# Setup (one-time, repo admin):
#   1. Install the Claude GitHub App on this repo (github.com/apps/claude, or
#      run /install-github-app from the Claude Code CLI).
#   2. Add the CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`) —
#      reviews bill the Claude subscription and share its usage limits. To bill
#      API credits instead, swap the input below for
#      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}.
#
# Model strategy — Fable 5 first, the newest Opus when its limit is exhausted:
#   Usage limits are PER MODEL, so an exhausted Fable 5 limit leaves Opus
#   untouched. Fable 5 is the more capable reviewer, so it gets first refusal;
#   Opus covers the gap instead of the review silently not happening (which
#   is what did happen on 2026-08-07: the job errored at turn 1 for
#   total_cost_usd 0, having read nothing and posted nothing).
#
#   The retry does NOT assume the failure was a usage limit. A timeout, an API
#   error, or an action failure can strike AFTER Claude has already posted a
#   summary or inline findings (the action flushes buffered inline comments in
#   an always() sub-step), and a second review on top of that would duplicate
#   or contradict the first. So the fallback is gated on the property we
#   actually care about — that the failed attempt posted nothing — measured by
#   comparing the PR's comment count before and after. If the first attempt
#   failed after posting, the fallback is suppressed and the job fails loudly
#   instead of quietly stacking two reviews.
#
#   NOT --fallback-model: that flag only covers "overloaded or not available".
#   Verified against a live exhausted limit — it falls back correctly from a
#   retired model, but a usage-limit rejection does not trigger it.
#
# Scope decisions:
#   - Reviews once per PR (opened / reopened / ready_for_review), NOT on every
#     push (`synchronize`) — re-run the workflow from the Actions tab (or
#     close/reopen the PR) for a fresh pass after big changes. Note a re-run
#     replays the ORIGINAL commit and workflow file, so it cannot pick up a
#     workflow change; close/reopen is the way to get a fresh one.
#   - Drafts are skipped until marked ready.
#   - Fork PRs are skipped: `pull_request` runs from forks get no secrets, so
#     the job could only fail there. Same-repo PRs are the review target.
#   - The reviewer's instructions come from the PR's base, not its own tree.
#     A same-repo branch is not necessarily trusted (a prompt-injected session
#     can push one and open its PR), so the prompt file is read from the base
#     commit (see "Assemble review prompt"), and claude-code-action itself
#     restores the root CLAUDE.md, CLAUDE.local.md and .claude/ from the base
#     branch (its docs/security.md). It does NOT restore a CLAUDE.md in a
#     subdirectory, which Claude Code loads once the reviewer reads a file
#     there — a PR that adds one still reaches the reviewer.
#   - A PR that edits THIS FILE cannot review itself: the action requires the
#     workflow to match the default branch and skips (green, but a no-op).
#     Changes here are only exercised once merged to main.
name: claude-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Both attempts below send the identical prompt, so it lives in one file
      # and is assembled once here. GitHub Actions has no YAML anchors, and
      # duplicating the prompt across two steps would drift.
      #
      # The file is read from the PR's BASE commit, never from the checkout
      # above: that checkout is the PR's own tree, and reading the prompt from
      # it would let the PR under review write its reviewer's instructions. So
      # a PR that edits .github/claude-review-prompt.md is reviewed with the
      # base prompt until it is merged — intended. "Base" is whatever branch
      # the PR targets, so a PR into another unmerged branch gets that
      # branch's prompt.
      - name: Assemble review prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Load-bearing, not tidiness: with an empty BASE_SHA the `git show`
          # below would read ":<path>" — the index, i.e. the PR's own copy.
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Unexpected base SHA: '$BASE_SHA'"; exit 1; }
          # The checkout is a depth-1 clone of the merge commit, which does not
          # include the base commit itself.
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_SHA"
          # Read before anything is written, so a failure cannot leave an
          # unterminated block in $GITHUB_OUTPUT.
          prompt=$(git show "$BASE_SHA:.github/claude-review-prompt.md") \
            || { echo "::error::The base commit $BASE_SHA has no .github/claude-review-prompt.md, and the prompt is never taken from the PR's own tree. Review this PR by hand, or bring its base branch up to date with main."; exit 1; }
          {
            echo 'text<<CLAUDE_PROMPT_EOF'
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUMBER"
            echo
            printf '%s\n' "$prompt"
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Baseline for the "posted nothing" check below. `.comments` (issue
      # comments) + `.review_comments` (inline) come straight off the PR object,
      # so this is one call with no pagination to get wrong.
      - name: Count review feedback before the first attempt
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assign, don't inline into echo: a failed gh api inside an echo
          # argument would still exit 0 and silently record an empty baseline.
          n=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.comments + .review_comments')
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected comment count: '$n'"; exit 1; }
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # First choice. continue-on-error so an exhausted Fable 5 limit falls
      # through to the Opus fallback below instead of failing the job.
      - name: Review (Fable 5)
        id: fable
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-fable-5
            --effort max
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # `outcome` is the raw step result (conclusion is masked to success by
      # continue-on-error), so this fires exactly when Fable 5 failed. The
      # action has already flushed any buffered inline comments by now, so an
      # unchanged count means genuinely nothing was posted and a second attempt
      # is safe. A human commenting during the review window also trips this —
      # rare, and it fails safe (a loud skip, never a silent duplicate).
      - name: Did the failed attempt post anything?
        id: unposted
        if: steps.fable.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before='${{ steps.before.outputs.count }}'
          now=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            --jq '.comments + .review_comments')
          [[ "$now" =~ ^[0-9]+$ && "$before" =~ ^[0-9]+$ ]] \
            || { echo "::error::Non-numeric comment count (before='$before' now='$now')"; exit 1; }
          echo "before=$before now=$now"
          if [ "$now" -eq "$before" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fable 5 failed after posting $((now - before)) comment(s) — suppressing the Opus fallback so the PR does not get two overlapping reviews."
          fi

      # `opus` is Claude Code's alias for the latest Opus, not a model ID, so
      # this fallback moves to each new Opus with no edit here; the full ID it
      # used to name, `claude-opus-5`, stays on that one model. Claude Code
      # resolves the alias at run time from Anthropic's model catalog: the one
      # built into the Claude Code that the floating `@v1` bundles (bumped
      # nearly daily), or a per-account one when Anthropic's servers supply it.
      # One trap: an ANTHROPIC_DEFAULT_OPUS_MODEL env var (job env, or `env`
      # in a committed .claude/settings.json) overrides the alias. Verified
      # 2026-09-25 with action v1.0.234 / Claude Code 2.1.282: `opus` resolves
      # to claude-opus-5-5; each run's "Claude Code initialized" log line names
      # the model it got. To pin one Opus instead, put its full ID here.
      - name: Review (latest Opus — Fable 5 failed, posted nothing)
        if: steps.fable.outcome == 'failure' && steps.unposted.outputs.safe == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model opus
            --effort max
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Suppressing the fallback must not look like a clean review. Without
      # this the job would go green (continue-on-error masks the Fable 5
      # failure) having left only a partial review on the PR.
      - name: Fail when the review was left incomplete
        if: steps.fable.outcome == 'failure' && steps.unposted.outputs.safe != 'true'
        run: |
          echo "::error::The Fable 5 review failed partway through, after already posting to the PR. The Opus fallback was suppressed to avoid a duplicate review, so this PR has only partial feedback — close/reopen it for a clean pass."
          exit 1
