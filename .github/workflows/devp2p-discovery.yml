name: devp2p Discovery Test

on:
  workflow_dispatch:   # run manually from the Actions tab
  push:
    branches: ["main", "main-gt6j7"]
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC

jobs:
  discover:
    name: Peer Discovery (UDP allowed)
    runs-on: ubuntu-26.04
    # Cold-cache days (post-outage evictions) compile the whole Rust workspace
    # (~12 min) before Gradle even reaches the 5-min discovery run — 15 min
    # guaranteed a timeout there. Warm runs stay well under the old budget.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: .java-version  # exact Temurin release, one place (#734)
      - name: Set up Rust
        # The rustc rust/rust-toolchain.toml pins, like every Rust lane
        # (#734) — not the runner image's preinstalled rustc, which lags on
        # its own schedule, keys the cache to a different compiler, and if it
        # ever fell below the Gradle probe's floor, cargoBuildHost would
        # silently self-skip and this workflow would quietly stop exercising
        # the Rust build.
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust build
        # The :app build compiles the Rust workspace (cargoBuildHost auto-runs
        # before :app:run); without this cache a cold run eats the whole job
        # budget in cargo. Same action/config as the other Rust workflows.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build
        # (--offline was a jitpack-403 workaround for the retired tuweni-kotlin fork;
        # deps now come from Maven Central, so fetch normally.)
        # -PskipRustEngine: no Rust/Android toolchain here, and :android-app builds
        # the engine from source by default; this job only exercises the JVM daemon.
        run: ./gradlew build -x test --no-daemon -PskipRustEngine

      - name: Run devp2p discovery (5 min timeout)
        id: discovery
        run: |
          # Capture output; allow the app to exit with non-zero (timeout case) without failing
          ./gradlew :app:run --no-daemon 2>&1 | tee discovery.log || true

      - name: Report result
        run: |
          echo "--- Summary ---"
          if grep -q "BLOCK HEADERS RECEIVED" discovery.log; then
            echo "SUCCESS: block headers were received from the Ethereum network!"
            grep -A 10 "BLOCK HEADERS RECEIVED" discovery.log
          else
            echo "TIMEOUT or no headers received within 300 s."
            echo "Peer table / connection stats:"
            grep -E "(Table has|attempted|discv4|Attempting)" discovery.log | tail -30 || true
            # Don't fail the job – UDP may still be restricted on this runner
          fi

      - name: Upload discovery log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: discovery-log
          path: discovery.log
          retention-days: 7
