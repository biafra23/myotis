# The engine library's publication: eth.myotis:myotis-engine (the Android AAR +
# the desktop jar), the modules its POMs reach, the desktop host libraries
# (eth.myotis:myotis-engine-natives-<platform>, built by the host-natives matrix)
# and the iOS module (eth.myotis:myotis-engine-ios, staged by the macOS ios-engine
# job), staged as a Maven repository
# and checked (scripts/check_engine_library.sh) on every run; on a `v*` tag,
# published to GitHub Packages, merged into the `maven-repo` branch (a Maven
# repository URL that needs no token) and attached to the release as the bare
# AAR plus a zip of that repository, with a SHA256SUMS file. Consumer side:
# docs/android-library.md. Which modules, and why: the `Publishing` section of
# the root build.gradle.kts.
#
# The APK workflow already builds the same AAR into the Myotis app on every
# push to main; what this one adds is the PUBLICATION — the coordinates, the
# POMs and module metadata a consumer resolves, the strict JNA pin in them,
# and an AAR checked on its own rather than merged into an app.
name: Engine library

on:
  # Pushes to main only where the publication can change (its modules, the
  # root build that defines it, the Rust engine inside the AAR, this file and
  # its check) — like node-binding.yml. GitHub does not evaluate paths filters
  # for tag pushes, so `v*` release runs always fire. No pull_request trigger:
  # the Rust Android cross-compile this needs is a 10-minute leg, and the APK
  # workflow already runs it on every PR into main; a PR that changes the
  # publication dispatches this on its branch from the Actions tab.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'myotis-api/**'
      - 'myotis-engine-common/**'
      - 'myotis-engine-ports/**'
      - 'myotis-rpc-policy/**'
      - 'myotis-engine-rust/**'
      - 'myotis-engine/**'
      - 'myotis-engine-natives/**'
      - 'myotis-engine-ios/**'
      - 'rust/**'
      - 'scripts/check_engine_library.sh'
      - 'scripts/merge_maven_repo.py'
      - '.github/workflows/engine-library.yml'
      - '.github/actions/stage-engine-library/**'
      - '.github/workflows/release-version-guard.yml'
  workflow_dispatch:

# The event is part of the group so a dispatch on main cannot cancel an
# in-flight merge-to-main run, nor one on a v* tag that tag's publish —
# as in node-binding.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust engine's host library, one leg per line of
  # myotis-engine-natives/platforms.txt (the check fails a publication missing one,
  # so a line without a leg here cannot ship). Built by the root cargoBuildHost —
  # the same command, workspace and features the desktop apps bundle — with the
  # platform's triple named explicitly on every leg: the x64 macOS leg cross-compiles
  # on an arm64 runner, as desktop-dmg.yml's does, and a triple on all of them gives
  # every leg the one output path. The Linux legs run on Ubuntu 22.04, so the
  # library needs glibc 2.35, not the newest runner's. Each leg uploads
  # <jna-prefix>/<library>; the jobs below merge them into one directory for
  # -PengineNativesDir. Windows: a line in platforms.txt and a leg here, later.
  host-natives:
    name: Engine host library (${{ matrix.prefix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { prefix: darwin-aarch64, runner: macos-14,         target: aarch64-apple-darwin,      library: libmyotis_engine.dylib }
          - { prefix: darwin-x86-64,  runner: macos-14,         target: x86_64-apple-darwin,       library: libmyotis_engine.dylib }
          - { prefix: linux-x86-64,   runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  library: libmyotis_engine.so }
          - { prefix: linux-aarch64,  runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, library: libmyotis_engine.so }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: engine-natives-${{ matrix.prefix }}
          # The tag's run restores main's cache; it does not save one.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the host library
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Retried like every Gradle call here: configuring the build resolves the
          # plugins, and a resolution blip on one leg would fail the publication.
          built=0
          for attempt in 1 2 3; do
            ./gradlew cargoBuildHost --stacktrace && { built=1; break; }
            echo "::warning::cargoBuildHost attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          [ "$built" = 1 ] || { echo "::error::cargoBuildHost failed after 3 attempts"; exit 1; }
          lib="rust/target/${RUST_TARGET}/release/${{ matrix.library }}"
          # cargoBuildHost self-skips without cargo; here that is an error.
          [ "$lib" -nt gradlew ] || { echo "::error::$lib was NOT built"; exit 1; }
          mkdir -p "build/engine-natives/${{ matrix.prefix }}"
          cp "$lib" "build/engine-natives/${{ matrix.prefix }}/"
          file "build/engine-natives/${{ matrix.prefix }}/${{ matrix.library }}"

      - name: Upload the host library
        uses: actions/upload-artifact@v4
        with:
          name: engine-natives-${{ matrix.prefix }}-${{ github.sha }}
          path: build/engine-natives
          if-no-files-found: error
          # The default 90 days, as for the staged repository: a tag's publish job
          # re-run needs these too.
          overwrite: true

  # The iOS module, eth.myotis:myotis-engine-ios: the Rust engine's C ABI as
  # Kotlin/Native cinterop with libmyotis_engine.a inside each target's cinterop
  # klib. Its cinterop needs Apple's SDK, so it is staged here on macOS (both
  # triples built fresh by the root cargoBuildIos* tasks) with the same
  # -PpublishRelease the Linux staging uses, and the jobs below merge it into the
  # set they stage, check and publish; on Linux the module disables itself and
  # stages nothing (myotis-engine-ios/build.gradle.kts).
  #
  # On a tag this job is also the module's GitHub Packages publish, from the same
  # Gradle invocation that stages it (so the staged bytes are the published ones,
  # and Gradle merges the remote maven-metadata.xml as for every other module):
  # Gradle on Linux has the module disabled. Hence the version guard first. The
  # rest of the set is checked and published by the publish job, which also
  # checks this module's staged files before anything of its own goes up; a
  # failure there leaves this module's version on GitHub Packages, to delete
  # with the others before a re-run — with "Re-run all jobs", so this job
  # publishes it again (the publish job's note; that job checks it is there).
  ios-engine:
    name: Engine iOS module (myotis-engine-ios)
    needs: version-guard
    # version-guard runs on tags only: skipped elsewhere, which must not skip this.
    if: ${{ !cancelled() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # The tag's GitHub Packages publish (see above).
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (aarch64)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'aarch64'

      - name: Set up Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: engine-ios
          # The tag's run restores main's cache; it does not save one.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage the iOS module
        run: |
          set -euo pipefail
          chmod +x gradlew
          # -PpublishRelease=<version> on a tag; bare -PpublishRelease otherwise —
          # the stage action's rule, so both halves carry the one version.
          flag="-PpublishRelease"
          case "${GITHUB_REF}" in refs/tags/v*) flag="-PpublishRelease=${GITHUB_REF_NAME#v}" ;; esac
          staged=0
          for attempt in 1 2 3; do
            rm -rf build/maven-repo
            ./gradlew "$flag" :myotis-engine-ios:publishAllPublicationsToStagingRepository --stacktrace \
              && { staged=1; break; }
            echo "::warning::staging attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          [ "$staged" = 1 ] || { echo "::error::staging myotis-engine-ios failed after 3 attempts"; exit 1; }
          echo "STAGE_FLAG=$flag" >> "$GITHUB_ENV"
          # A disabled module (no iOS rustup targets after all) stages nothing and
          # exits 0; the publication check would catch it on Linux, this says why.
          for triple in aarch64-apple-ios aarch64-apple-ios-sim; do
            lib="rust/target/$triple/release/libmyotis_engine.a"
            [ "$lib" -nt gradlew ] || { echo "::error::$lib was NOT built (cargoBuildIos* self-skipped?)"; exit 1; }
          done
          ls -d build/maven-repo/eth/myotis/myotis-engine-ios* \
            || { echo "::error::nothing was staged: :myotis-engine-ios was disabled"; exit 1; }
          find build/maven-repo -type f -name '*.klib' -exec ls -l {} +
          # The engine inside each target's cinterop klib, under the maven-repo
          # branch's file limit: check_engine_library.sh's iOS checks, run here too
          # because the tag's publish below comes before the Linux check (the full
          # check there adds what needs the whole set: one version, the closure).
          shopt -s nullglob
          klibs=(build/maven-repo/eth/myotis/myotis-engine-ios-*/*/*-cinterop-*.klib)
          shopt -u nullglob
          [ "${#klibs[@]}" -eq 2 ] \
            || { echo "::error::expected 2 cinterop klibs (one per iOS target), found ${#klibs[@]}"; exit 1; }
          for k in "${klibs[@]}"; do
            size=$(wc -c < "$k" | tr -d ' ')
            [ "$size" -lt 95000000 ] \
              || { echo "::error::$k is $size bytes, near GitHub's 100 MB file limit"; exit 1; }
            archive=$(unzip -Z1 "$k" | { grep '/included/libmyotis_engine\.a$' || true; })
            [ -n "$archive" ] || { echo "::error::$k does not include libmyotis_engine.a"; exit 1; }
            unzip -p "$k" "$archive" > "$RUNNER_TEMP/engine.a"
            LC_ALL=C grep -q '_myotis_init' "$RUNNER_TEMP/engine.a" \
              || { echo "::error::$k: $archive does not define myotis_init"; exit 1; }
          done

      # Same build, no rebuild: the tasks above are up to date, so Gradle uploads
      # the staged outputs (as the publish job does for the rest of the set).
      - name: Publish the iOS module to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew "$STAGE_FLAG" :myotis-engine-ios:publishAllPublicationsToGitHubPackagesRepository --stacktrace

      - name: Upload the staged iOS module
        uses: actions/upload-artifact@v4
        with:
          name: engine-ios-${{ github.sha }}
          path: build/maven-repo
          if-no-files-found: error
          # The default 90 days, as for the host libraries: a tag's publish job
          # re-run needs it too.
          overwrite: true

  # Stage + check, no upload: every push to main and every dispatch. Not on a
  # tag — there the publish job below IS the build, so the tag's assets and its
  # GitHub Packages artifacts come from one build (a second build would not
  # produce the same bytes: jars are not reproducible here).
  build:
    name: Stage and check the publication
    needs: [host-natives, ios-engine]
    # Explicit results: ios-engine depends on version-guard, which is skipped off a
    # tag, and the implicit success() skips every job downstream of a skipped one.
    if: >-
      ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/v')
          && needs.host-natives.result == 'success' && needs.ios-engine.result == 'success' }}
    runs-on: ubuntu-latest
    # A wedged cargo-ndk or Gradle daemon must not hold the runner for the
    # 6-hour default (android-apk.yml's budget for the same build).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the host libraries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-natives-*-${{ github.sha }}
          path: build/engine-natives
          merge-multiple: true

      - name: Download the staged iOS module
        uses: actions/download-artifact@v4
        with:
          name: engine-ios-${{ github.sha }}
          path: build/engine-ios

      - name: Stage and check the publication
        uses: ./.github/actions/stage-engine-library
        with:
          natives-dir: build/engine-natives
          ios-dir: build/engine-ios

      - name: Upload the staged repository
        uses: actions/upload-artifact@v4
        with:
          name: engine-library-maven-repo-${{ github.sha }}
          path: build/maven-repo
          if-no-files-found: error
          retention-days: 30

  # Refuse to publish a release whose tag disagrees with the project version —
  # the artifacts carry project.version (minus -SNAPSHOT), the release is named
  # after the tag. See release-version-guard.yml; runs in parallel with nothing
  # here (the publish job waits for it), ~30s.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # The tag build: stage, check, publish to GitHub Packages, attach to the
  # release. Builds itself (see the build job's note) — the same steps, with
  # the tag's version: vX.Y.Z publishes X.Y.Z, vX.Y.Z-rc1 publishes X.Y.Z-rc1.
  #
  # Re-running a tag's publish: GitHub Packages refuses to overwrite a version
  # (the Gradle publish fails with 409/422), so a republish needs that package
  # version deleted first — every eth.myotis.* package of it — in the
  # repository's Packages page. Then "Re-run all jobs", not "Re-run failed
  # jobs": eth.myotis:myotis-engine-ios is published by the ios-engine job,
  # which a failed-jobs re-run leaves out (the step after the Gradle publish
  # fails the run if the module is missing). The release assets re-upload
  # with --clobber.
  publish:
    name: Publish to GitHub Packages and the release
    needs: [version-guard, host-natives, ios-engine]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # gh release create/upload/edit needs write access to Releases; the Maven
      # publish needs write access to Packages.
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the host libraries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-natives-*-${{ github.sha }}
          path: build/engine-natives
          merge-multiple: true

      - name: Download the staged iOS module
        uses: actions/download-artifact@v4
        with:
          name: engine-ios-${{ github.sha }}
          path: build/engine-ios

      # Everything below uploads; nothing is uploaded unless the staged set is
      # complete and correct (the action's check). The tag's version is what
      # the artifacts carry — v0.1.16-rc1 publishes 0.1.16-rc1, never the
      # final 0.1.16 coordinates, which GitHub Packages could not replace.
      - name: Stage and check the release publication
        uses: ./.github/actions/stage-engine-library
        with:
          release-tag: ${{ github.ref_name }}
          natives-dir: build/engine-natives
          ios-dir: build/engine-ios
          # The tag's run restores main's cache; it does not save one.
          save-rust-cache: 'false'

      # The same build, published again by Gradle to GitHub Packages: the
      # staged files and these are the outputs of the one build above (the
      # jars, poms and module files are task outputs Gradle reuses, not
      # rebuilt). GITHUB_ACTOR is set by Actions; the token is the job's. The
      # natives directory too, or the natives publications would be the runner's
      # own host build instead of the staged set.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew "-PpublishRelease=${GITHUB_REF_NAME#v}" -PengineNativesDir=build/engine-natives publishAllPublicationsToGitHubPackagesRepository --stacktrace

      # The iOS module went up from the ios-engine job (Gradle here has it
      # disabled): make sure it is there, or a re-run of this job alone after a
      # deleted version would publish everything but it, all green.
      - name: Check the iOS module is on GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          for a in myotis-engine-ios myotis-engine-ios-iosarm64 myotis-engine-ios-iossimulatorarm64; do
            url="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/eth/myotis/$a/$v/$a-$v.pom"
            curl -fsS -o /dev/null -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$url" \
              || { echo "::error::eth.myotis:$a:$v is not on GitHub Packages — re-run ALL jobs (the ios-engine job publishes it)"; exit 1; }
          done

      # The staged repository, for the maven-repo job below — uploaded the
      # moment the version is irrevocably on GitHub Packages, so "the artifact
      # exists" means exactly "this version is published and belongs on the
      # branch": a failure later in this job (a release upload blip) still gets
      # the branch published, and a failure earlier does not. Overwritable: a
      # re-run of this job (after deleting the package versions, see the job's
      # note) uploads it again under the same run. Kept the default 90 days:
      # that is how long "re-run failed jobs" can repair the branch job alone.
      - name: Upload the staged repository for the maven-repo branch
        uses: actions/upload-artifact@v4
        with:
          name: engine-library-maven-repo-release-${{ github.sha }}
          path: build/maven-repo
          if-no-files-found: error
          overwrite: true

      - name: Assemble the release assets
        run: |
          set -euo pipefail
          # The tag goes into the asset file names (as for the APK and the dmg).
          printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[A-Za-z0-9._-]+$' \
            || { echo "::error::'${GITHUB_REF_NAME}' is not a valid release tag (expected v<version>)"; exit 1; }
          # The one staged version — what GitHub Packages now carries and what
          # the release notes below name; exported for that step.
          version=$(basename "$(ls -d build/maven-repo/eth/myotis/myotis-engine/*/)")
          echo "STAGED_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p assets
          cp "build/maven-repo/eth/myotis/myotis-engine-android/$version/myotis-engine-android-$version.aar" \
             "assets/myotis-engine-${GITHUB_REF_NAME}-android.aar"
          # The whole staged repository: unzip it and point Gradle at the
          # directory, and no GitHub token is needed (docs/android-library.md).
          (cd build/maven-repo && zip -qr "../../assets/myotis-engine-${GITHUB_REF_NAME}-maven-repo.zip" eth)
          (cd assets && sha256sum myotis-engine-*.aar myotis-engine-*.zip > myotis-engine.SHA256SUMS && cat myotis-engine.SHA256SUMS)

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${STAGED_VERSION:?set by the assets step}"
          # The engine-library section for the notes. Quoted heredoc keeps the
          # markdown literal; the placeholder dodges backtick substitution.
          section=$(mktemp)
          cat > "$section" <<'SECTION'
          **Engine library (`myotis-engine-<tag>-android.aar`, `myotis-engine-<tag>-maven-repo.zip`)** —
          the Myotis Rust engine as a library for other apps: `eth.myotis:myotis-engine:__VERSION__`
          on GitHub Packages (needs a token with read:packages), from the `maven-repo` branch
          (`https://raw.githubusercontent.com/__REPO__/maven-repo`, no token), or the zip
          unpacked as a local Maven repository. The AAR alone is the Android artifact; its
          dependencies are in the zip and on GitHub Packages. A desktop consumer adds
          `eth.myotis:myotis-engine-natives-<platform>:__VERSION__` for its platform
          (darwin-aarch64, darwin-x86-64, linux-x86-64, linux-aarch64): the engine's host library. A Kotlin
          Multiplatform app with iOS targets adds `eth.myotis:myotis-engine-ios:__VERSION__` (iosArm64,
          iosSimulatorArm64): the engine's C ABI as cinterop, the engine linked in. Verify downloads against
          `myotis-engine.SHA256SUMS`. See docs/android-library.md.
          SECTION
          sed -i "s/__VERSION__/$version/g; s#__REPO__#${GITHUB_REPOSITORY}#g" "$section"
          # Create the release with the master notes (.github/release-notes.md)
          # plus this section, unless another publisher already did; upload; then
          # make sure the notes carry this section exactly once — appended when
          # another publisher created the release, re-appended when a concurrent
          # edit dropped it (.github/release-notes.sh explains the race).
          bash .github/release-notes.sh create "$tag" "$section"
          gh release upload "$tag" \
            assets/myotis-engine-*.aar assets/myotis-engine-*.zip assets/myotis-engine.SHA256SUMS --clobber
          bash .github/release-notes.sh append "$tag" "$section"

  # The same staged repository as a Maven repository URL that needs no token:
  # merged into the `maven-repo` branch (an orphan branch holding nothing but
  # the repository layout and a README, created on the first publish), which
  # raw.githubusercontent.com serves file by file — all Gradle needs. Versions
  # add up; the artifact-level maven-metadata.xml is merged, not replaced
  # (scripts/merge_maven_repo.py), so `0.1.+` keeps seeing every version.
  #
  # Its own job, after the publish job, keyed on the artifact that job uploads
  # once the version is on GitHub Packages: it runs whenever the publish job
  # got that far — even if that job then failed on a release upload — and is
  # a no-op when it did not. A failure here (a GitHub blip, a concurrent tag's
  # push winning the race) is repaired with "re-run failed jobs", which
  # re-runs this job alone, from the uploaded repository, never the Packages
  # publish that would refuse its own version. Two tags publishing at once
  # (the concurrency group is per ref) race on the branch; a rejected push is
  # retried from a fresh clone.
  maven-repo-branch:
    name: Publish to the maven-repo branch
    needs: publish
    # `!cancelled()`, so a publish job that failed after the Packages step
    # still gets its branch publish; the tag test keeps the job off every
    # other event, where `publish` is skipped.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only scripts/merge_maven_repo.py is needed from the tree; the branch
      # itself is cloned separately.
      - name: Checkout the merge script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/merge_maven_repo.py
          sparse-checkout-cone-mode: false

      # Absent when the publish job failed before the version reached GitHub
      # Packages: then there is nothing to put on the branch, and this job
      # says so instead of failing. After a SUCCESSFUL publish the artifact
      # exists, so a download failure there is a real error (a GitHub blip)
      # and fails this job — "re-run failed jobs" then retries it; a green job
      # must never mean "the branch was skipped".
      - name: Download the staged repository
        id: staged
        continue-on-error: ${{ needs.publish.result != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: engine-library-maven-repo-release-${{ github.sha }}
          path: build/maven-repo

      - name: Nothing to publish
        if: steps.staged.outcome != 'success'
        run: |
          echo "the publish job did not reach GitHub Packages for ${GITHUB_REF_NAME} (its result: ${{ needs.publish.result }}); the maven-repo branch stays as it is"

      - name: Merge into the maven-repo branch and push
        if: steps.staged.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            work=$(mktemp -d)
            # The full ref, so a `something/maven-repo` branch cannot match; exit
            # code 2 is "no such ref" (the first publish), anything else non-zero
            # is a failure — its message stays on the log, and it gets the same
            # retry as the push.
            rc=0
            git ls-remote --exit-code --heads "$remote" refs/heads/maven-repo >/dev/null || rc=$?
            case "$rc" in
              0) git clone --quiet --depth 1 --branch maven-repo "$remote" "$work" ;;
              2) git init --quiet --initial-branch=maven-repo "$work" ;;
              *) echo "::warning::git ls-remote failed with exit code $rc (attempt $attempt); retrying"
                 sleep 10
                 continue ;;
            esac
            # Written on every publish (the commit below carries it only when it
            # changed), so an edit here reaches the branch; the repository name
            # comes from the run, never a literal.
            cat > "$work/README.md" <<README
          # Myotis engine library — Maven repository

          The \`eth.myotis\` artifacts of every release (docs/android-library.md on \`main\`),
          laid out as a Maven repository and served by raw.githubusercontent.com, so a
          build needs no GitHub token:

          \`\`\`kotlin
          maven {
              url = uri("https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/maven-repo")
              content { includeGroup("eth.myotis") }
          }
          \`\`\`

          Written by the engine-library workflow on each \`v*\` tag; never edited by hand.
          README
            python3 scripts/merge_maven_repo.py build/maven-repo "$work"
            git -C "$work" add -A
            if git -C "$work" diff --cached --quiet; then
              echo "maven-repo branch already carries ${GITHUB_REF_NAME}; nothing to publish"
              exit 0
            fi
            git -C "$work" -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "Publish ${GITHUB_REF_NAME}"
            # Only a non-fast-forward rejection (another publish moved the branch
            # between our clone and our push) is retried; any other refusal (a
            # protected branch, a token without write access) is the error it is.
            if out=$(git -C "$work" push --quiet "$remote" HEAD:refs/heads/maven-repo 2>&1); then
              exit 0
            fi
            printf '%s\n' "$out"
            case "$out" in
              *"fetch first"*|*"non-fast-forward"*|*"cannot lock ref"*)
                echo "::warning::push to maven-repo rejected (attempt $attempt) — another publish moved the branch; retrying from a fresh clone"
                sleep 10 ;;
              *)
                echo "::error::push to the maven-repo branch refused"
                exit 1 ;;
            esac
          done
          echo "::error::could not push to the maven-repo branch after 3 attempts"
          exit 1
