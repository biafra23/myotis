name: Desktop DMG (macOS)

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below). Tags still
  # build the release .dmg.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) — the double-run is already
  # killed by narrowing push above, and this keeps CI on PRs that don't target main.
  pull_request:

# Cancel a superseded run when new commits land on the same branch/PR (each of
# the two arch jobs is cancelled/restarted together).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The regular legs keep their historical check name; the PoC leg is suffixed.
    name: Build macOS .dmg (${{ matrix.arch }}${{ matrix.flavor == 'bee-poc' && ', bee-poc' || '' }})
    # jpackage bundles a single-architecture JRE and can't emit a universal binary, so we build
    # one .dmg per arch. jpackage stamps the .app with the architecture of the JDK it runs under,
    # NOT the host — so we can cross-build the Intel dmg on Apple Silicon by running an x86_64 JDK
    # under Rosetta 2. BOTH jobs therefore run on macos-14 (Apple Silicon):
    #   arm64 → native aarch64 JDK           (dmg runs on M-series Macs)
    #   x64   → x86_64 JDK under Rosetta 2    (dmg runs on Intel Macs, macOS Ventura and back to
    #                                          Big Sur — JDK 21's floor)
    # We do NOT use the macos-13 Intel runner: GitHub is winding down Intel macOS capacity, so
    # those jobs queue until the 24h cap and get cancelled (never produced an Intel dmg). Rosetta
    # cross-build on the always-available arm64 runner removes that dependency.
    # An arm64 .dmg will NOT launch on an Intel Mac (Rosetta only translates x86→arm), so download
    # the one matching your Mac.
    strategy:
      fail-fast: false
      # PRs build only the arm64 dmg (the arch developers actually run; proves
      # jpackage end-to-end). The x64/Rosetta leg is a release/main artifact —
      # on PRs it doubled the macOS runner load for a result that never
      # changes a PR decision. Gated HERE via a conditional matrix, NOT a
      # job-level `if`: the matrix context is unavailable in job-level if
      # (it evaluates empty), which silently skipped BOTH legs on PRs.
      # Two flavours: the regular app, and the Bee PoC build (-PbeePoc) that
      # bundles the Gnosis PostageStamp log-index seed so a Swarm Bee full node
      # can use it from the first minute (app-desktop/build.gradle.kts,
      # docs/bee-rpc-service.md). The PoC leg (arm64) runs on every PR, on
      # pushes to main and on release tags, so the Swarm team always has a
      # current artifact (owner's call — it costs a second jpackage leg per
      # PR). On a tag its dmg is attached to the release as a BEST-EFFORT
      # asset: the leg is continue-on-error there, so a PoC-only failure never
      # blocks the standard dmgs (the release job needs every leg of this
      # job), and the release job uploads the PoC dmg only if it exists. On
      # PRs and main the leg is a hard gate like the others.
      # Each entry carries its own build flags, dmg name and artifact name so
      # the steps below stay data-driven.
      matrix:
        include: ${{ github.event_name == 'pull_request'
          && fromJSON('[{"arch":"arm64","java-arch":"aarch64","flavor":"standard","gradle-args":"","dmg":"Myotis-arm64.dmg","artifact":"myotis-desktop-dmg-arm64"},{"arch":"arm64","java-arch":"aarch64","flavor":"bee-poc","gradle-args":"-PbeePoc","dmg":"Myotis-bee-poc-arm64.dmg","artifact":"myotis-bee-poc-dmg-arm64"}]')
          || fromJSON('[{"arch":"arm64","java-arch":"aarch64","flavor":"standard","gradle-args":"","dmg":"Myotis-arm64.dmg","artifact":"myotis-desktop-dmg-arm64"},{"arch":"x64","java-arch":"x64","flavor":"standard","gradle-args":"","dmg":"Myotis-x64.dmg","artifact":"myotis-desktop-dmg-x64"},{"arch":"arm64","java-arch":"aarch64","flavor":"bee-poc","gradle-args":"-PbeePoc","dmg":"Myotis-bee-poc-arm64.dmg","artifact":"myotis-bee-poc-dmg-arm64"}]') }}
    # The PoC is best-effort on TAG builds only — its failure is reported but
    # never fails this job there, so it never blocks a release. On PRs and
    # pushes to main it is a hard gate like the standard legs: a PoC
    # regression (seed, manifest, caches, JNA stub) must turn the run red.
    continue-on-error: ${{ matrix.flavor == 'bee-poc' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-14
    permissions:
      contents: read
    env:
      # The arch-tagged (and flavour-tagged) name the built dmg is renamed to,
      # shared by the rename and verify steps; the release job expects the
      # standard legs' Myotis-<arch>.dmg.
      DMG_NAME: ${{ matrix.dmg }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          # fetch-tags alone can't do it — at depth 1 HEAD has no parents, so the
          # tag stays unreachable even once its ref is present. .gitmodules is empty,
          # so `submodules: recursive` adds nothing on top: the cost is one full
          # (~150MB) clone per matrix job, on jobs that already build Kotlin + Rust.
          #
          # KNOWN GAP on pull_request: checkout defaults to github.ref, which for
          # that event is the ephemeral refs/pull/<n>/merge commit — so a PR-built
          # artifact stamps a sha that resolves nowhere. Deliberately not pinned to
          # the PR head: that would change WHAT is built (head, not head-merged-into-
          # base) and lose the integration signal. The base version is still right,
          # since the merge commit reaches the tag through its base parent.
          fetch-depth: 0

      # Rosetta 2 lets the x86_64 JDK (and the jlink/jpackage it drives) execute on the arm64
      # runner. Needed only for the cross-built x64 job. We deliberately do NOT blanket `|| true`:
      # a genuine "Rosetta unavailable" must fail HERE, loudly — otherwise it surfaces later as a
      # cryptic "bad CPU type in executable" swallowed by the build retry loop and mis-reported as
      # a transient dependency blip. Tolerate ONLY the idempotent already-installed case: on a
      # runner where Rosetta is already present, softwareupdate can exit non-zero with a
      # "Rosetta 2 is already installed" / "already been installed" message. Match those specific
      # phrases only — a broad token like "finished" could appear in genuine failure output and
      # mask a real error, defeating the fail-fast intent.
      - name: Install Rosetta 2 (x64 cross-build)
        if: matrix.arch == 'x64'
        run: |
          set -o pipefail
          if ! softwareupdate --install-rosetta --agree-to-license 2>&1 | tee /tmp/rosetta.log; then
            grep -qiE "already installed|already been installed" /tmp/rosetta.log \
              || { echo "::error::Rosetta 2 install failed"; exit 1; }
            echo "Rosetta 2 already installed — continuing."
          fi

      # Installs a JDK 21 of the requested architecture and points JAVA_HOME at it. For x64 this
      # is the x86_64 Temurin build (run via Rosetta); for arm64 the native aarch64 build.
      - name: Set up JDK 21 (${{ matrix.java-arch }})
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: ${{ matrix.java-arch }}

      # The packaged app bundles the Rust engine (appResources): build it from
      # source here. prepareRustAppResources fails the build if the lib is
      # missing, so this step is REQUIRED, not optional.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both matrix legs run on arm64 macos-14; the x64 leg is a Rosetta
          # cross-build. cargo builds its HOST triple regardless of the JVM's
          # arch, so the x64 leg must cross-compile explicitly or the x64 dmg
          # would bundle an arm64 dylib (dead engine toggle on Intel Macs).
          targets: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Compose Desktop's packageDmg wraps jpackage (bundles a jlink'd JRE + the app). We pin the
      # Gradle toolchain to EXACTLY the JDK setup-java just installed
      # (auto-detect=false + installations.paths=$JAVA_HOME): the build's `javaHome =
      # launcherFor(21)` then resolves to that arch's JDK, so jpackage emits a matching-arch dmg
      # instead of possibly picking a stray pre-installed aarch64 JDK. The Gradle daemon itself
      # also runs under JAVA_HOME (x86_64 under Rosetta for the x64 job), so jlink produces an
      # x86_64 runtime image.
      # NON-minified (main, not main-release): the Java backend (Netty / Besu / BouncyCastle /
      # libp2p) is reflection-heavy and proguard would break it. Unsigned — Gatekeeper needs a
      # right-click → Open the first time; notarization (Apple Developer ID) is a follow-up.
      # Retry to ride out transient repo-resolution blips.
      - name: Build macOS .dmg (${{ matrix.arch }})
        env:
          # Explicit triple on BOTH legs (the arm64 value equals the host, so
          # it's a no-op there) — an empty-string env var is NOT null and
          # would otherwise flow into `--target ""` (this exact failure took
          # down the arm64 leg's first CI run).
          RUST_TARGET: ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
        run: |
          GRADLE_ARGS="-Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths=$JAVA_HOME"
          FLAVOR_ARGS="${{ matrix.gradle-args }}"
          for attempt in 1 2 3; do
            ./gradlew :app-desktop:packageDmg --stacktrace $GRADLE_ARGS $FLAVOR_ARGS && exit 0
            echo "::warning::DMG build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::DMG build failed after 3 attempts"
          exit 1

      # The desktop tests' macOS branch — AppNapTest, the Objective-C bridge that keeps
      # App Nap off for the RPC server — runs nowhere else: ci.yml is ubuntu-only, where
      # it is skipped by assumption. One leg is enough; the x64 leg would only repeat
      # it under Rosetta. The Rust engine is not needed by these tests.
      - name: Run desktop tests (macOS)
        if: matrix.flavor == 'standard' && matrix.arch == 'arm64'
        run: |
          GRADLE_ARGS="-Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths=$JAVA_HOME"
          ./gradlew :app-desktop:test --stacktrace $GRADLE_ARGS

      # Compose names both arches' output the same (Myotis-<packageVersion>.dmg, derived
      # from the project version in app-desktop/build.gradle.kts); rename so the
      # downloaded file itself states the architecture, not just the artifact wrapper.
      # Assert exactly one — zero or multiple should fail here, not silently ship
      # an arbitrary pick (parity with the deb workflow). This matters more now
      # that the filename tracks the project version: while it was frozen at
      # Myotis-1.0.0.dmg a leftover build was overwritten in place, but two
      # differently-versioned dmgs can now coexist and `head -n1` would take the
      # lexicographically first — i.e. the OLDER one. The arch-verify step below
      # wouldn't catch that: a stale bundle of the right arch passes.
      - name: Tag .dmg with architecture
        run: |
          set -eu
          shopt -s nullglob
          dmgs=(app-desktop/build/compose/binaries/main/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 dmg, found ${#dmgs[@]}: ${dmgs[*]}"; exit 1; }
          mv "${dmgs[0]}" "app-desktop/build/compose/binaries/main/dmg/$DMG_NAME"

      # Guard against a SILENTLY wrong-arch build. The job otherwise goes green on
      # "BUILD SUCCESSFUL" alone; any future regression (runner-image change, Gradle re-enabling
      # JDK auto-detect, setup-java falling back to aarch64, a broken Rosetta) could ship an arm64
      # binary labelled Myotis-x64.dmg that won't launch on the Intel Macs it targets — failing
      # only in the field, for exactly the users with no other dmg. Mount the produced dmg and
      # assert the app launcher's Mach-O architecture matches this job's arch.
      - name: Verify .dmg architecture
        run: |
          set -eu
          dmg="app-desktop/build/compose/binaries/main/dmg/$DMG_NAME"
          mnt=$(mktemp -d)
          # Detach the image on EVERY exit path (including an early `lipo`/assert failure below),
          # so a failed check never leaks a mounted volume for the rest of the job.
          cleanup() { hdiutil detach "$mnt" >/dev/null 2>&1 || hdiutil detach "$mnt" -force >/dev/null 2>&1 || true; rmdir "$mnt" 2>/dev/null || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          launcher=$(find "$mnt" -type f -path '*/Contents/MacOS/*' | head -n1)
          # Fail clearly if the bundle layout changed and we found no launcher, rather than letting
          # `lipo` error on an empty path.
          [ -n "$launcher" ] || { echo "::error::no app launcher found under $dmg — bundle layout changed?"; exit 1; }
          jvm=$(find "$mnt" -type f -name 'libjvm.dylib' | head -n1 || true)
          archs=$(lipo -archs "$launcher")
          echo "launcher: $launcher -> [$archs]"
          [ -n "$jvm" ] && echo "bundled libjvm: $jvm -> [$(lipo -archs "$jvm")]" || true
          case "${{ matrix.arch }}" in
            x64)   want=x86_64 ;;
            arm64) want=arm64  ;;
          esac
          # jlink emits a single-arch runtime, so the launcher must be exactly `want`.
          echo "$archs" | tr ' ' '\n' | grep -qx "$want" \
            || { echo "::error::arch mismatch: expected $want, got [$archs] for the ${{ matrix.arch }} dmg"; exit 1; }
          echo "OK: ${{ matrix.arch }} dmg launcher is $want"
          # The bundled Rust engine must exist AND match the dmg's arch — a
          # wrong-arch dylib loads nothing and leaves the engine toggle dead
          # (invisible to the launcher check above).
          rustlib=$(find "$mnt" -type f -name 'libmyotis_engine.dylib' | head -n1 || true)
          [ -n "$rustlib" ] || { echo "::error::libmyotis_engine.dylib missing from the dmg"; exit 1; }
          rustarchs=$(lipo -archs "$rustlib")
          echo "bundled rust engine: $rustlib -> [$rustarchs]"
          echo "$rustarchs" | tr ' ' '\n' | grep -qx "$want" \
            || { echo "::error::rust engine arch mismatch: expected $want, got [$rustarchs]"; exit 1; }
          echo "OK: bundled rust engine is $want"
          # JNA's native stub must ship inside the bundle, matching the dmg's arch
          # AND carrying a valid code signature: a wrong-arch or unsigned stub makes
          # JNA fall back to the unsigned temp extraction macOS refuses, and the
          # Rust engine silently never loads (see prepareJnaBootLib in
          # app-desktop/build.gradle.kts). JNA swallows the boot-path failure, so
          # only this check would notice.
          jna=$(find "$mnt" -type f -name 'libjnidispatch.dylib' | head -n1 || true)
          [ -n "$jna" ] || { echo "::error::libjnidispatch.dylib missing from the dmg — the packaged app cannot load the Rust engine"; exit 1; }
          jnaarchs=$(lipo -archs "$jna")
          echo "bundled JNA stub: $jna -> [$jnaarchs]"
          echo "$jnaarchs" | tr ' ' '\n' | grep -qx "$want" \
            || { echo "::error::JNA stub arch mismatch: expected $want, got [$jnaarchs]"; exit 1; }
          codesign --verify --verbose=2 "$jna" \
            || { echo "::error::JNA stub is not validly signed — jpackage did not sign it"; exit 1; }
          bundled_seed=$(find "$mnt" -type f -name 'logindex-gnosis.db' | head -n1 || true)
          if [ "${{ matrix.flavor }}" = "bee-poc" ]; then
            # The Bee PoC flavour must actually carry its seed — the whole point
            # of that artifact — plus the manifest the app checks it against.
            manifest=$(find "$mnt" -type f -name 'bee-poc-seed.properties' | head -n1 || true)
            [ -n "$bundled_seed" ] && [ -n "$manifest" ] \
              || { echo "::error::bee-poc dmg is missing its seed or manifest"; exit 1; }
            echo "bundled seed: $bundled_seed ($(stat -f%z "$bundled_seed") bytes)"
            cat "$manifest"
            # …and the warm peer caches that keep a cold Gnosis pool from starving.
            for c in peers-gnosis.cache cl-peers-gnosis.cache; do
              f=$(find "$mnt" -type f -name "$c" | head -n1 || true)
              [ -n "$f" ] && [ -s "$f" ] \
                || { echo "::error::bee-poc dmg is missing its warm peer cache $c"; exit 1; }
              echo "bundled peer cache: $c ($(wc -l < "$f" | tr -d ' ') peers)"
            done
          else
            # …and the regular app must never carry the RPC-sourced seed, nor the
            # PoC's peer caches (the Gradle scrub treats both as PoC-only).
            [ -z "$bundled_seed" ] \
              || { echo "::error::the standard dmg carries the Bee PoC seed ($bundled_seed)"; exit 1; }
            for c in peers-gnosis.cache cl-peers-gnosis.cache; do
              stray=$(find "$mnt" -type f -name "$c" | head -n1 || true)
              [ -z "$stray" ] || { echo "::error::the standard dmg carries the Bee PoC peer cache ($stray)"; exit 1; }
            done
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: app-desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable per run; without this, "re-run all jobs" on a
          # tag 409s in every build leg and the release job never runs. That is
          # the button people reach for after the version guard fails, so the
          # recovery path must not wedge the release — and here it would cost two
          # 40-minute jpackage legs. (node-binding.yml already carries this fix.)
          overwrite: true

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # — the release is named after the tag, while the .dmg's packageVersion comes
  # from project.version (via the +1-major macOS rule). See
  # release-version-guard.yml. Runs in parallel with the builds, so a mismatch is
  # REPORTED within minutes rather than after both jpackage legs — Actions has no
  # cross-job fail-fast, so the legs themselves still run to completion.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Attach both arch dmgs to the GitHub Release for the pushed tag. Runs ONLY on
  # `v*` tags, ONCE (not per-arch), after BOTH matrix build jobs finish, and
  # reuses their artifacts rather than rebuilding. The android-apk workflow
  # publishes to the SAME release for the same tag; whichever job runs first
  # creates it and the other just uploads — the create step tolerates that race.
  release:
    name: Publish dmgs to release
    # version-guard carries the same `if` as this job, so it is never merely
    # skipped underneath it — on a tag push both run, otherwise both are skipped.
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload needs write access to Releases (repo contents).
      contents: write
    steps:
      # Both matrix jobs' artifacts (Myotis-arm64.dmg, Myotis-x64.dmg) land under
      # dmg/ — they were already arch-tagged and verified in the build job.
      - name: Download dmg artifacts
        uses: actions/download-artifact@v4
        with:
          # Both standard dmgs plus, when its leg succeeded, the Bee PoC dmg.
          pattern: myotis-*-dmg-*-${{ github.sha }}
          path: dmg
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh must be told the repo explicitly or it
          # dies with "fatal: not a git repository" (which sank the first v0.1.0
          # attempt: every gh release call failed, so no release was created).
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The tag goes into the asset file names below, so check its shape the
          # way the deb and apk jobs do. `gh release upload` reads everything
          # after a `#` in a path as the asset's label, and the version guard
          # accepts any v<version>-<suffix>, so a tag like v<version>-rc#1 would
          # otherwise fail the upload after the release already exists.
          printf '%s' "$tag" | grep -Eq '^v[A-Za-z0-9._-]+$' \
            || { echo "::error::'$tag' is not a valid release tag (expected v<version>)"; exit 1; }
          # Fail loudly if either arch dmg is missing rather than shipping a
          # half release (e.g. one matrix job was cancelled).
          for arch in arm64 x64; do
            test -f "dmg/Myotis-${arch}.dmg" \
              || { echo "::error::missing dmg/Myotis-${arch}.dmg"; exit 1; }
          done
          # Release assets carry the version, like the APK
          # (Myotis-<tag>-android-debug.apk): Myotis-<tag>-<arch>.dmg. The build
          # jobs keep arch-only names so the per-PR artifacts stay stable; the
          # tag only exists here. Renamed before the release is created, so a
          # rename can never fail after the release exists.
          for arch in arm64 x64; do
            mv "dmg/Myotis-${arch}.dmg" "dmg/Myotis-${tag}-${arch}.dmg"
          done
          # Best-effort: the PoC leg is continue-on-error, so its dmg may be absent.
          if [ -f dmg/Myotis-bee-poc-arm64.dmg ]; then
            mv dmg/Myotis-bee-poc-arm64.dmg "dmg/Myotis-${tag}-bee-poc-arm64.dmg"
          fi
          # Notes via a quoted heredoc + --notes-file: markdown stays literal
          # (no shell escaping of backticks/quotes) and renders as intended.
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Myotis wallet apps.

          **Android (`*-android-debug.apk`)** — unsigned *debug* build. Install via
          "Install unknown apps". Not a signed release build.

          **Desktop macOS (`Myotis-v<version>-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Bee PoC (`Myotis-v<version>-bee-poc-arm64.dmg`, when present)** — a separate app
          ("Myotis Bee PoC", own data dir) that a Swarm Bee full node can use as its
          Gnosis RPC from the first minute: it ships a pre-built PostageStamp log-index
          seed and warm peer caches. Demo/debug artefact — the seed is RPC-sourced and
          unverified until the walker re-fetches it, and it stops catching up about 29
          days after its fetch (the Index tab shows the block it is usable until). See
          docs/bee-rpc-service.md.

          **Desktop Linux (`Myotis-v<version>-<arch>.deb`)** — install with
          `sudo apt install ./Myotis-v<version>-<arch>.deb` (x64 for Intel/AMD, arm64 for
          Raspberry Pi 5 / ARM machines).
          NOTES
          # Create the release if it doesn't exist yet. The android workflow may
          # win this race for the same tag: if `create` fails, re-check with
          # `view` — success there means the other job already created it (fine),
          # while a genuine failure still surfaces because `view` also fails.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Myotis $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" "dmg/Myotis-${tag}-arm64.dmg" "dmg/Myotis-${tag}-x64.dmg" --clobber
          if [ -f "dmg/Myotis-${tag}-bee-poc-arm64.dmg" ]; then
            gh release upload "$tag" "dmg/Myotis-${tag}-bee-poc-arm64.dmg" --clobber
          else
            echo "::warning::no Bee PoC dmg produced for this tag — release published without it"
          fi
