name: CI & Release

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below).
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request unscoped (any base branch), matching the other workflows: keeps
  # Build and Test on PRs that don't target main — e.g. the rust-engine
  # integration branch, whose checkpoint PRs previously skipped this job.
  pull_request:
  # Dispatched by gradle-pins-dependabot.yml on the commit it pushes (a
  # GITHUB_TOKEN push starts no pull_request run), and by hand.
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          java-version-file: .java-version  # exact Temurin release, one place (#734)
          distribution: 'temurin'

      # The Go toolchain go/go.mod pins (same action+pin and go-version-file as
      # go-engine.yml), so `./gradlew build` here runs the Go engine's cgo build
      # and GoCatalogParityTest against it on EVERY PR — the runner image's own
      # Go is older than the module line, and goBuildCShared (GOTOOLCHAIN=local,
      # PR #832 review) skips with a note instead of silently downloading 325 MB
      # mid-build, which would leave the native-backed tests silently skipped.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum  # without this the action hashes the
          # root (Gradle) tree for its module-cache key — same line go-engine.yml uses

      # Robust Gradle dependency + plugin caching. Restores the base-branch cache
      # (read-only on PRs) so artifacts that already built on main — Besu, AGP,
      # the JitPack Besu fork — come from cache instead of being re-fetched
      # from flaky external repos on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The two scripts every release publisher goes through (.github/
      # release-notes.sh, .github/release-assets.sh) and the release verifier,
      # against a stubbed `gh`, and the signed-against-unsigned APK check on
      # synthetic APKs. Their failure modes otherwise surface only on a real
      # tag. Seconds.
      - name: Test the release scripts
        run: |
          scripts/test_release_notes.sh
          scripts/test_release_assets.sh
          python3 scripts/repro/test_compare_signed_apk.py
          python3 scripts/repro/test_compare.py
          python3 scripts/test_normalize_xcframework.py
          python3 scripts/test_check_pins_additive.py
          python3 scripts/test_sbom.py

      # The rustc rust/rust-toolchain.toml pins, like every Rust lane (#734).
      # Not the image's preinstalled Rust: the Gradle gate skips any toolchain
      # below the workspace rust-version (rust/Cargo.toml), so a floor bump that
      # outpaced the image would turn cargoTest and verifyRustVersionFloor into
      # a quiet skip here, with `build` still green.
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      # The Android launcher / status-bar icons are GENERATED from assets/myotis_logo.svg
      # and committed (android-app/src/main/res: ic_launcher_foreground, ic_stat_myotis,
      # ic_launcher_background, mipmap-anydpi-v26/ic_launcher; android-app/src/debug/res:
      # the debug app's recoloured launcher icon over the same names). Same idea as the UniFFI
      # bindings check in android-apk.yml: re-run the generator (stdlib-only, seconds) and
      # fail on a diff, so a hand edit to the resources, or an SVG change without a re-run,
      # cannot drift past review. `git diff` alone is blind to an UNTRACKED file (a new or
      # renamed generator output nobody committed), hence the porcelain check behind it.
      - name: Verify generated Android icons match assets/myotis_logo.svg
        run: |
          python3 scripts/gen_android_icons.py
          res="android-app/src/main/res android-app/src/debug/res"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the icons in $res are STALE vs assets/myotis_logo.svg —" \
                 "regenerate with \`python3 scripts/gen_android_icons.py\` and commit every file it writes."
            exit 1
          }

      # -PskipRustEngine: this runner has no Android Rust toolchain (cargo-ndk,
      # NDK, Android rustup targets), and :myotis-engine (so :android-app) builds
      # the Rust engine from source by DEFAULT (a missing toolchain is a hard error naming this
      # switch). This job is a JVM compile/test check — it does not ship the APK
      # (android-apk.yml does, with the full toolchain), so build the app without
      # the engine. Host Rust is set up above, so `check` still runs the
      # host-side Rust tasks (cargoTest, verifyRustVersionFloor, …).
      #
      # Retry to ride out transient external-repo resolution blips (JitPack 403s,
      # google()/Hyperledger timeouts) for any artifact not already cached. NOT
      # --offline: offline turns a single cache miss into a hard failure.
      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -PskipRustEngine && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

      # goBuildCShared degrades a FAILED cgo build to a warning (by design, for
      # cgo-less dev hosts), and the native-backed tests then self-skip — green
      # CI with zero Go-engine coverage. On this runner go + cgo are guaranteed
      # (steps above), so the library MUST exist here; fail loudly otherwise
      # (PR #832 round-3 review).
      - name: The Go engine library was built (GoCatalogParityTest ran against it)
        run: test -s go/build/libmyotis_engine_go.so

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # (see release-version-guard.yml). Not strictly needed for the jar names here,
  # but the release this job creates/updates is the SAME one the apk/dmg/deb
  # workflows publish tag-named assets to, so it fails alongside them.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # The tag's jars, built with a read-only token. Publishing them is the
  # `release` job's, which runs no build: the job that may write to the release
  # and attest provenance only downloads what this one built (#734; the split
  # sign-release and the APK's release job have, for the same reason).
  release-build:
    name: Build the release jars
    runs-on: ubuntu-26.04
    # version-guard carries the same `if` as this job, so it is never merely
    # skipped underneath it — on a tag push both run, otherwise both are skipped.
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          java-version-file: .java-version  # exact Temurin release, one place (#734)
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -PskipRustEngine && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

      # The paths keep their directories below the workspace: the release job
      # finds them as jars/<module>/build/libs/*.jar.
      - name: Upload the jars for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-jars-${{ github.sha }}
          path: |
            app/build/libs/*.jar
            core/build/libs/*.jar
            networking/build/libs/*.jar
            consensus/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # a re-run of this job uploads again under the same run

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: [release-build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # The build-provenance attestation of the uploaded assets (#734): an OIDC
      # token for the Sigstore certificate, and the attestation's storage.
      id-token: write
      attestations: write

    steps:
      # Only the upload script, from the commit being released.
      - name: Check out the release script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/release-assets.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-jars-${{ github.sha }}
          path: jars

      # Creates the release (or adds its generated notes to the one another
      # publisher created). The jars go up in the next step, through the script
      # every publisher uploads with (#734).
      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(jars/*/build/libs/*.jar)
          [ "${#jars[@]}" -gt 0 ] || { echo "::error::no jars to publish"; exit 1; }
          # Upload, and check that the release serves these bytes.
          bash .github/release-assets.sh "${GITHUB_REF_NAME}" "${jars[@]}"

      - name: Attest the jars' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-assets.SHA256SUMS

      # Last, and also when the attestation failed: SHA256SUMS is the one file
      # all publishers share, kept apart from this job's own upload and
      # attestation (.github/release-assets.sh).
      - name: List the release's assets in SHA256SUMS
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/release-assets.sh --checksums "${GITHUB_REF_NAME}"
