name: CI & Release

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below).
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request unscoped (any base branch), matching the other workflows: keeps
  # Build and Test on PRs that don't target main — e.g. the rust-engine
  # integration branch, whose checkpoint PRs previously skipped this job.
  pull_request:
  # Dispatched by gradle-pins-dependabot.yml on the commit it pushes (a
  # GITHUB_TOKEN push starts no pull_request run), and by hand.
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          java-version-file: .java-version  # exact Temurin build, one place (#734)
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching. Restores the base-branch cache
      # (read-only on PRs) so artifacts that already built on main — Besu, AGP,
      # the JitPack Besu fork — come from cache instead of being re-fetched
      # from flaky external repos on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The rustc rust/rust-toolchain.toml pins, like every Rust lane (#734).
      # Not the image's preinstalled Rust: the Gradle gate skips any toolchain
      # below the workspace rust-version (rust/Cargo.toml), so a floor bump that
      # outpaced the image would turn cargoTest and verifyRustVersionFloor into
      # a quiet skip here, with `build` still green.
      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      # The Android launcher / status-bar icons are GENERATED from assets/myotis_logo.svg
      # and committed (android-app/src/main/res: ic_launcher_foreground, ic_stat_myotis,
      # ic_launcher_background, mipmap-anydpi-v26/ic_launcher; android-app/src/debug/res:
      # the debug app's recoloured launcher icon over the same names). Same idea as the UniFFI
      # bindings check in android-apk.yml: re-run the generator (stdlib-only, seconds) and
      # fail on a diff, so a hand edit to the resources, or an SVG change without a re-run,
      # cannot drift past review. `git diff` alone is blind to an UNTRACKED file (a new or
      # renamed generator output nobody committed), hence the porcelain check behind it.
      - name: Verify generated Android icons match assets/myotis_logo.svg
        run: |
          python3 scripts/gen_android_icons.py
          res="android-app/src/main/res android-app/src/debug/res"
          git diff --exit-code -- $res \
            && test -z "$(git status --porcelain -- $res)" || {
            git status --porcelain -- $res
            echo "::error::the icons in $res are STALE vs assets/myotis_logo.svg —" \
                 "regenerate with \`python3 scripts/gen_android_icons.py\` and commit every file it writes."
            exit 1
          }

      # -PskipRustEngine: this runner has no Android Rust toolchain (cargo-ndk,
      # NDK, Android rustup targets), and :myotis-engine (so :android-app) builds
      # the Rust engine from source by DEFAULT (a missing toolchain is a hard error naming this
      # switch). This job is a JVM compile/test check — it does not ship the APK
      # (android-apk.yml does, with the full toolchain), so build the app without
      # the engine. Host Rust is set up above, so `check` still runs the
      # host-side Rust tasks (cargoTest, verifyRustVersionFloor, …).
      #
      # Retry to ride out transient external-repo resolution blips (JitPack 403s,
      # google()/Hyperledger timeouts) for any artifact not already cached. NOT
      # --offline: offline turns a single cache miss into a hard failure.
      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -PskipRustEngine && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # (see release-version-guard.yml). Not strictly needed for the jar names here,
  # but the release this job creates/updates is the SAME one the apk/dmg/deb
  # workflows publish tag-named assets to, so it fails alongside them.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  release:
    name: Release
    runs-on: ubuntu-26.04
    # version-guard carries the same `if` as this job, so it is never merely
    # skipped underneath it — on a tag push both run, otherwise both are skipped.
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          java-version-file: .java-version  # exact Temurin build, one place (#734)
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -PskipRustEngine && exit 0
            echo "::warning::Gradle build attempt $attempt failed; retrying in 25s"
            sleep 25
          done
          echo "::error::Gradle build failed after 3 attempts"
          exit 1

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: |
            app/build/libs/*.jar
            core/build/libs/*.jar
            networking/build/libs/*.jar
            consensus/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
