# swarm — the embedded ant Swarm node (rust/swarm, crate myotis-swarm), the reader
# of the addr1 address index (.claude/agent/data-sources.md, the Swarm carve-out).
#
# Its own workflow for the same reason as roost.yml: it is deliberately NOT a
# workspace member (rust/Cargo.toml `exclude`), so `cargo test --workspace` and
# rust-clippy.yml do not see it. No engine crate depends on it yet; once one does
# (behind a feature), this lane must also build that feature and its sources.
#
# ant is vendored in rust/vendor/ant (its VENDORED.md): this lane builds it as a
# path dependency, and checks that the copy is upstream's at the recorded commit
# (scripts/vendor_ant.sh --check). That check is the only step in CI that fetches
# ant from GitHub; the builds never do.
#
# Path-filtered, and `push` scoped to main as in the other Rust lanes, so a push
# to a branch with an open PR runs once (under pull_request).
name: swarm

on:
  push:
    branches: ["main"]
    paths:
      - "rust/swarm/**"
      - "rust/vendor/ant/**"
      - "scripts/vendor_ant.sh"
      - ".github/workflows/swarm.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"
  pull_request:
    paths:
      - "rust/swarm/**"
      - "rust/vendor/ant/**"
      - "scripts/vendor_ant.sh"
      - ".github/workflows/swarm.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"

jobs:
  test:
    name: myotis-swarm tests and clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust/swarm
      - name: Tests
        run: cargo test --manifest-path rust/swarm/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --locked --manifest-path rust/swarm/Cargo.toml --all-targets -- -D warnings
      - name: rust/vendor/ant is upstream's ant at its recorded commit
        run: scripts/vendor_ant.sh --check
      - name: No git sources in the lock (ant is vendored)
        run: |
          if grep -n '^source = "git+' rust/swarm/Cargo.lock; then
            echo "::error file=rust/swarm/Cargo.lock::a git source is back in the lock; vendor it under rust/vendor instead (rust/vendor/ant/VENDORED.md)"
            exit 1
          fi
