name: mm-replay tests

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't run twice (the PR is covered by pull_request below).
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) — the double-run is already
  # killed by narrowing push above, and this keeps CI on PRs that don't target main.
  pull_request:

# Cancel a superseded run when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Unit tests for the MetaMask replay harness (tools/mm-replay/replay.py) and the
# golden session fixture. Pure stdlib Python — no Gradle, no external Maven
# repos — so this job is fast and immune to the dependency-resolution flakiness
# that affects the JVM builds. The full replay against a live daemon stays a
# manual pre-PR check (it needs a synced node); this guards the harness logic
# and the fixture contract automatically.
jobs:
  test:
    name: replay harness unit tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - name: Run replay unit tests
        run: python3 -m unittest discover -s tools/mm-replay -p 'test_*.py' -v
