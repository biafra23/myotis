# Cargo.lock freshness for every lock in the tree.
#
# Three locks exist under rust/ because tor-poc and roost are deliberately NOT
# workspace members (rust/Cargo.toml `exclude`), so each resolves its own graph:
#   rust/Cargo.lock          the engine workspace
#   rust/roost/Cargo.lock    the light-client server
#   rust/tor-poc/Cargo.lock  the Tor proof-of-concept
# plus the Rust tour's workbook (docs/tour/workbook), a standalone crate whose
# solution/Cargo.lock is checked here and whose starter/ is generated from
# solution/ by make_starter.py — `--check` fails if the two differ, lock
# included. Learners run it with `cargo test --offline --locked`.
# Since #734 (Part 2) every cargo build, test, run, clippy and doc invocation in
# CI, in Gradle and in rust/build-*.sh passes --locked, so a lock that stops
# matching its manifests already fails the first build that uses it. This job
# stays as the belt to those braces: it checks every lock above on every change
# to a manifest or lock, including tor-poc's and the workbook's, which nothing
# else in CI builds (tor-poc's lock once drifted for nine days after 4a72430a,
# before any build was locked).
#
# `cargo update --workspace --locked` resolves against the registry INDEX only:
# no crate is downloaded, nothing is compiled, and it exits non-zero with
# "the lock file … needs to be updated but --locked was passed" for a missing
# edge, a missing package or a wrong version. (`cargo metadata --locked` would
# do the same check but has to read every dependency's manifest, i.e. download
# and unpack the whole graph — ~1 GB across the three, mostly tor-poc's Arti
# tree, which rust/Cargo.toml says must never burden CI.)
#
# Trigger shape as the other workflows: push scoped to main + release tags so a
# branch push with an open PR runs once (under pull_request), and tags so a
# release's three locks are checked together, tor-poc's included.
name: cargo locks

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "rust/**/Cargo.toml"
      - "rust/**/Cargo.lock"
      - "docs/tour/workbook/**"
      - ".github/workflows/cargo-locks.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"
  pull_request:
    paths:
      - "rust/**/Cargo.toml"
      - "rust/**/Cargo.lock"
      - "docs/tour/workbook/**"
      - ".github/workflows/cargo-locks.yml"
      - ".github/actions/rust-toolchain/**"
      - "rust/rust-toolchain.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked:
    name: Cargo.lock files resolve under --locked
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - name: Resolve every lock without changing it
        run: |
          set -eu
          for manifest in rust/Cargo.toml rust/roost/Cargo.toml rust/tor-poc/Cargo.toml \
                          docs/tour/workbook/solution/Cargo.toml; do
            echo "== $manifest"
            cargo update --workspace --locked --manifest-path "$manifest"
          done
      - name: The workbook's starter/ matches solution/ (sources and lock)
        run: python3 docs/tour/workbook/make_starter.py --check
