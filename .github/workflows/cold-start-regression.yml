# The two cold-start regressions issue #422 asked us to keep.
#
# MANUAL ONLY (workflow_dispatch), deliberately: both tests dial live
# third-party light-client servers, and both are peer-quota-bound — a serving
# peer answers roughly one update per 10 s — so they take minutes and can fail
# for reasons that are not our bug (every server busy, a network blip). Gating
# merges on that would train everyone to ignore a red check. Run it before a
# release, or when changing discovery, the peer pool, or the catch-up loop.
#
# What each proves, and why a green pipeline elsewhere does not:
#   * pins-alive: do the shipped pins and bootnodes actually answer? Seconds,
#                 and the one that would have caught #422 before it shipped.
#                 A CI runner is a clean host, which matters: a Lighthouse node
#                 that banned a dev box's IP looks dead from there and is fine
#                 from here. Clean is not neutral, though: mainnet pin
#                 57.129.130.18 closed the connection on runner IPs on
#                 2026-09-12 and 2026-09-13 while serving a residential address
#                 in full, so confirm a pin only a runner calls dead from a
#                 second address before pruning it.
#   * dead-pins:  every pinned server still CONFIGURED but unreachable — the
#                 #422 shape. Pinned peers are exempt from eviction, so they
#                 hold their pool slots and keep steering targeted lookups;
#                 discovery has to find a real server anyway. The dispatched
#                 smoke job dials a warm peer cache, which hides this. The EL
#                 pins stay live (see the test for why).
#   * old-anchor: the trust anchor is several periods behind, so bootstrap is
#                 not enough and catch-up must actually walk periods. A
#                 release-fresh anchor walks 0-2 periods and proves little, so
#                 the test never uses the embedded one. By default it takes
#                 this network's entry in
#                 rust/testdata/anchors/oldest-servable.properties: the oldest
#                 checkpoint roost's serving nodes still bootstrap, far past
#                 every weak-subjectivity bound (gnosis 3 periods,
#                 mainnet/sepolia 13), which the test asserts. anchor_root and
#                 anchor_slot override it, together. If this step fails before
#                 bootstrapping, first suspect that the file's entry has aged
#                 out of what roost still serves: re-probe on zbox and update
#                 the file before hunting for a regression.
#
# Both cold starts run the EL reader beside the light client, as a host does,
# and pass only on SYNCED. On a Gloas chain SYNCED also waits for the EL pool
# to fetch the finalized execution header by its hash, so a CL-only run can
# never pass there (Sepolia's release checks at v0.1.15 and v0.1.18). A run
# that misses SYNCED says which half stalled. The old-anchor step runs even
# when the dead-pins step failed (the job still fails): the two are
# independent, and a release check that stops at the first red step leaves the
# owner deciding without the deep walk's answer. Only a failed build or pin
# check stops the job early.
#
# The `census` scope runs none of the three. It runs
# rust/myotis-net/examples/period_census.rs instead: the whole discv5 DHT asked
# for one period's light_client_updates_by_range, each answer filed by its
# verdict and the client Identify named. That is the re-census the pins-alive
# step tells you to run when a pin stops serving — from a host whose IP no
# Lighthouse node has banned — and the way to look for new pins. Diagnostics,
# not a check: it ends green whatever it finds, so read the report.
#
# The `dns-tree` job walks the network's EIP-1459 node lists (the ENR trees
# `ElConfig::enr_tree_urls` names: mainnet and sepolia; gnosis and chiado
# publish none) through the SYSTEM resolver: tests/live_dns_tree.rs, on a Linux
# AND a macOS runner. It is the one check of the resolver the desktop and the
# daemon use for a fresh profile's first EL peers (#539): a failure there is a
# single `warn!` and an empty candidate pool in the app, invisible to every
# other check. Two hosts because hickory-resolver reads its configuration per
# platform (/etc/resolv.conf on Linux, SCDynamicStore on macOS since 0.26,
# #806). It runs in the `full` scope on those two networks, and on its own as
# the `dns-tree` scope: dispatch that after a resolver bump.
name: cold-start regression

on:
  workflow_dispatch:
    inputs:
      network:
        # chiado: only `census` is meaningful until Chiado has pinned CL servers
        # and an oldest-servable anchor — pins-alive asserts pins exist and the
        # full scope refuses to run without an anchor, so both fail by design.
        description: "Network to cold-start (gnosis is where #422 bit hardest; chiado: census scope only, for now)"
        type: choice
        options: [gnosis, mainnet, sepolia, chiado]
        default: gnosis
      scope:
        description: "full = all three checks, plus the DNS tree walk on mainnet/sepolia (release). pins-only = skip the deep walk. census = only the DHT period census (no checks). dns-tree = only the DNS tree walk, Linux + macOS (mainnet/sepolia)."
        type: choice
        options: [full, pins-only, census, dns-tree]
        default: full
      anchor_root:
        description: "Optional override: old anchor block root (64 hex). Default: this network's entry in rust/testdata/anchors/oldest-servable.properties."
        type: string
        default: ""
      anchor_slot:
        description: "Optional override: old anchor slot (set together with anchor_root)"
        type: string
        default: ""
      census_period:
        description: "census scope only: the sync-committee period every peer is asked for. Empty = the current one."
        type: string
        default: ""
      census_crawl_secs:
        description: "census scope only: how long to crawl the DHT, in seconds (at most 3000: the report prints at the end, inside the job's 75-minute timeout)"
        type: string
        default: "900"

# Keyed by network as well as ref: these are dispatched by hand, and running
# gnosis then mainnet must not silently kill the first run. A census and a
# DNS tree walk get their own groups, so neither cancels a release check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.network }}${{ (inputs.scope == 'census' || inputs.scope == 'dns-tree') && format('-{0}', inputs.scope) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cold-start:
    name: ${{ inputs.scope == 'census' && 'period census' || 'cold start' }} (${{ inputs.network }}, ${{ inputs.scope }})
    if: inputs.scope != 'dns-tree'
    runs-on: ubuntu-26.04
    # Both budgets plus the build, with headroom: the old-anchor test alone
    # allows 30 minutes of walking.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust

      - name: Build the tests
        if: inputs.scope != 'census'
        working-directory: rust
        run: |
          cargo test --locked --release -p myotis-net --test live_cold_start --no-run
          cargo test --locked --release -p myotis-net --test live_pins_alive --no-run

      # The report prints only once the crawl ends, and timeout-minutes covers
      # the build as well, so a crawl the job cannot finish would lose all of
      # it: refuse that before building. 3000 s leaves 25 of the 75 minutes for
      # a cold-cache build (3 min warm), the serial pin probes (up to about a
      # minute per sick pin) and the drain. (The census itself refuses a
      # malformed number.)
      - name: Build the census
        if: inputs.scope == 'census'
        working-directory: rust
        env:
          CRAWL_SECS: ${{ inputs.census_crawl_secs }}
        run: |
          if [ -n "$CRAWL_SECS" ] && ! [ "$CRAWL_SECS" -le 3000 ] 2>/dev/null; then
            echo "::error::census_crawl_secs must be a whole number of seconds, at most 3000 (got '$CRAWL_SECS')"
            exit 1
          fi
          cargo build --locked --release -p myotis-net --example period_census

      # Pins first, one at a time, then every fork-matched peer the crawl
      # finds. An empty period means the current one (the example's default).
      - name: Period census
        if: inputs.scope == 'census'
        working-directory: rust
        env:
          NET: ${{ inputs.network }}
          PERIOD: ${{ inputs.census_period }}
          CRAWL_SECS: ${{ inputs.census_crawl_secs }}
          RUST_LOG: warn
        run: cargo run --locked --release -p myotis-net --example period_census

      # Cheap and first: if the shipped pins are dead, say so before spending
      # 15 minutes proving the wallet copes without them.
      - name: Are the shipped pins and bootnodes alive?
        id: pins_alive
        if: inputs.scope != 'census'
        working-directory: rust
        env:
          NET: ${{ inputs.network }}
          RUST_LOG: warn,myotis_net=info
        run: |
          cargo test --locked --release -p myotis-net --test live_pins_alive -- \
            --ignored --nocapture --test-threads=1

      # Discovery-only: every CL pin configured but dead. The EL at info: its
      # pool's debug output would bury the light client's, and the test's
      # progress lines carry what the EL half contributes.
      - name: Cold start with every pinned peer unreachable
        if: inputs.scope != 'census'
        working-directory: rust
        env:
          NET: ${{ inputs.network }}
          RUST_LOG: info,myotis_net=debug,myotis_net::el=info
        run: |
          cargo test --locked --release -p myotis-net --test live_cold_start -- \
            --ignored --nocapture cold_start_with_every_pinned_peer_unreachable

      # Runs for every scope except an explicit pins-only (or a census). With no
      # override the test reads the committed test-anchor file; a half-supplied
      # override reaches the test's own loud guard rather than skipping green.
      # !cancelled() lets it run after a failed dead-pins step (the job stays
      # red); the pin check passing is still required.
      - name: Cold start from an old anchor
        if: >-
          ${{ !cancelled() && steps.pins_alive.outcome == 'success' &&
          inputs.scope != 'pins-only' && inputs.scope != 'census' }}
        working-directory: rust
        env:
          NET: ${{ inputs.network }}
          MYOTIS_TEST_ANCHOR_ROOT: ${{ inputs.anchor_root }}
          MYOTIS_TEST_ANCHOR_SLOT: ${{ inputs.anchor_slot }}
          RUST_LOG: info,myotis_net=debug,myotis_net::el=info
        run: |
          cargo test --locked --release -p myotis-net --test live_cold_start -- \
            --ignored --nocapture cold_start_from_an_old_anchor

  # See the header: the EIP-1459 tree walk through the system resolver, per
  # platform. Not on gnosis or chiado, which publish no tree (the test asserts
  # the network has one, so it would fail there by design).
  dns-tree:
    name: DNS tree walk (${{ inputs.network }}, ${{ matrix.os }})
    if: >-
      (inputs.scope == 'full' || inputs.scope == 'dns-tree') &&
      (inputs.network == 'mainnet' || inputs.network == 'sepolia')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    # A walk is bounded at 15 s per tree (WalkLimits); the rest is the build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust

      - name: Build the test
        working-directory: rust
        run: cargo test --locked --release -p myotis-net --test live_dns_tree --no-run

      # The report line per tree ([live_dns_tree <net>] <domain> seq= lookups=
      # leaves= candidates= …) is the thing to read; the test fails on no
      # leaves, no dial candidate, a record that does not hash to its label,
      # or a walk past its deadline.
      - name: Walk the network's DNS trees through the system resolver
        working-directory: rust
        env:
          NET: ${{ inputs.network }}
        run: cargo test --locked --release -p myotis-net --test live_dns_tree -- --ignored --nocapture
