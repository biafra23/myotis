name: RAILGUN PoC DMG (macOS arm64)

# The RAILGUN PoC flavour's installer (docs/railgun-poc.md). Separate from
# desktop-dmg.yml because this flavour's seed is NOT in the repo: 426k logs over
# 11.3M mainnet blocks, ~549 MB raw (117 MB gzipped), which is over GitHub's
# per-file limit for the tree and does not belong in a clone anyway. It lives as
# an asset on the `railgun-seed` release instead — a release for DATA, separate
# from the app releases, because an app release cannot be built until the seed
# exists — and the runner fetches it from there. The dmg then BUNDLES it: the
# installed app never touches the network for its index.
#
# Nothing needs configuring. The two repository variables below are optional
# overrides for pointing a build at a different seed (a refresh under test, a
# fork's own asset); the defaults are the release asset and its sidecar.
#
# arm64 only. The Bee flavour ships arm64 alone for the same reason (the x64
# Rosetta leg is a release artifact for the standard app), and this one has no
# Intel audience to serve.

on:
  # Merge: every push to main produces a current artifact, so the demo machine
  # can always pull the latest build without waiting for a release.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # Manual, for rebuilding after the seed is refreshed (its shelf life is ~69
  # mainnet days) without needing a commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail fast, with the cause named, when the seed asset is not where the build
  # expects it — BEFORE spending a macOS runner on a checkout and a Rust build
  # that will die in the fetch step anyway. A missing asset is an error on every
  # trigger: the seed is the whole point of this artifact, and a build that went
  # green without it would be worse than a red one.
  seed:
    name: Check the seed asset
    runs-on: ubuntu-latest
    env:
      SEED_URL: ${{ vars.RAILGUN_SEED_URL || format('https://github.com/{0}/releases/download/railgun-seed/railgun-seed.tar.gz', github.repository) }}
    steps:
      - run: |
          set -eu
          echo "seed: $SEED_URL"
          # HEAD follows the redirect GitHub answers asset downloads with; a 404
          # here is the asset missing, not a network blip.
          code=$(curl --silent --head --location --output /dev/null --write-out '%{http_code}' --retry 3 "$SEED_URL" || echo 000)
          [ "$code" = "200" ] || {
            echo "::error::the seed asset is not reachable (HTTP $code): $SEED_URL — publish it to the railgun-seed release, or set RAILGUN_SEED_URL (docs/railgun-poc.md, CI)"
            exit 1
          }
          echo "seed asset reachable"

  build:
    name: Build macOS .dmg (arm64, railgun-poc)
    needs: seed
    runs-on: macos-14
    permissions:
      contents: read
    env:
      SEED_URL: ${{ vars.RAILGUN_SEED_URL || format('https://github.com/{0}/releases/download/railgun-seed/railgun-seed.tar.gz', github.repository) }}
      # The checksum comes from a sidecar published BESIDE the archive, so a
      # refreshed seed needs no change here. Travelling from the same place, it
      # proves the download arrived intact rather than who published it;
      # authenticity rests on GitHub's TLS and on release assets being writable
      # only with write access to the repository. The bundled manifest the app
      # checks at install is sealed into the dmg at build time and is the
      # stronger check. An explicit RAILGUN_SEED_SHA256 overrides the sidecar.
      SEED_SHA256_URL: ${{ format('{0}.sha256', vars.RAILGUN_SEED_URL || format('https://github.com/{0}/releases/download/railgun-seed/railgun-seed.tar.gz', github.repository)) }}
      SEED_SHA256: ${{ vars.RAILGUN_SEED_SHA256 }}
      # The extraction ROOT. The fetch's own directory inside it is located by
      # the fetch step and exported as SEED_DIR — deliberately a DIFFERENT name,
      # because a job-level env var overrides whatever a step writes to
      # $GITHUB_ENV, so reusing the name here would silently win over it.
      SEED_ROOT: ${{ github.workspace }}/railgun-seed

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          fetch-depth: 0

      # The dmg's name carries the version only on a release, per the owner's
      # request. On main it stays unversioned so the "latest build" link is
      # stable; on a tag it is self-identifying once downloaded, which is what
      # matters for an artifact people keep. The tag name is the release's own
      # convention (desktop-dmg.yml: Myotis-<tag>-<arch>.dmg,
      # Myotis-<tag>-bee-poc-arm64.dmg): the whole tag, `v` included, right after
      # "Myotis-", so a release's macOS assets read as one set. Versioned exactly
      # when the release job below runs, which expects this name.
      - name: Resolve the dmg name
        id: name
        run: |
          set -eu
          case "${GITHUB_REF}" in
            refs/tags/v*)
              tag="${GITHUB_REF_NAME}"
              # The tag goes into the file name, so check its shape the way the
              # dmg, deb and apk publish jobs do: `gh release upload` reads
              # everything after a `#` in a path as the asset's label, and the
              # version guard accepts any v<version>-<suffix>, so a tag like
              # v<version>-rc#1 would fail the upload after the release exists.
              # Checked here, before the build, so this workflow never gets as
              # far as creating the release.
              printf '%s' "$tag" | grep -Eq '^v[A-Za-z0-9._-]+$' \
                || { echo "::error::'$tag' is not a valid release tag (expected v<version>)"; exit 1; }
              echo "dmg=Myotis-${tag}-railgun-poc-arm64.dmg" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dmg=Myotis-railgun-poc-arm64.dmg" >> "$GITHUB_OUTPUT"
              ;;
          esac
          cat "$GITHUB_OUTPUT"

      # The seed arrives from outside the repository, so it is checked before it
      # is trusted: a truncated download would otherwise surface as a seed that
      # frames "successfully" with fewer logs than it should have, which no later
      # step can tell from a genuine short range.
      - name: Fetch the seed
        run: |
          set -eu
          mkdir -p "$SEED_ROOT"
          archive="$RUNNER_TEMP/railgun-seed.tar.gz"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 5 \
            --output "$archive" "$SEED_URL"
          # The checksum is REQUIRED, from the override or the sidecar: a truncated
          # download would otherwise frame "successfully" with fewer logs than it
          # should have, which no later step can tell from a genuinely short range.
          if [ -z "${SEED_SHA256:-}" ]; then
            SEED_SHA256=$(curl --fail --location --show-error --silent --retry 3 --retry-delay 5 "$SEED_SHA256_URL" | awk '{print $1}')
            [ -n "$SEED_SHA256" ] || { echo "::error::no checksum: the sidecar $SEED_SHA256_URL is missing or empty and RAILGUN_SEED_SHA256 is not set"; exit 1; }
          fi
          echo "${SEED_SHA256}  ${archive}" | shasum -a 256 -c - \
            || { echo "::error::the downloaded seed does not match its checksum ${SEED_SHA256}"; exit 1; }
          echo "seed checksum OK"
          # Extract VERBATIM and then locate the fetch inside, rather than
          # guessing the archive's shape with --strip-components: that flag does
          # not fail on a flat archive, it silently extracts nothing, and the
          # build would then report a missing seed dir it was in fact handed.
          tar -xzf "$archive" -C "$SEED_ROOT"
          meta=$(find "$SEED_ROOT" -maxdepth 3 -name '*.meta.json' | head -n1 || true)
          [ -n "$meta" ] || { echo "::error::the seed archive contains no *.meta.json"; find "$SEED_ROOT" -maxdepth 3; exit 1; }
          found_dir=$(dirname "$meta")
          # Either form is acceptable, so test them separately: `ls a b` exits
          # non-zero when EITHER is missing, which rejected the first real build's
          # correct archive for lacking the .gz it never needed.
          [ -f "$found_dir/railgun-logs.jsonl" ] || [ -f "$found_dir/railgun-logs.jsonl.gz" ] \
            || { echo "::error::no railgun-logs.jsonl[.gz] beside $meta"; ls -la "$found_dir"; exit 1; }
          # prepareRailgunPocSeed also refuses more than one meta, but saying so
          # here names the archive as the cause rather than the build.
          count=$(find "$SEED_ROOT" -maxdepth 3 -name '*.meta.json' | wc -l | tr -d ' ')
          [ "$count" = "1" ] \
            || { echo "::error::the seed archive holds $count *.meta.json files; it must hold exactly the fetch to bundle"; exit 1; }
          echo "SEED_DIR=$found_dir" >> "$GITHUB_ENV"
          ls -la "$found_dir"

      - name: Set up JDK 21 (aarch64)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: aarch64

      # The packaged app bundles the Rust engine (appResources); prepareRustAppResources
      # fails the build if the lib is missing, so this is REQUIRED.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Same toolchain pinning as desktop-dmg.yml: auto-detect off plus an
      # explicit installation path, so jpackage emits an arm64 dmg rather than
      # picking a stray pre-installed JDK. Retry rides out dependency-resolution
      # blips, not build errors — a real failure fails all three attempts.
      - name: Build macOS .dmg (arm64, railgun-poc)
        env:
          RUST_TARGET: aarch64-apple-darwin
        run: |
          GRADLE_ARGS="-Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths=$JAVA_HOME"
          for attempt in 1 2 3; do
            ./gradlew :app-desktop:packageDmg --stacktrace $GRADLE_ARGS \
              -PrailgunPoc -PrailgunSeedDir="$SEED_DIR" && exit 0
            echo "::warning::DMG build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::DMG build failed after 3 attempts"
          exit 1

      # Compose names the output after the app name and packageVersion; rename to
      # the flavour- and arch-tagged name resolved above. Assert exactly one, so a
      # leftover build is never shipped in place of the fresh one.
      - name: Name the .dmg
        env:
          DMG_NAME: ${{ steps.name.outputs.dmg }}
        run: |
          set -eu
          shopt -s nullglob
          dmgs=(app-desktop/build/compose/binaries/main/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 dmg, found ${#dmgs[@]}: ${dmgs[*]}"; exit 1; }
          mv "${dmgs[0]}" "app-desktop/build/compose/binaries/main/dmg/$DMG_NAME"

      # The same arch and engine assertions the standard legs make, plus the ones
      # specific to this flavour: it must carry ITS seed, and must not carry the
      # Bee flavour's. A dmg that builds and installs but has no index inside is
      # exactly the failure this artifact exists to prevent, and nothing at
      # runtime would report it except a wallet getting -32000 forever.
      - name: Verify the .dmg
        env:
          DMG_NAME: ${{ steps.name.outputs.dmg }}
        run: |
          set -eu
          dmg="app-desktop/build/compose/binaries/main/dmg/$DMG_NAME"
          mnt=$(mktemp -d)
          cleanup() { hdiutil detach "$mnt" >/dev/null 2>&1 || hdiutil detach "$mnt" -force >/dev/null 2>&1 || true; rmdir "$mnt" 2>/dev/null || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"

          launcher=$(find "$mnt" -type f -path '*/Contents/MacOS/*' | head -n1)
          [ -n "$launcher" ] || { echo "::error::no app launcher found under $dmg — bundle layout changed?"; exit 1; }
          lipo -archs "$launcher" | tr ' ' '\n' | grep -qx arm64 \
            || { echo "::error::arch mismatch: expected arm64, got [$(lipo -archs "$launcher")]"; exit 1; }
          echo "OK: launcher is arm64"

          rustlib=$(find "$mnt" -type f -name 'libmyotis_engine.dylib' | head -n1 || true)
          [ -n "$rustlib" ] || { echo "::error::libmyotis_engine.dylib missing from the dmg"; exit 1; }
          lipo -archs "$rustlib" | tr ' ' '\n' | grep -qx arm64 \
            || { echo "::error::rust engine arch mismatch: [$(lipo -archs "$rustlib")]"; exit 1; }
          echo "OK: bundled rust engine is arm64"

          # JNA's stub must be present, arm64 and validly signed, or the Rust
          # engine silently never loads (JNA swallows the boot-path failure).
          jna=$(find "$mnt" -type f -name 'libjnidispatch.dylib' | head -n1 || true)
          [ -n "$jna" ] || { echo "::error::libjnidispatch.dylib missing — the packaged app cannot load the Rust engine"; exit 1; }
          lipo -archs "$jna" | tr ' ' '\n' | grep -qx arm64 \
            || { echo "::error::JNA stub arch mismatch: [$(lipo -archs "$jna")]"; exit 1; }
          codesign --verify --verbose=2 "$jna" \
            || { echo "::error::JNA stub is not validly signed — jpackage did not sign it"; exit 1; }
          echo "OK: bundled JNA stub is arm64 and signed"

          # Mainnet's index carries no network suffix. A suffixed name would
          # install and checksum fine and then never be opened by the engine, so
          # assert the exact name rather than "some .db".
          seed=$(find "$mnt" -type f -name 'logindex.db' | head -n1 || true)
          manifest=$(find "$mnt" -type f -name 'railgun-poc-seed.properties' | head -n1 || true)
          [ -n "$seed" ] && [ -n "$manifest" ] \
            || { echo "::error::the railgun-poc dmg is missing its seed or manifest"; exit 1; }
          echo "bundled seed: $seed ($(stat -f%z "$seed") bytes)"
          cat "$manifest"
          # The watch floor is the assertion the whole index rests on: below it
          # the engine answers [] without consulting coverage, so a floor above
          # the real deployment hides history. 14693013 circulates as the RAILGUN
          # deployment block and is wrong the other way: 44,678 blocks below the
          # seed's coverage would be refused, and with this flavour's backfill
          # paused nothing walks them.
          # Fail the build unless both pin the exact block.
          grep -qx 'deploymentBlock=14737691' "$manifest" \
            || { echo "::error::manifest does not pin deploymentBlock=14737691"; exit 1; }
          grep -qx 'coveredLow=14737691' "$manifest" \
            || { echo "::error::the seed's coverage does not reach the deployment block"; exit 1; }
          echo "OK: seed covers the contract from its deployment block"

          # …and it must not carry the other flavour's files.
          stray=$(find "$mnt" -type f \( -name 'logindex-gnosis.db' -o -name 'bee-poc-seed.properties' \) | head -n1 || true)
          [ -z "$stray" ] || { echo "::error::the railgun-poc dmg carries Bee PoC files ($stray)"; exit 1; }

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: myotis-railgun-poc-dmg-arm64-${{ github.sha }}
          path: app-desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable per run; without this, "re-run all jobs" on a
          # tag 409s and the release job never runs.
          overwrite: true

  # Refuse to publish when the pushed tag disagrees with the version in the tree,
  # the same gate the standard dmgs pass through.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Attach the dmg to the GitHub Release for the pushed tag. Every asset workflow
  # (listed in release-version-guard.yml) publishes to the SAME release;
  # whichever runs first creates it and the others upload into it.
  release:
    name: Publish railgun dmg to release
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the dmg artifact
        uses: actions/download-artifact@v4
        with:
          name: myotis-railgun-poc-dmg-arm64-${{ github.sha }}
          path: dmg

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh must be told the repo explicitly or it
          # dies with "fatal: not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # The name the build job's "Resolve the dmg name" step gave it (and
          # where the tag's shape was checked).
          dmg="dmg/Myotis-${tag}-railgun-poc-arm64.dmg"
          test -f "$dmg" || { echo "::error::missing $dmg"; ls -la dmg; exit 1; }
          # Master notes for the case where THIS job creates the release: the
          # same text android-apk, desktop-dmg, desktop-linux-deb, node-binding
          # and ios-framework carry, so a release this job wins the create race
          # for still documents every sibling's asset. Quoted heredoc +
          # --notes-file keep the markdown literal.
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Myotis wallet apps.

          **Android (`*-android-debug.apk`)** — unsigned *debug* build. Install via
          "Install unknown apps". Not a signed release build.

          **Desktop macOS (`Myotis-v<version>-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Bee PoC (`Myotis-v<version>-bee-poc-arm64.dmg`, when present)** — a separate app
          ("Myotis Bee PoC", own data dir) that a Swarm Bee full node can use as its
          Gnosis RPC from the first minute: it ships a pre-built PostageStamp log-index
          seed and warm peer caches. Demo/debug artefact — the seed is RPC-sourced and
          unverified until the walker re-fetches it, and it stops catching up about 29
          days after its fetch (the Index tab shows the block it is usable until). See
          docs/bee-rpc-service.md.

          **RAILGUN PoC (`Myotis-v<version>-railgun-poc-arm64.dmg`, when present)** — a separate
          app ("Myotis RAILGUN PoC", own data dir) that the RAILGUN Terminal Wallet CLI can use as
          its mainnet RPC from the first minute: it ships a pre-built log-index seed covering the
          RailgunSmartWallet contract from its deployment block. It serves on port 8555, not the
          regular app's 8545: point the wallet at `http://127.0.0.1:8555`. Debug/demo artefact,
          not a production path — the seed is RPC-sourced and unverified (no receipt-root proof),
          and it stops catching up about 69 days after its fetch (the Index tab shows the block it
          is usable until). See docs/railgun-poc.md.

          **Desktop Linux (`Myotis-v<version>-<arch>.deb`)** — install with
          `sudo apt install ./Myotis-v<version>-<arch>.deb` (x64 for Intel/AMD, arm64 for
          Raspberry Pi 5 / ARM machines).
          NOTES
          # The release may not exist yet if this workflow wins the race with the
          # other publishers; create it only then. If `create` fails, re-check with
          # `view`: success there means another job created it first (fine), while
          # a genuine failure still surfaces because `view` fails too.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Myotis $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" "$dmg" --clobber
          echo "uploaded $dmg to $tag"
