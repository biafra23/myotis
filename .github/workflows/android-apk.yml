name: Android APK

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below). Tags still
  # build the release .apk.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) — the double-run is already
  # killed by narrowing push above, and this keeps CI on PRs that don't target main.
  pull_request:

# Cancel a superseded run when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          # fetch-tags alone can't do it — at depth 1 HEAD has no parents, so the
          # tag stays unreachable even once its ref is present. .gitmodules is empty,
          # so `submodules: recursive` adds nothing on top: the cost is one full
          # (~150MB) clone per matrix job, on jobs that already build Kotlin + Rust.
          #
          # KNOWN GAP on pull_request: checkout defaults to github.ref, which for
          # that event is the ephemeral refs/pull/<n>/merge commit — so a PR-built
          # artifact stamps a sha that resolves nowhere. Deliberately not pinned to
          # the PR head: that would change WHAT is built (head, not head-merged-into-
          # base) and lose the integration signal. The base version is still right,
          # since the merge commit reaches the tag through its base parent.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching (restores the base-branch cache
      # so AGP / Besu / JitPack-fork artifacts come from cache, not flaky repos).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Android app builds the Rust engine jniLibs FROM SOURCE by default —
      # there is no committed .so, so the published APK can never ship a stale
      # binary (the recurring failure mode: an ABI-compatible but feature-stale
      # .so that fails UniFFI validation on-device and silently falls back to
      # Java). This job provides the required toolchain: the Android rustup
      # targets below, cargo-ndk, and the runner's preinstalled NDK (found via
      # ANDROID_NDK_HOME / $ANDROID_HOME/ndk). No -PskipRustEngine here — the
      # shipped APK must carry the engine.
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # assembleDebug below already builds the engine via preBuild, but run it
      # explicitly first so a toolchain problem fails here with a clear step name.
      # The newer-than check catches a silent skip (cargoNdkAndroid self-skips
      # only when the toolchain is incomplete — which requireAndroidRustEngine
      # would already have turned into a hard error).
      - name: Build Rust jniLibs from source
        run: |
          ./gradlew cargoNdkAndroid --stacktrace
          for abi in arm64-v8a x86_64; do
            lib="android-app/src/main/jniLibs/$abi/libmyotis_engine.so"
            [ "$lib" -nt gradlew ] \
              || { echo "::error::$lib was NOT built (cargoNdkAndroid self-skipped?)"; exit 1; }
          done

      # The COMMITTED UniFFI bindings (myotis_engine.kt) must match the current
      # Rust source, or a from-source .so and the committed bindings disagree on
      # per-function checksums and the Rust engine fails UniFFI validation
      # on-device — silently falling back to Java. This bit hard in v0.1.4: a
      # doc-comment edit on an `#[uniffi::export]` fn changed its checksum (recent
      # UniFFI folds the docstring into the checksum), but the bindings were never
      # regenerated, so the CI-built APK shipped a dead "Rust engine" toggle.
      # cargoNdkAndroid rebuilds the .so but NOT the .kt, so regenerate and assert
      # no drift. Scope the diff to the bindings file — the step above intentionally
      # rewrote the (git-ignored-for-drift) .so binaries with fresh builds.
      - name: Verify committed UniFFI bindings match the Rust source
        run: |
          ./gradlew uniffiGenerateKotlin --stacktrace
          bindings=myotis-engines/src/main/kotlin/uniffi/myotis_engine/myotis_engine.kt
          git diff --exit-code -- "$bindings" || {
            echo "::error::$bindings is STALE vs rust/myotis-engine — regenerate with" \
                 "\`./gradlew uniffiGenerateKotlin\` and commit. A from-source .so would" \
                 "fail UniFFI checksum validation against these bindings and the Rust" \
                 "engine would silently fall back to Java on-device."
            exit 1
          }

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent. No extra
      # sdkmanager calls needed for compileSdk 34.

      # Retry to ride out transient external-repo resolution blips. NOT --offline:
      # offline turns a single cache miss (e.g. a changed build file) into a hard
      # failure, which is what broke this job before.
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            ./gradlew :android-app:assembleDebug --stacktrace && exit 0
            echo "::warning::APK build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      # The Rust engine needs BOTH libmyotis_engine.so and JNA's
      # libjnidispatch.so, per ABI, or UniFFI cannot load and the app silently
      # falls back to the Java engine — a green build shipping a dead "Rust
      # engine" toggle, which is exactly what v0.1.3 and v0.1.4 did. Every
      # mechanism that puts these in the APK fails open (a resolution change
      # dropping an artifact, the aar losing an ABI, the jniLib merge racing the
      # extraction), and nothing else here would notice, so assert on the built
      # artifact rather than trusting the build graph.
      - name: Verify the APK can actually load the Rust engine
        run: |
          set -euo pipefail
          apk=$(ls android-app/build/outputs/apk/debug/*.apk | head -n1)
          # Read the listing ONCE into a variable and match against that. Piping
          # `unzip -l` into `grep -q` looks natural but breaks under pipefail:
          # grep exits at the first match, unzip takes SIGPIPE, and the pipeline
          # reports failure on a perfectly good APK.
          listing=$(unzip -l "$apk")
          engines=$(sed -n 's#.*lib/\([^/]*\)/libmyotis_engine\.so.*#\1#p' <<< "$listing" | sort -u)
          [ -n "$engines" ] \
            || { echo "::error::no libmyotis_engine.so in the APK at all"; exit 1; }
          while IFS= read -r abi; do
            [ -n "$abi" ] || continue
            grep -q "lib/$abi/libjnidispatch\.so" <<< "$listing" \
              || { echo "::error::$abi ships libmyotis_engine.so with no libjnidispatch.so — JNA cannot dispatch, so the Rust engine would silently fall back to Java"; exit 1; }
            echo "  ok: $abi has both libmyotis_engine.so and libjnidispatch.so"
          done <<< "$engines"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # Attach the built APK to the GitHub Release for the pushed tag. Runs ONLY on
  # `v*` tags (never on branch/PR builds), and reuses the build job's artifact
  # rather than rebuilding. The desktop-dmg workflow publishes to the SAME
  # release for the same tag; whichever job runs first creates it and the other
  # just uploads its asset — the create step below tolerates that race.
  release:
    name: Publish APK to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload needs write access to Releases (repo contents).
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: apk

      - name: Rename APK to a stable, versioned asset name
        run: |
          set -eu
          # Glob into an array and assert exactly one apk — a stray second file
          # (or zero) should fail here, not silently ship an arbitrary pick.
          shopt -s nullglob
          apks=(apk/*.apk)
          [ "${#apks[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          mv "${apks[0]}" "apk/Myotis-${GITHUB_REF_NAME}-android-debug.apk"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh must be told the repo explicitly or it
          # dies with "fatal: not a git repository" (which sank the first v0.1.0
          # attempt: every gh release call failed, so no release was created).
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Notes via a quoted heredoc + --notes-file: markdown stays literal
          # (no shell escaping of backticks/quotes) and renders as intended.
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Myotis wallet apps.

          **Android (`*-android-debug.apk`)** — unsigned *debug* build. Install via
          "Install unknown apps". Not a signed release build.

          **Desktop macOS (`Myotis-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Desktop Linux (`Myotis-<arch>.deb`)** — install with
          `sudo apt install ./Myotis-<arch>.deb` (x64 for Intel/AMD, arm64 for
          Raspberry Pi 5 / ARM machines).
          NOTES
          # Create the release if it doesn't exist yet. The desktop workflow may
          # win this race for the same tag: if `create` fails, re-check with
          # `view` — success there means the other job already created it (fine),
          # while a genuine failure still surfaces because `view` also fails.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Myotis $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" apk/Myotis-*.apk --clobber
