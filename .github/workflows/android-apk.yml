name: Android APK

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below). Tags still
  # build the release .apk.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) — the double-run is already
  # killed by narrowing push above, and this keeps CI on PRs that don't target main.
  pull_request:

# Cancel a superseded run when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          # fetch-tags alone can't do it — at depth 1 HEAD has no parents, so the
          # tag stays unreachable even once its ref is present. .gitmodules is empty,
          # so `submodules: recursive` adds nothing on top: the cost is one full
          # (~150MB) clone per matrix job, on jobs that already build Kotlin + Rust.
          #
          # KNOWN GAP on pull_request: checkout defaults to github.ref, which for
          # that event is the ephemeral refs/pull/<n>/merge commit — so a PR-built
          # artifact stamps a sha that resolves nowhere. Deliberately not pinned to
          # the PR head: that would change WHAT is built (head, not head-merged-into-
          # base) and lose the integration signal. The base version is still right,
          # since the merge commit reaches the tag through its base parent.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching (restores the base-branch cache
      # so AGP / Besu / JitPack-fork artifacts come from cache, not flaky repos).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Android app builds the Rust engine jniLibs FROM SOURCE by default —
      # there is no committed .so, so the published APK can never ship a stale
      # binary (the recurring failure mode: an ABI-compatible but feature-stale
      # .so that fails UniFFI validation on-device and silently falls back to
      # Java). This job provides the required toolchain: the Android rustup
      # targets below, cargo-ndk, and the runner's preinstalled NDK (found via
      # ANDROID_NDK_HOME / $ANDROID_HOME/ndk). No -PskipRustEngine here — the
      # shipped APK must carry the engine.
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # assembleDebug below already builds the engine via preBuild, but run it
      # explicitly first so a toolchain problem fails here with a clear step name.
      # The newer-than check catches a silent skip (cargoNdkAndroid self-skips
      # only when the toolchain is incomplete — which requireAndroidRustEngine
      # would already have turned into a hard error).
      - name: Build Rust jniLibs from source
        run: |
          ./gradlew cargoNdkAndroid --stacktrace
          for abi in arm64-v8a x86_64; do
            lib="android-app/src/main/jniLibs/$abi/libmyotis_engine.so"
            [ "$lib" -nt gradlew ] \
              || { echo "::error::$lib was NOT built (cargoNdkAndroid self-skipped?)"; exit 1; }
          done

      # The COMMITTED UniFFI bindings (myotis_engine.kt) must match the current
      # Rust source, or a from-source .so and the committed bindings disagree on
      # per-function checksums and the Rust engine fails UniFFI validation
      # on-device — silently falling back to Java. This bit hard in v0.1.4: a
      # doc-comment edit on an `#[uniffi::export]` fn changed its checksum (recent
      # UniFFI folds the docstring into the checksum), but the bindings were never
      # regenerated, so the CI-built APK shipped a dead "Rust engine" toggle.
      # cargoNdkAndroid rebuilds the .so but NOT the .kt, so regenerate and assert
      # no drift. Scope the diff to the bindings file — the step above intentionally
      # rewrote the (git-ignored-for-drift) .so binaries with fresh builds.
      - name: Verify committed UniFFI bindings match the Rust source
        run: |
          ./gradlew uniffiGenerateKotlin --stacktrace
          bindings=myotis-engines/src/main/kotlin/uniffi/myotis_engine/myotis_engine.kt
          git diff --exit-code -- "$bindings" || {
            echo "::error::$bindings is STALE vs rust/myotis-engine — regenerate with" \
                 "\`./gradlew uniffiGenerateKotlin\` and commit. A from-source .so would" \
                 "fail UniFFI checksum validation against these bindings and the Rust" \
                 "engine would silently fall back to Java on-device."
            exit 1
          }

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent. No extra
      # sdkmanager calls needed for compileSdk 34.

      # Retry to ride out transient external-repo resolution blips. NOT --offline:
      # offline turns a single cache miss (e.g. a changed build file) into a hard
      # failure, which is what broke this job before.
      #
      # assembleDebugAndroidTest rides along so the boot smoke test's sources
      # (androidTest) are compiled by a BLOCKING job: AGP wires androidTest into
      # neither `assemble` nor `check`, and the emulator job below is
      # continue-on-error — without this, a broken NodeBootSmokeTest.kt could sit
      # green in CI indefinitely.
      - name: Build debug APK (+ compile the androidTest APK)
        run: |
          for attempt in 1 2 3; do
            ./gradlew :android-app:assembleDebug :android-app:assembleDebugAndroidTest --stacktrace && exit 0
            echo "::warning::APK build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      # The Rust engine needs BOTH libmyotis_engine.so and JNA's
      # libjnidispatch.so, per ABI, or UniFFI cannot load and the app silently
      # falls back to the Java engine — a green build shipping a dead "Rust
      # engine" toggle, which is exactly what v0.1.3 and v0.1.4 did. Every
      # mechanism that puts these in the APK fails open (a resolution change
      # dropping an artifact, the aar losing an ABI, the jniLib merge racing the
      # extraction), and nothing else here would notice, so assert on the built
      # artifact rather than trusting the build graph.
      - name: Verify the APK can actually load the Rust engine
        run: |
          set -euo pipefail
          apk=$(ls android-app/build/outputs/apk/debug/*.apk | head -n1)
          # Read the listing ONCE into a variable and match against that. Piping
          # `unzip -l` into `grep -q` looks natural but breaks under pipefail:
          # grep exits at the first match, unzip takes SIGPIPE, and the pipeline
          # reports failure on a perfectly good APK.
          listing=$(unzip -l "$apk")
          engines=$(sed -n 's#.*lib/\([^/]*\)/libmyotis_engine\.so.*#\1#p' <<< "$listing" | sort -u)
          [ -n "$engines" ] \
            || { echo "::error::no libmyotis_engine.so in the APK at all"; exit 1; }
          while IFS= read -r abi; do
            [ -n "$abi" ] || continue
            grep -q "lib/$abi/libjnidispatch\.so" <<< "$listing" \
              || { echo "::error::$abi ships libmyotis_engine.so with no libjnidispatch.so — JNA cannot dispatch, so the Rust engine would silently fall back to Java"; exit 1; }
            echo "  ok: $abi has both libmyotis_engine.so and libjnidispatch.so"
          done <<< "$engines"

      # minSdk JDK-API gate — enforcement for CLAUDE.md's "minSdk 29 JDK-API
      # budget"; the script's docstring is the full story. The platform install
      # feeds its api-versions canary: pre-36.1 databases don't record every
      # policed API (Files.readString first appears in the 36.1 database), and
      # the script refuses to scan against a database that old (exit 2).
      - name: Verify minSdk JDK-API compatibility
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" \
            || echo "::warning::sdkmanager could not install platforms;android-36.1 — the gate's own database canary will decide"
          apk=$(ls android-app/build/outputs/apk/debug/*.apk | head -n1)
          python3 scripts/check_apk_min_api.py --apk "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable per run; without this, "re-run all jobs" on a
          # tag 409s in the build leg and the release job never runs. That is the
          # button people reach for after the version guard fails, so the recovery
          # path must not wedge the release. (node-binding.yml has carried this
          # fix since it hit exactly that.)
          overwrite: true

  # Boot the actual app on a minSdk (API 29) emulator. A static bytecode gate
  # (scripts/check_apk_min_api.py, from the parallel minSdk-29 JDK-API work)
  # can prove java.*/javax.* references resolve at API 29, but android.*
  # framework APIs are out of any dex scan's reach (SDK_INT guards are invisible
  # to it), api-versions.xml has gaps, and no scan proves the app actually
  # BOOTS. This job launches MainActivity and runs NodeService through a full
  # engine-stack start (networking + consensus init) on an API-29 AOSP image via
  # the `api29` Gradle Managed Device (NodeBootSmokeTest), so a startup-path
  # NoClassDefFoundError/NoSuchMethodError fails here instead of on a user's
  # phone.
  #
  # -PskipRustEngine: runs on the Java engine. The minSdk-linkage risk this job
  # hunts lives entirely in the JVM code (the Rust .so has no JDK/ART surface),
  # it spares this job the whole Android Rust toolchain, and it is exactly the
  # fallback an APK without the jniLibs uses at runtime. Known gap, accepted:
  # the Rust engine's own on-device load path (JNA/UniFFI) is not exercised by
  # any boot test yet.
  boot-smoke-api29:
    name: API-29 boot smoke (emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip on release tags: nothing consumes this job's result there (release
    # needs only build + version-guard), and the tagged commit already ran it on
    # its way through main/PR.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # The in-test deadline only bounds the test body — NOT the system-image
    # download, AVD creation, or an emulator/adb hang (the failure modes named
    # below), which would otherwise run to GitHub's 6-hour default on a job
    # whose failure nothing surfaces.
    timeout-minutes: 45
    # NON-BLOCKING for now, deliberately: this is the repo's first emulator job,
    # and hosted-runner emulators are notoriously flaky (boot hangs, adb drops)
    # even with KVM. Job-level continue-on-error semantics: a failure still
    # shows as a red check on the PR, but the WORKFLOW run passes, so it gates
    # nothing (do NOT add this job to required checks while this line is here —
    # a required check blocks merge on red regardless of continue-on-error).
    # Once it has proven stable for a few weeks, promote it to blocking by
    # deleting this line. (No retry loop around gradle here, unlike the build
    # job: a retry would also re-run a genuinely failing boot test into the
    # job timeout.)
    continue-on-error: true
    steps:
      # Shallow on purpose (no fetch-depth: 0): the build job needs full history
      # for the version stamp; here the stamp is irrelevant, and :ui's version
      # probe degrades to its fallback label instead of failing without it.
      # (No `chmod +x gradlew` either — the executable bit is committed.)
      - name: Checkout
        uses: actions/checkout@v4

      # The emulator needs hardware virtualization; ubuntu-latest runners expose
      # /dev/kvm but root-only by default. This is the standard "enable KVM" udev
      # rule from the android-emulator-runner docs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP's managed-device setup downloads the emulator + the API-29 system
      # image (several hundred MB, a couple of minutes) into the runner's
      # preinstalled SDK by itself — no sdkmanager steps needed, licenses are
      # pre-accepted on the runner image. Follow-up once the job proves stable:
      # cache the system image + AVD to shave those minutes. swiftshader_indirect:
      # the runner has no GPU, so render in software (the documented GMD-on-CI
      # setting).
      - name: Run the boot smoke test on the API-29 managed device
        run: |
          ./gradlew :android-app:api29DebugAndroidTest -PskipRustEngine \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace

      # Results + per-test logcat — the boot verdict/diagnostics live here when
      # the test fails. Not on green runs: that bundle is dead weight.
      # `|| cancelled()`: a job that hits timeout-minutes is CANCELLED, not
      # failed, and failure() alone would skip this exact step on the hang
      # scenario the timeout exists for — the run most in need of the partial
      # UTP/emulator logs. (Superseded runs cancelled by concurrency also hit
      # this; their partial upload is harmless.) if-no-files-found stays on the
      # default `warn`: a failure that produced no results at all (died before
      # the device) should say so, not vanish.
      - name: Upload managed-device test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api29-boot-smoke-results-${{ github.sha }}
          path: |
            android-app/build/outputs/androidTest-results/managedDevice/
            android-app/build/reports/androidTests/managedDevice/
          retention-days: 14
          # Same re-run rationale as the APK artifact above.
          overwrite: true

      # continue-on-error keeps the WORKFLOW green on a failure here; this
      # annotation makes the red job hard to miss from the run summary too.
      # `|| cancelled()` for the same timeout-cancellation reason as the upload.
      - name: Surface the failure as an annotation
        if: failure() || cancelled()
        run: echo "::warning title=API-29 boot smoke did not pass::the boot smoke test failed, timed out, or was cancelled (non-blocking) — see the api29-boot-smoke-results artifact and this job's log"

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # — the asset name below comes from the tag, the versionName inside the apk
  # comes from project.version. See release-version-guard.yml. Runs in parallel
  # with the build, so a mismatch is reported early rather than after the build.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Attach the built APK to the GitHub Release for the pushed tag. Runs ONLY on
  # `v*` tags (never on branch/PR builds), and reuses the build job's artifact
  # rather than rebuilding. The desktop-dmg workflow publishes to the SAME
  # release for the same tag; whichever job runs first creates it and the other
  # just uploads its asset — the create step below tolerates that race.
  release:
    name: Publish APK to release
    # version-guard carries the same `if` as this job, so it is never merely
    # skipped underneath it — on a tag push both run, otherwise both are skipped.
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload needs write access to Releases (repo contents).
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: apk

      - name: Rename APK to a stable, versioned asset name
        run: |
          set -eu
          # Glob into an array and assert exactly one apk — a stray second file
          # (or zero) should fail here, not silently ship an arbitrary pick.
          shopt -s nullglob
          apks=(apk/*.apk)
          [ "${#apks[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          mv "${apks[0]}" "apk/Myotis-${GITHUB_REF_NAME}-android-debug.apk"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — gh must be told the repo explicitly or it
          # dies with "fatal: not a git repository" (which sank the first v0.1.0
          # attempt: every gh release call failed, so no release was created).
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Notes via a quoted heredoc + --notes-file: markdown stays literal
          # (no shell escaping of backticks/quotes) and renders as intended.
          notes=$(mktemp)
          cat > "$notes" <<'NOTES'
          Pre-release build of the Myotis wallet apps.

          **Android (`*-android-debug.apk`)** — unsigned *debug* build. Install via
          "Install unknown apps". Not a signed release build.

          **Desktop macOS (`Myotis-<arch>.dmg`)** — unsigned; download the dmg matching
          your Mac (arm64 for Apple Silicon, x64 for Intel). First launch:
          right-click → Open to get past Gatekeeper (not notarized yet).

          **Desktop Linux (`Myotis-<arch>.deb`)** — install with
          `sudo apt install ./Myotis-<arch>.deb` (x64 for Intel/AMD, arm64 for
          Raspberry Pi 5 / ARM machines).
          NOTES
          # Create the release if it doesn't exist yet. The desktop workflow may
          # win this race for the same tag: if `create` fails, re-check with
          # `view` — success there means the other job already created it (fine),
          # while a genuine failure still surfaces because `view` also fails.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --prerelease \
              --title "Myotis $tag" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}" \
            || gh release view "$tag" >/dev/null 2>&1
          fi
          gh release upload "$tag" apk/Myotis-*.apk --clobber
