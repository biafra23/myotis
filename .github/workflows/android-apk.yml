name: Android APK

on:
  # Scope push to main + release tags so a branch push that also has an open PR
  # doesn't build twice (the PR is covered by pull_request below). Tags still
  # build the release .apk.
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  # pull_request stays unscoped (any base branch) so every PR shows this
  # workflow's checks — but the JOBS below skip a PR whose base is not main
  # (owner ruling, 2026-10-09): a part PR of a multi-PR plan targets its
  # feature branch, and building an APK plus a 10-minute emulator boot for
  # each part costs more than it tells; the final feature → main PR builds
  # everything. Tests, clippy, the lockfile check and the Claude review stay
  # on every PR (ci.yml and siblings). A part that touches the Rust engine's
  # Android build or the minSdk budget can still run this on demand from the
  # Actions tab (workflow_dispatch) — note that check_apk_min_api.py, the
  # minSdk-29 enforcement, runs in this workflow and nowhere else.
  pull_request:
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR. The
# event is part of the group because a dispatch shares refs with push runs
# (the Actions UI offers main and the tags): without it, a dispatch on main
# cancels an in-flight merge-to-main run, and one on a v* tag cancels that
# tag's run mid-release-upload — the scenario desktop-linux-deb.yml and
# node-binding.yml key the event in for. A dispatch on a v* tag is the
# release-republish path, as in node-binding.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Holds the build, and the emulator smoke behind it, until this PR's Claude
  # review has finished, so neither runs on a commit the review might still
  # ask to change. It passes straight through on every other event — see
  # wait-for-claude-review.yml.
  review-gate:
    name: Review gate
    # Everything below needs this job, so skipping it here skips the build and
    # the emulator smoke too (a dependent job is skipped when a needed job was,
    # unless its `if` uses always()) — and on a tag the release uploads. So an
    # `if:` on this job MUST be true on every non-pull_request event (push to
    # main, v* tags, dispatch); the only safe test is the PR's base branch,
    # which is all this one does (#582). The release jobs only run on tags.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    uses: ./.github/workflows/wait-for-claude-review.yml
    permissions:
      actions: read

  # Builds BOTH apps every run: the debug one (com.jaeckel.ethp2p.android.debug,
  # public debug key) and the UNSIGNED release one (com.jaeckel.ethp2p.android).
  # The release APK is signed only on a v* tag, by sign-release below, so the
  # release key never meets this job's Gradle/cargo build. ci.yml's
  # `./gradlew build -PskipRustEngine` already assembles the release variant
  # (lintVitalRelease included) on every PR; what this job adds is the release
  # build WITH the Rust engine, the engine-load and min-API checks on the APK
  # that actually ships, and a signing rehearsal. Neither replaces the other.
  build:
    name: Build APKs (debug + unsigned release)
    needs: review-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: :ui stamps the app's on-screen version from the nearest
          # v* tag, and `git describe` needs HEAD's history to REACH that tag.
          # fetch-tags alone can't do it — at depth 1 HEAD has no parents, so the
          # tag stays unreachable even once its ref is present. .gitmodules is empty,
          # so `submodules: recursive` adds nothing on top: the cost is one full
          # (~150MB) clone per matrix job, on jobs that already build Kotlin + Rust.
          #
          # KNOWN GAP on pull_request: checkout defaults to github.ref, which for
          # that event is the ephemeral refs/pull/<n>/merge commit — so a PR-built
          # artifact stamps a sha that resolves nowhere. Deliberately not pinned to
          # the PR head: that would change WHAT is built (head, not head-merged-into-
          # base) and lose the integration signal. The base version is still right,
          # since the merge commit reaches the tag through its base parent.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Robust Gradle dependency + plugin caching (restores the base-branch cache
      # so AGP / Besu / JitPack-fork artifacts come from cache, not flaky repos).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The Android app builds the Rust engine jniLibs FROM SOURCE by default —
      # there is no committed .so, so the published APK can never ship a stale
      # binary (the recurring failure mode: an ABI-compatible but feature-stale
      # .so that fails UniFFI validation on-device and silently falls back to
      # Java). This job provides the required toolchain: the Android rustup
      # targets below, cargo-ndk, and the runner's preinstalled NDK (found via
      # ANDROID_NDK_HOME / $ANDROID_HOME/ndk). No -PskipRustEngine here — the
      # shipped APK must carry the engine.
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Shared with boot-smoke-api29 (same toolchain, same preBuild chain);
          # only this job saves it, so the smoke job adds no second cache.
          shared-key: android-rust

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The assemble step below already builds the engine via preBuild, but run it
      # explicitly first so a toolchain problem fails here with a clear step name.
      # The newer-than check catches a silent skip (cargoNdkAndroid self-skips
      # only when the toolchain is incomplete — which requireAndroidRustEngine
      # would already have turned into a hard error).
      - name: Build Rust jniLibs from source
        run: |
          ./gradlew cargoNdkAndroid --stacktrace
          for abi in arm64-v8a x86_64; do
            lib="myotis-engine/src/androidMain/jniLibs/$abi/libmyotis_engine.so"
            [ "$lib" -nt gradlew ] \
              || { echo "::error::$lib was NOT built (cargoNdkAndroid self-skipped?)"; exit 1; }
          done

      # The COMMITTED UniFFI bindings (myotis_engine.kt) must match the current
      # Rust source, or a from-source .so and the committed bindings disagree on
      # per-function checksums and the Rust engine fails UniFFI validation
      # on-device — silently falling back to Java. This bit hard in v0.1.4: a
      # doc-comment edit on an `#[uniffi::export]` fn changed its checksum (recent
      # UniFFI folds the docstring into the checksum), but the bindings were never
      # regenerated, so the CI-built APK shipped a dead "Rust engine" toggle.
      # cargoNdkAndroid rebuilds the .so but NOT the .kt, so regenerate and assert
      # no drift. Scope the diff to the bindings file — the step above intentionally
      # rewrote the (git-ignored-for-drift) .so binaries with fresh builds.
      - name: Verify committed UniFFI bindings match the Rust source
        run: |
          ./gradlew uniffiGenerateKotlin --stacktrace
          bindings=myotis-engine-rust/src/main/kotlin/uniffi/myotis_engine/myotis_engine.kt
          git diff --exit-code -- "$bindings" || {
            echo "::error::$bindings is STALE vs rust/myotis-engine — regenerate with" \
                 "\`./gradlew uniffiGenerateKotlin\` and commit. A from-source .so would" \
                 "fail UniFFI checksum validation against these bindings and the Rust" \
                 "engine would silently fall back to Java on-device."
            exit 1
          }

      # The ubuntu-latest runner ships an Android SDK via $ANDROID_HOME, which
      # AGP picks up automatically when local.properties is absent. No extra
      # sdkmanager calls needed for compileSdk 34.

      # Retry to ride out transient external-repo resolution blips. NOT --offline:
      # offline turns a single cache miss (e.g. a changed build file) into a hard
      # failure, which is what broke this job before.
      #
      # assembleDebugAndroidTest rides along so the boot smoke test's sources
      # (androidTest) are compiled by a BLOCKING job: AGP wires androidTest into
      # neither `assemble` nor `check`, and the emulator job below is
      # continue-on-error — without this, a broken NodeBootSmokeTest.kt could sit
      # green in CI indefinitely.
      - name: Build the debug + unsigned release APKs (+ compile the androidTest APK)
        run: |
          for attempt in 1 2 3; do
            ./gradlew :android-app:assembleDebug :android-app:assembleRelease \
              :android-app:assembleDebugAndroidTest --stacktrace && exit 0
            echo "::warning::APK build attempt $attempt failed; retrying in 25s (transient dependency resolution?)"
            sleep 25
          done
          echo "::error::APK build failed after 3 attempts"
          exit 1

      # The Rust engine needs BOTH libmyotis_engine.so and JNA's
      # libjnidispatch.so, per ABI, or UniFFI cannot load and the app silently
      # falls back to the Java engine — a green build shipping a dead "Rust
      # engine" toggle, which is exactly what v0.1.3 and v0.1.4 did. Every
      # mechanism that puts these in the APK fails open (a resolution change
      # dropping an artifact, the aar losing an ABI, the jniLib merge racing the
      # extraction), and nothing else here would notice, so assert on the built
      # artifacts rather than trusting the build graph. Both of them: the debug
      # and the release variant merge their jniLibs separately.
      - name: Verify both APKs can actually load the Rust engine
        run: |
          set -euo pipefail
          for variant in debug release; do
            apk=$(ls android-app/build/outputs/apk/$variant/*.apk | head -n1)
            echo "$apk:"
            # Read the listing ONCE into a variable and match against that. Piping
            # `unzip -l` into `grep -q` looks natural but breaks under pipefail:
            # grep exits at the first match, unzip takes SIGPIPE, and the pipeline
            # reports failure on a perfectly good APK.
            listing=$(unzip -l "$apk")
            engines=$(sed -n 's#.*lib/\([^/]*\)/libmyotis_engine\.so.*#\1#p' <<< "$listing" | sort -u)
            [ -n "$engines" ] \
              || { echo "::error::no libmyotis_engine.so in $apk at all"; exit 1; }
            while IFS= read -r abi; do
              [ -n "$abi" ] || continue
              grep -q "lib/$abi/libjnidispatch\.so" <<< "$listing" \
                || { echo "::error::$apk: $abi ships libmyotis_engine.so with no libjnidispatch.so — JNA cannot dispatch, so the Rust engine would silently fall back to Java"; exit 1; }
              echo "  ok: $abi has both libmyotis_engine.so and libjnidispatch.so"
            done <<< "$engines"
          done

      # minSdk JDK-API gate — enforcement for CLAUDE.md's "minSdk 29 JDK-API
      # budget"; the script's docstring is the full story. The platform install
      # feeds its api-versions canary: pre-36.1 databases don't record every
      # policed API (Files.readString first appears in the 36.1 database), and
      # the script refuses to scan against a database that old (exit 2). Both
      # APKs ship, and each variant is dexed on its own, so both are scanned.
      - name: Verify minSdk JDK-API compatibility
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" \
            || echo "::warning::sdkmanager could not install platforms;android-36.1 — the gate's own database canary will decide"
          for variant in debug release; do
            apk=$(ls android-app/build/outputs/apk/$variant/*.apk | head -n1)
            python3 scripts/check_apk_min_api.py --apk "$apk"
          done

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: android-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          # Artifacts are immutable per run; without this, "re-run all jobs" on a
          # tag 409s in the build leg and the release job never runs. That is the
          # button people reach for after the version guard fails, so the recovery
          # path must not wedge the release. (node-binding.yml has carried this
          # fix since it hit exactly that.)
          overwrite: true

      # sign_release_apk.sh otherwise first runs on a hosted runner at a real
      # tag. Rehearse it on every run with a throwaway key, so runner-image drift
      # (which build-tools dir it picks, apksigner's --alignment-preserved,
      # aapt2's badging format, the JDK behind apksigner) fails here instead.
      # The throwaway pin goes in through ANDROID_RELEASE_CERT_PIN_FILE, so the
      # committed pin is never read or touched.
      - name: Rehearse release signing with a throwaway key
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/sign-rehearsal"
          mkdir -p "$t"
          export REHEARSAL_PW=$(openssl rand -hex 24)
          keytool -genkeypair -keystore "$t/k.p12" -storetype PKCS12 -alias rehearsal \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Myotis signing rehearsal" \
            -storepass:env REHEARSAL_PW >/dev/null 2>&1
          keytool -list -v -keystore "$t/k.p12" -alias rehearsal -storepass:env REHEARSAL_PW \
            | sed -n 's/.*SHA256: //p' > "$t/pin"
          apk=$(ls android-app/build/outputs/apk/release/*.apk | head -n1)
          ANDROID_RELEASE_CERT_PIN_FILE="$t/pin" \
          ANDROID_RELEASE_KEYSTORE_BASE64="$(base64 -w0 "$t/k.p12")" \
          ANDROID_RELEASE_KEYSTORE_PASSWORD="$REHEARSAL_PW" \
          ANDROID_RELEASE_KEY_ALIAS=rehearsal \
            scripts/sign_release_apk.sh "$apk" "$t/signed.apk"
          rm -rf "$t"

      # sign-release refuses a tag whose tree has no pinned release certificate,
      # and then the tag publishes no Android APK at all. Say so on every earlier
      # run instead, while there is still time to commit it.
      - name: Warn when no release certificate is pinned
        run: |
          [ -f android-app/release-signing-cert.sha256 ] \
            || echo "::warning title=No pinned release certificate::android-app/release-signing-cert.sha256 is missing, so a v* tag cut from this tree would publish no Android APK (docs/android-release-signing.md)"

      # Only a tag needs it (sign-release below): an unsigned APK installs nowhere,
      # so on a PR or main it would only be dead artifact storage.
      - name: Upload the unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release-unsigned-${{ github.sha }}
          path: android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # same re-run reason as the debug APK above

  # Boot the actual app on a minSdk (API 29) emulator. The static bytecode gate
  # (scripts/check_apk_min_api.py — the build job above runs it) proves
  # java.*/javax.* references resolve at API 29, but android.*
  # framework APIs are out of any dex scan's reach (SDK_INT guards are invisible
  # to it), api-versions.xml has gaps, and no scan proves the app actually
  # BOOTS. This job launches MainActivity and runs NodeService through a full
  # engine-stack start (networking + consensus init) on an API-29 AOSP image via
  # the `api29` Gradle Managed Device (NodeBootSmokeTest), so a startup-path
  # NoClassDefFoundError/NoSuchMethodError fails here instead of on a user's
  # phone.
  #
  # Built WITH the Rust engine (no -PskipRustEngine): below API 33 the app runs
  # the Rust engine only, with no Java fallback (EngineGate: the Java engine's
  # VarHandle users cannot link on Android 10-12), so on this API-29 device it
  # is the only engine that can boot. That also covers the Rust engine's
  # on-device load path (JNA + UniFFI + libmyotis_engine.so) on minSdk ART,
  # which no boot test exercised before. The Java engine's JVM code keeps the
  # build job's static dex scan; its boot is no longer run on an emulator here.
  boot-smoke-api29:
    name: API-29 boot smoke (emulator)
    # After the build job: this job builds the same Rust engine, and the build
    # job saves the shared `android-rust` cache at its end, so this job always
    # restores a warm dependency cache from the same run instead of racing it
    # cold. It also spends no emulator time on a commit whose build is broken.
    # The cost is wall-clock: it starts only once the build job finishes.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip on release tags: nothing consumes this job's result there (release
    # needs only build + sign-release + version-guard), and the tagged commit
    # already ran it on its way through main/PR.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    # The in-test deadline only bounds the test body — NOT the system-image
    # download, AVD creation, or an emulator/adb hang (the failure modes named
    # below), which would otherwise run to GitHub's 6-hour default on a job
    # whose failure nothing surfaces.
    # 60, not 45: this job now also builds the Rust engine (host bindings +
    # both Android ABIs), roughly 13 min on the warm cache `needs: build`
    # guarantees, on top of the emulator run.
    timeout-minutes: 60
    # NON-BLOCKING for now, deliberately: this is the repo's first emulator job,
    # and hosted-runner emulators are notoriously flaky (boot hangs, adb drops)
    # even with KVM. Job-level continue-on-error semantics: a failure still
    # shows as a red check on the PR, but the WORKFLOW run passes, so it gates
    # nothing (do NOT add this job to required checks while this line is here —
    # a required check blocks merge on red regardless of continue-on-error).
    # Once it has proven stable for a few weeks, promote it to blocking by
    # deleting this line. (No retry loop around gradle here, unlike the build
    # job: a retry would also re-run a genuinely failing boot test into the
    # job timeout.)
    continue-on-error: true
    steps:
      # Shallow on purpose (no fetch-depth: 0): the build job needs full history
      # for the version stamp; here the stamp is irrelevant, and :ui's version
      # probe degrades to its fallback label instead of failing without it.
      # (No `chmod +x gradlew` either — the executable bit is committed.)
      - name: Checkout
        uses: actions/checkout@v4

      # The emulator needs hardware virtualization; ubuntu-latest runners expose
      # /dev/kvm but root-only by default. This is the standard "enable KVM" udev
      # rule from the android-emulator-runner docs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Rust engine, same toolchain as the build job: the app's preBuild runs
      # cargoNdkAndroid for both APK ABIs (the device itself is x86_64).
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # The build job's cache, saved by that job earlier in this same run
          # (needs: build). Read-only here so a flaky red emulator run can't
          # churn the repo's cache quota.
          shared-key: android-rust
          save-if: false

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # AGP's managed-device setup downloads the emulator + the API-29 system
      # image (several hundred MB, a couple of minutes) into the runner's
      # preinstalled SDK by itself — no sdkmanager steps needed, licenses are
      # pre-accepted on the runner image. Follow-up once the job proves stable:
      # cache the system image + AVD to shave those minutes. swiftshader_indirect:
      # the runner has no GPU, so render in software (the documented GMD-on-CI
      # setting).
      # STEP-level continue-on-error, adjudicated by the next step — not
      # success-blind: both of this job's first PR runs hit a known AGP/UTP
      # results-TRANSPORT bug (issuetracker.google.com/issues/335857362) where
      # the device-side test finishes and its verdict is written to disk, but
      # UTP's gRPC stream back to Gradle dies ("SEVERE: recordTestResultEvent
      # ... UNAVAILABLE: io exception" in utp.0.log) and Gradle fails the task
      # with "Failed to receive the UTP test results" — a false red over a
      # PASSED run. The verdict file UTP writes is the ground truth either way,
      # so the next step reads THAT: genuine failures stay red (verdict FAILED,
      # or no verdict written at all), and the transport bug alone becomes a
      # loud warning on a green job.
      - name: Run the boot smoke test on the API-29 managed device
        id: gmd
        continue-on-error: true
        run: |
          ./gradlew :android-app:api29DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace

      - name: Adjudicate the device-side test verdict
        run: |
          set -eu
          mapfile -t protos < <(find android-app/build/outputs/androidTest-results/managedDevice \
            -name 'test-result.textproto' 2>/dev/null)
          if [ "${#protos[@]}" -eq 0 ]; then
            echo "::error::no test-result.textproto was written — the run produced no device-side verdict (infra/build failure; see the gradle step above)"
            exit 1
          fi
          for p in "${protos[@]}"; do
            if grep -qE 'test_status: (FAILED|ERROR|ABORTED|CANCELLED)' "$p"; then
              echo "::error::device-side verdict is a failure in $p:"
              grep -m1 -A12 'error_message' "$p" || true
              exit 1
            fi
          done
          # An empty or foreign suite must not pass as "our test was fine".
          grep -q 'NodeBootSmokeTest' "${protos[@]}" \
            || { echo "::error::NodeBootSmokeTest is missing from the device-side results"; exit 1; }
          grep -q 'test_status: PASSED' "${protos[@]}" \
            || { echo "::error::no PASSED verdict recorded"; exit 1; }
          if [ "${{ steps.gmd.outcome }}" != "success" ]; then
            echo "::warning title=UTP results transport failed::the gradle task failed only in the UTP results stream (known AGP/UTP gRPC bug, issue 335857362); the device-side verdict is PASSED"
          fi
          echo "device-side verdict: PASSED"

      # Results + per-test logcat — the boot verdict/diagnostics live here when
      # the test fails. Not on green runs: that bundle is dead weight.
      # `|| cancelled()`: a job that hits timeout-minutes is CANCELLED, not
      # failed, and failure() alone would skip this exact step on the hang
      # scenario the timeout exists for — the run most in need of the partial
      # UTP/emulator logs. (Superseded runs cancelled by concurrency also hit
      # this; their partial upload is harmless.) if-no-files-found stays on the
      # default `warn`: a failure that produced no results at all (died before
      # the device) should say so, not vanish.
      - name: Upload managed-device test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api29-boot-smoke-results-${{ github.sha }}
          path: |
            android-app/build/outputs/androidTest-results/managedDevice/
            android-app/build/reports/androidTests/managedDevice/
          retention-days: 14
          # Same re-run rationale as the APK artifact above.
          overwrite: true

      # continue-on-error keeps the WORKFLOW green on a failure here; this
      # annotation makes the red job hard to miss from the run summary too.
      # `|| cancelled()` for the same timeout-cancellation reason as the upload.
      - name: Surface the failure as an annotation
        if: failure() || cancelled()
        run: echo "::warning title=API-29 boot smoke did not pass::the boot smoke test failed, timed out, or was cancelled (non-blocking) — see the api29-boot-smoke-results artifact and this job's log"

  # Refuse to publish when the pushed tag disagrees with the version in the tree
  # — the asset name below comes from the tag, the versionName inside the apk
  # comes from project.version. See release-version-guard.yml. Runs in parallel
  # with the build, so a mismatch is reported early rather than after the build.
  version-guard:
    name: Release version guard
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-version-guard.yml

  # Sign the release APK with the Myotis release key. The ONLY job that ever holds
  # that key, so it is kept as small as it can be (docs/android-release-signing.md):
  #   - the secrets live in the `android-release` ENVIRONMENT, not the repo, and
  #     that environment's deployment rule admits v* tags only, so no PR branch,
  #     whatever workflow it carries, can read them;
  #   - it checks out only the signing script and the pinned certificate, and runs
  #     apksigner from the runner's SDK: no Gradle, no plugin, no cargo build.rs
  #     executes while the key is on disk;
  #   - it gets a read-only token, and publishing (contents: write) is a separate
  #     job that never sees the key.
  # Fails closed: with no secrets, no pinned certificate, or a key that does not
  # match the pin, nothing is signed and the release job below is skipped, so a
  # tag publishes no Android asset at all rather than a debug-signed one.
  # Its actions are pinned to commit SHAs, unlike the rest of the repo: the
  # runner hands a job every secret it references when the job STARTS, so each
  # action here runs while the key is readable from the runner process (how the
  # tj-actions/changed-files compromise, CVE-2025-30066, took secrets from jobs
  # that never passed them to it). A moved tag must not reach this job.
  sign-release:
    name: Sign the release APK
    needs: [build, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    steps:
      - name: Check out the signing script and the pinned certificate only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: |
            scripts/sign_release_apk.sh
            android-app/release-signing-cert.sha256
          sparse-checkout-cone-mode: false
          # Nothing here talks to git again: keep the token out of .git/config.
          persist-credentials: false

      - name: Download the unsigned release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: android-app-release-unsigned-${{ github.sha }}
          path: unsigned

      - name: Sign with the release key and check the signer against the pin
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(unsigned/*.apk)
          [ "${#apks[@]}" -eq 1 ] \
            || { echo "::error::expected exactly 1 unsigned apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          mkdir signed
          scripts/sign_release_apk.sh "${apks[0]}" signed/android-app-release.apk

      - name: Upload the signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android-app-release-${{ github.sha }}
          path: signed/android-app-release.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true  # same re-run reason as the build job's artifacts

  # Attach both APKs to the GitHub Release for the pushed tag: the release-signed
  # app (Myotis-<tag>-android.apk) and the debug one (Myotis-<tag>-android-debug.apk).
  # Runs ONLY on `v*` tags (never on branch/PR builds), and reuses the artifacts
  # rather than rebuilding. The desktop-dmg workflow publishes to the SAME
  # release for the same tag; whichever job runs first creates it and the other
  # just uploads its asset — the create step below tolerates that race.
  release:
    name: Publish APKs to release
    # version-guard and sign-release carry the same `if` as this job, so neither
    # is ever merely skipped underneath it — on a tag push all three run,
    # otherwise all three are skipped.
    needs: [build, sign-release, version-guard]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # gh release create/upload needs write access to Releases (repo contents).
      contents: write
    steps:
      # Only the shared release notes and the script that writes them
      # (.github/release-notes.*), from the commit being released. First, so
      # the artifacts below land in the checked-out workspace, not under it.
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/release-notes.md
            .github/release-notes.sh
          sparse-checkout-cone-mode: false
          # gh takes the token from the publish step's env; keep the job's
          # write token out of .git/config.
          persist-credentials: false
      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-app-debug-${{ github.sha }}
          path: apk/debug

      - name: Download the signed release APK
        uses: actions/download-artifact@v4
        with:
          name: android-app-release-${{ github.sha }}
          path: apk/release

      - name: Check both APKs' package ids and give them stable, versioned asset names
        run: |
          set -euo pipefail
          # The tag goes into the asset file names, so check its shape the way the
          # dmg and deb publish jobs do. `gh release upload` reads everything
          # after a `#` in a path as the asset's label, and the version guard
          # accepts any v<version>-<suffix>, so a tag like v<version>-rc#1 would
          # otherwise create the release in the next step and then fail its upload.
          printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[A-Za-z0-9._-]+$' \
            || { echo "::error::'${GITHUB_REF_NAME}' is not a valid release tag (expected v<version>)"; exit 1; }
          # Numbered stable releases only (not rc builds or a `current` symlink).
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ \
            | grep -E '/[0-9]+\.[0-9]+\.[0-9]+/$' | sort -V | tail -n1)
          aapt2="${build_tools}aapt2"
          shopt -s nullglob
          # variant, expected package, asset suffix. The package check is the
          # point of shipping two APKs: the debug-signed one must never carry the
          # release app's id, or it would install over Myotis as an update for
          # anyone who uninstalled the release app (and a lookalike signed with the
          # same public key could follow).
          while read -r variant package suffix; do
            # Glob into an array and assert exactly one apk — a stray second file
            # (or zero) should fail here, not silently ship an arbitrary pick.
            apks=(apk/$variant/*.apk)
            [ "${#apks[@]}" -eq 1 ] \
              || { echo "::error::expected exactly 1 $variant apk, found ${#apks[@]}: ${apks[*]}"; exit 1; }
            got=$("$aapt2" dump packagename "${apks[0]}" < /dev/null)  # not the loop's stdin
            [ "$got" = "$package" ] \
              || { echo "::error::the $variant APK is package '$got', expected '$package'"; exit 1; }
            mv "${apks[0]}" "apk/Myotis-${GITHUB_REF_NAME}-${suffix}.apk"
            echo "  ok: $variant = $package -> Myotis-${GITHUB_REF_NAME}-${suffix}.apk"
          done <<'APKS'
          release com.jaeckel.ethp2p.android android
          debug com.jaeckel.ethp2p.android.debug android-debug
          APKS

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Named explicitly: the sparse checkout above would give gh a repo
          # context too, but gh without one dies with "fatal: not a git
          # repository" (which sank the first v0.1.0 attempt: every gh release
          # call failed, so no release was created), so it must not hinge on it.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # Create the release with the master notes (.github/release-notes.md),
          # unless another publisher already did — see .github/release-notes.sh.
          bash .github/release-notes.sh create "$tag"
          gh release upload "$tag" apk/Myotis-*.apk --clobber
