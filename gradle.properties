# Shared build-time constants. Java code uses BeaconChainSpec.MAINNET_GENESIS_TIME;
# the refreshMainnetCheckpoint Gradle task reads this value.
ethp2p.mainnet.genesisTime=1606824023
# Gnosis Beacon Chain genesis time (2021-12-08 19:55:40 UTC); read by
# refreshGnosisCheckpoint for the checkpoint-date comment.
ethp2p.gnosis.genesisTime=1638993340

# Required by the Compose / Activity artifacts pulled in by :android-app.
android.useAndroidX=true

# Dexing the AndroidX + Compose classpath overflows the default 512m heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
