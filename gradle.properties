# Shared build-time constants. Java code uses BeaconChainSpec.MAINNET_GENESIS_TIME;
# the refreshMainnetCheckpoint Gradle task reads this value.
ethp2p.mainnet.genesisTime=1606824023
# Gnosis Beacon Chain genesis time (2021-12-08 19:55:40 UTC); read by
# refreshGnosisCheckpoint for the checkpoint-date comment.
ethp2p.gnosis.genesisTime=1638993340
# Sepolia beacon genesis time (2022-06-20 14:00:00 UTC); read by
# refreshSepoliaCheckpoint for the checkpoint-date comment.
ethp2p.sepolia.genesisTime=1655733600

# Required by the Compose / Activity artifacts pulled in by :android-app.
android.useAndroidX=true

# Dexing the AndroidX + Compose classpath overflows the default 512m heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

# KMP tolerates AGP 8.7 (newer than its max-tested 8.5) fine in practice.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# AGP 8.7's bundled lint (31.7) crashes analyzing Kotlin 2.2 sources — its
# Kotlin analysis API predates the 2.2 compiler ("Found class KaFunctionCall/
# KaCallableMemberCall, but interface was expected", multiple androidx
# detectors affected). Run a lint built against the current analysis API
# instead; drop this override when AGP itself moves past 8.7.
android.experimental.lint.version=8.13.2

# :app-ios shares its Rust-engine cinterop across the two iOS targets through
# the intermediate iosMain source set; commonization makes those cinterop
# declarations visible there.
kotlin.mpp.enableCInteropCommonization=true
