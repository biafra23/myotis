# Shared build-time constants. Java code uses BeaconChainSpec.MAINNET_GENESIS_TIME;
# the refreshMainnetCheckpoint Gradle task reads this value.
ethp2p.mainnet.genesisTime=1606824023
# Gnosis Beacon Chain genesis time (2021-12-08 19:55:40 UTC); read by
# refreshGnosisCheckpoint for the checkpoint-date comment.
ethp2p.gnosis.genesisTime=1638993340
# Sepolia beacon genesis time (2022-06-20 14:00:00 UTC); read by
# refreshSepoliaCheckpoint for the checkpoint-date comment.
ethp2p.sepolia.genesisTime=1655733600
# Chiado (Gnosis testnet) beacon genesis time (2022-10-10 10:05:00 UTC); read by
# refreshCheckpoint for the checkpoint-date comment.
ethp2p.chiado.genesisTime=1665396300

# Required by the Compose / Activity artifacts pulled in by :android-app.
android.useAndroidX=true

# Compile against what ships (owner's decision, #837). AGP 9 defaults this to
# false, and then a module's compile classpath is no longer aligned with its
# runtime classpath: on :android-app, 39 modules (androidx core and lifecycle,
# Netty, BouncyCastle, Guava, SLF4J, ...) were compiled at one version and
# packaged at another. AGP 8 aligned them; this restores that.
android.dependency.useConstraints=true

# No Compose Hot Reload (owner's decision, #837). Compose Multiplatform 1.12
# applies org.jetbrains.compose.hot-reload to every Kotlin JVM / KMP project by
# itself: 68 dev-only locked modules (a second Ktor line, an MCP server SDK,
# the hot-reload runtime) and FunctionKeyMeta annotations in release desktop
# jars, for a workflow nobody here uses.
org.jetbrains.compose.hot.reload.disable=true

# Dexing the AndroidX + Compose classpath overflows the default 512m heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

# :myotis-engine-ios shares its Rust-engine cinterop across the two iOS targets through
# the intermediate iosMain source set; commonization makes those cinterop
# declarations visible there.
kotlin.mpp.enableCInteropCommonization=true
