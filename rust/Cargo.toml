# Myotis Rust workspace.
#
# Members:
#   myotis-bls       — BLS12-381 fast-aggregate-verify (blst); cdylib for the JVM's
#                      NativeBlsBackend AND rlib for in-workspace reuse (jni is a
#                      default feature the pure-Rust consumers turn off).
#   myotis-consensus — the sync-committee light client VERIFICATION CORE (pure
#                      Rust lib, no JNI, sans-I/O — no tokio/sockets/fs/clock):
#                      SSZ types, tree_hash merkleization, sync-committee verify.
#   myotis-core      — EXECUTION-layer primitives (pure Rust lib, sans-I/O like
#                      myotis-consensus): keccak-256, RLP, secp256k1 identity,
#                      BlockHeader, ENR, pinned fork-ids. Grows through the
#                      EL-phase PRs (docs/reimplementation/07).
#   myotis-net       — ALL consensus-layer I/O: discv5 discovery, libp2p eth2
#                      req/resp, and the sync loop driving myotis-consensus.
#                      Depends on myotis-consensus; never the other way around.
#   myotis-evm       — the EVM: eth_call / gas-estimation over SNAP-proof-verified
#                      state (revm behind a SnapStateOracle trait; sans-I/O). THE
#                      one heavy EL dep (revm) is gated to this crate. Grows through
#                      the EL-phase Milestone-C PRs (docs/reimplementation/07).
#   myotis-engine    — the Rust implementation of the io.myotis.api engine contract,
#                      exposed to the JVM via hand-JNI (libmyotis_engine).
#
# Built from Gradle when cargo is available (root build.gradle.kts `cargoBuildHost`
# etc.); entirely optional — the pure-Java build never needs this workspace.

[workspace]
resolver = "2"
members = ["myotis-bls", "myotis-consensus", "myotis-core", "myotis-evm", "myotis-engine", "myotis-net"]

# Release profile is workspace-owned (crate-level [profile.*] is ignored in a
# workspace): same tuning myotis-bls always shipped with.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
