# Myotis Rust workspace.
#
# Members:
#   myotis-bls       — BLS12-381 fast-aggregate-verify (blst); cdylib for the JVM's
#                      NativeBlsBackend AND rlib for in-workspace reuse (jni is a
#                      default feature the pure-Rust consumers turn off).
#   myotis-consensus — the sync-committee light client VERIFICATION CORE (pure
#                      Rust lib, no JNI, sans-I/O — no tokio/sockets/fs/clock):
#                      SSZ types, tree_hash merkleization, sync-committee verify.
#   myotis-core      — EXECUTION-layer primitives (pure Rust lib, sans-I/O like
#                      myotis-consensus): keccak-256, RLP, secp256k1 identity,
#                      BlockHeader, ENR, pinned fork-ids. Grows through the
#                      EL-phase PRs (docs/spec/07).
#   myotis-wire      — the wire protocols without an async runtime (sans-I/O,
#                      no_std + alloc without the `std` feature): discv4 packet
#                      codec, RLPx (ECIES + frame codec + Hello), eth and snap/1
#                      messages and snap proof verification, and -- behind the
#                      `eth2` feature -- the eth2 req/resp codec, Status and
#                      fork digests. For hosts with their own event loop
#                      (firmware, wasm); myotis-net re-exports it at the old paths.
#   myotis-net       — the tokio I/O around myotis-wire: discv4/discv5
#                      discovery, RLPx/eth/snap sessions, libp2p eth2 req/resp,
#                      and the sync loop driving myotis-consensus. Depends on
#                      myotis-consensus; never the other way around.
#   myotis-addr1     — the addr1 address index's reader (pure Rust lib, sans-I/O like
#                      myotis-consensus): its records, the cover math and the checks of
#                      what Swarm delivered (SOC signatures, chunk and file addresses).
#                      Depends on myotis-core only; the fetching is rust/swarm's.
#   myotis-evm       — the EVM: eth_call / gas-estimation over SNAP-proof-verified
#                      state (revm behind a SnapStateOracle trait; sans-I/O). THE
#                      one heavy EL dep (revm) is gated to this crate. Grows through
#                      the EL-phase Milestone-C PRs (docs/spec/07).
#   myotis-engine    — the Rust implementation of the io.myotis.api engine contract
#                      (libmyotis_engine): UniFFI exports for the JVM hosts (ffi.rs)
#                      plus the plain C ABI for iOS/Rust hosts (capi.rs).
#   myotis-rpcd      — a standalone JSON-RPC daemon over myotis-engine's verified
#                      reads, for hosts that can't or won't run the JVM. A
#                      member, unlike roost: it links the engine in-process (so
#                      `panic = "abort"` is the contract it already lives under)
#                      and adds only a blocking HTTP server and clap.
#   uniffi-bindgen   — the pinned uniffi-bindgen CLI (Gradle `uniffiGenerateKotlin`
#                      regenerates :myotis-engine-rust's committed Kotlin bindings with it).
#
# Built from Gradle when cargo is available (root build.gradle.kts `cargoBuildHost`
# etc.); entirely optional — the pure-Java build never needs this workspace.

[workspace]
resolver = "2"
members = ["myotis-addr1", "myotis-bls", "myotis-consensus", "myotis-core", "myotis-wire", "myotis-evm", "myotis-engine", "myotis-net", "myotis-node", "myotis-rpcd", "uniffi-bindgen"]
# tor-poc (docs/how-it-works/privacy-and-tor.md §3 proof-of-concept) is a STANDALONE crate,
# excluded on purpose: it pulls the whole Arti dependency tree, which must never
# burden the pure-engine build or CI. It depends on myotis-net/myotis-core by
# path and builds on its own with `cargo run --manifest-path tor-poc/Cargo.toml`.
#
# roost (docs/design-history/lc-server-design.md) is excluded for the same two reasons plus one
# more: it is a SERVER daemon, so it must not inherit `panic = "abort"` below —
# in a process holding 1000+ wallet connections that turns one panic into an
# outage for all of them. Excluded, it carries its own profile with
# `panic = "unwind"`. It also pulls an HTTP stack no engine target links.
#
# swarm (crate myotis-swarm, the embedded ant Swarm node) is excluded too: a member is
# built by every `cargo build --workspace`, the release build included, and would pull
# ant's libp2p features (dns, ping, upnp) into the engine. myotis-engine links it only
# behind its off-by-default `swarm` feature (dev builds; rust/swarm/src/lib.rs, "Not ready
# for a release build"), so this lock records its graph and no shipped build compiles it.
# Its own lock, rust/swarm/Cargo.lock, is for building it on its own (tests, the example).
#
# vendor holds third-party sources copied in verbatim, today ant (vendor/ant/VENDORED.md):
# not on crates.io, and as a git dependency it would make every cold build fetch it.
# Upstream's code with its own workspace manifest (vendor/ant/Cargo.toml), built only as a
# path dependency, never as a member: no Myotis fmt or clippy runs over it.
exclude = ["tor-poc", "roost", "swarm", "vendor"]

# ONE version for every myotis-* release crate (`version.workspace = true` in each
# member). The Gradle build is the source of truth for the release version
# (root build.gradle.kts `allprojects { version = … }`); `verifyCrateVersions`
# fails `check` when this line disagrees with it, so the release sweep bumps the
# two together (with the other pins `check` verifies) and then regenerates the
# lock files. uniffi-bindgen is a pinned TOOL, not a release artifact, and keeps
# its own version.
#
# ONE minimum rustc (`rust-version.workspace = true` in each member), and the
# single source of it: the root build.gradle.kts reads this line to decide
# whether a toolchain builds the workspace or skips it like a missing cargo.
# 1.99 for every Rust tree here, by the owner's decision of 2026-11-20, not by
# the dependency graph, which alone needs 1.92 today (Arti 0.48, the `tor`
# feature's arti-client / tor-rtcompat tree). 1.99 is the floor of ant
# (https://github.com/freedom-hq/ant), the Swarm light node that the
# feature/swarm-addr1 branch embeds for the addr1 reader (candidate source:
# docs/ideas/swarm-read-economics.md), so linking it will raise nothing.
# Moving the toolchain pin (rust-toolchain.toml) does not move this line.
# The standalone crates (roost, tor-poc, the tour's workbook) state the same
# floor by hand, and cargo-locks.yml fails when one differs from this line;
# `verifyRustVersionFloor` fails `check` when a lock update pulls in a crate
# that needs more than it.
[workspace.package]
version = "0.1.21"
rust-version = "1.99"

# Release profile is workspace-owned (crate-level [profile.*] is ignored in a
# workspace): same tuning myotis-bls always shipped with.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Stated, not inherited (#734 D2): these are cargo's current release defaults
# (no debug info, which cargo then strips from the output), written out so a
# change of cargo's defaults cannot silently change the shipped bytes. The
# exported symbols the hosts load (JNI, UniFFI, the C ABI) live in .dynsym and
# are not touched; staticlibs are never stripped by cargo.
debug = false
strip = "debuginfo"
