# 16 KB page alignment for Android 15+ devices that use a 16 KB memory page size.
#
# NDK < r28 links shared objects with 4 KB-aligned PT_LOAD segments by default.
# On a 16 KB-page device the dynamic linker rejects such a library at load time
# ("dlopen failed: ... is not 16 KB aligned"), so NativeBlsBackend.isAvailable()
# turns false (or the app crashes) on those devices. Forcing max-page-size makes
# the linker emit 16 KB-aligned segments. NDK r28+ already defaults to this, where
# the flag is a harmless no-op — so it's safe to keep regardless of NDK version.
#
# Per-target (not [build]) so it only affects Android cross-compiles, never host
# builds/tests. Verify after building with rust/build-android.sh (it checks).

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# aes (myotis-wire's RLPx) enables its AES-NI code per function with
# #[target_feature], which the soft-float bare-metal targets cannot codegen
# ("Do not know how to split the result of this operator!"), and aes has no
# Cargo feature to turn that off -- only a cfg, which 0.9 renamed:
# `aes_backend = "soft"` for aes 0.9 (myotis-wire), `aes_force_soft` for the
# aes 0.8 still in the tree: discv5 (directly and through aes-gcm), snow
# (libp2p-noise) and, under the `tor` feature, Arti's tor-llcrypto. An embedder
# building those crates for these targets needs it (nothing in this tree builds
# them there). With only the old cfg, aes 0.9 builds its
# AES-NI backend and the canary crashes LLVM. Per-target here rather than
# RUSTFLAGS in CI, so every cargo invocation on these targets gets it (the
# no_std canary, `./gradlew cargoBuildNoStd`, an embedder building in-tree)
# and the env never changes the rustc fingerprint for other builds.
[target.x86_64-unknown-none]
rustflags = ["--cfg", "aes_force_soft", "--cfg", 'aes_backend="soft"']

[target.x86_64-unknown-uefi]
rustflags = ["--cfg", "aes_force_soft", "--cfg", 'aes_backend="soft"']

[target.aarch64-unknown-uefi]
rustflags = ["--cfg", "aes_force_soft", "--cfg", 'aes_backend="soft"']

# Windows (MSVC): /Brepro makes link.exe derive the PE header's TimeDateStamp,
# the debug directory's timestamps and the PDB GUID from the image's content
# instead of the clock, so a rebuild of the same tree gives the same .dll
# (#734, Part 5a: the only bytes the two rebuild legs' myotis_engine.dll and
# myotis_node.dll differed in). Cargo merges these per-target flags with the
# CARGO_TARGET_*_RUSTFLAGS path remaps (rust/repro-env.sh, the root build).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]
