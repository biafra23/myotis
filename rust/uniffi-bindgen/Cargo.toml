[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Workspace-local UniFFI bindings generator CLI (cargo run -p uniffi-bindgen)"
license = "MIT OR Apache-2.0"
publish = false

# The standard UniFFI pattern: a tiny workspace-local bin wrapping the bindgen
# CLI, so binding generation is pinned to the exact uniffi version the engine
# links against (a version skew between scaffolding and generator is a build
# error by design). Regenerate the COMMITTED Kotlin bindings through the root
# Gradle task `uniffiGenerateKotlin`: it also checks that every generated u16
# checksum comparison is masked to 16 bits (UniFFI does that itself since 0.32.2;
# see the task), and the APK workflow's drift check compares against its output.
# A direct run is for inspecting output:
#   cargo run -p uniffi-bindgen -- generate \
#     --library target/release/libmyotis_engine.so --language kotlin --out-dir <dir>

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
