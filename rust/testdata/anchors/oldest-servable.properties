# Oldest-servable test anchors: per network, the OLDEST checkpoint whose
# light_client_bootstrap the serving nodes behind roost (zbox) still answer.
# Recorded so a test of the sync-committee walk on a real desktop or Android
# build does not start by looking these values up or re-probing for them.
#
# TESTING ONLY, never a release anchor. Every entry is far past its network's
# weak-subjectivity bound, so a build that embeds them opens on the stale-anchor
# dialog ("Sync anyway (accept risk)") on every network.
#
# Provenance: probed slot by slot against zbox's nodes over loopback REST on
# 2026-08-10 (commit 7e82df11, PR #343; they were the v0.1.6 and v0.1.7
# anchors). All three still served a verified bootstrap on 2026-09-13: the
# old-anchor step of the v0.1.9 cold-start regression runs walks from exactly
# these roots. Bootstrap retention is a moving horizon, so an entry can stop
# being servable; when a network no longer syncs from its entry, re-probe on
# zbox and update this file.
#
# Use on desktop (on Android, clear the app's data instead of step 2):
#   1. Write them into BOTH engines, with no network access. The change is
#      left uncommitted. An older tree without -PanchorFile silently ignores the
#      flag and refreshes to head instead, so confirm both engine files now say
#      "recorded test" (3 matches each):
#        ./gradlew refreshCheckpoint -PanchorFile=rust/testdata/anchors/oldest-servable.properties
#        grep -c "recorded test" networking/src/main/java/com/jaeckel/ethp2p/networking/NetworkConfig.java rust/myotis-net/src/sync.rs
#   2. Start from a fresh profile, with the app closed. A saved sync snapshot
#      newer than the embedded anchor wins and skips the bootstrap, so a
#      profile that has synced before would never walk from these anchors.
#      (A "no matches found" from mv just means there is no saved state.)
#        mkdir -p ~/.myotis/snapshot-backup && mv ~/.myotis/sync-state*.snapshot* ~/.myotis/snapshot-backup/
#   3. Build and run. With cargo installed this rebuilds the Rust engine with
#      the new anchors first. Without cargo the Rust engine keeps the library
#      built before, with its old anchors, so add -Pengine=java:
#        ./gradlew :app-desktop:run
# Undo:
#   git checkout -- networking/src/main/java/com/jaeckel/ethp2p/networking/NetworkConfig.java rust/myotis-net/src/sync.rs
#   mv ~/.myotis/snapshot-backup/sync-state*.snapshot* ~/.myotis/

