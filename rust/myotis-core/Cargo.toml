[package]
name = "myotis-core"
version.workspace = true
edition = "2021"
description = "Myotis execution-layer primitives: keccak-256, RLP, secp256k1 identity, BlockHeader, ENR (sans-I/O; grows through the EL-phase PRs)"
license = "MIT OR Apache-2.0"

# Sans-I/O like myotis-consensus: no tokio/sockets/fs/clock/entropy. Key
# GENERATION therefore lives in the I/O crates (they own OS entropy); this
# crate only ever derives from caller-supplied secret bytes. Enforced by the
# wasm32 canary (root `cargoCheckWasm` checks this crate too).
#
# `no_std` + `alloc` is the compiler-enforced form of that rule. `std` is on by
# default so JVM/desktop/mobile hosts are unaffected; firmware and other
# bare-metal embedders build with `default-features = false`. The feature
# forwards to the dependencies' `std` features, so with it off NOTHING in the
# graph links std — enforced by the no_std canary (root `cargoBuildNoStd` and
# the no-std-canary workflow: `cargo build --no-default-features` for
# x86_64-unknown-none, a target that ships no std at all). The UEFI targets the
# promise exists for ship a partial std, so a UEFI build alone would not catch
# a leak.
[features]
default = ["std"]
std = ["sha3/std"]

[dependencies]
# keccak-256 (EL hashing — never mix with the CL's SHA-256, see docs/reimplementation README §11.6)
# default-features off: sha3's default `std` (→ digest/std → `extern crate std`)
# comes through this crate's `std` feature instead, so `--no-default-features`
# really is std-free.
sha3 = { version = "=0.10.9", default-features = false }
# secp256k1: sign-prehashed/recover (discv4 packets, RLPx auth) + ECDH (ECIES).
# Pure Rust (RustCrypto) — no C build, cargo-ndk/wasm32-clean. `precomputed-tables`
# deliberately off (binary size; mobile targets). NO `std` feature: k256/std →
# elliptic-curve/std → rand_core/std → getrandom, which doesn't build for plain
# wasm32-unknown-unknown and would kill the sans-I/O canary (this crate needs no
# entropy — key GENERATION lives in the I/O crates).
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "ecdh"] }

# Bare-metal targets: UEFI firmware and x86_64-unknown-none. sha2 arrives
# transitively — k256's `ecdsa` feature turns on its `sha256` feature — and its
# x86 backend enables SSE per function with `#[target_feature]`. Those targets
# build with SSE off and soft-float, and rustc fails at codegen with
#   rustc-LLVM ERROR: Do not know how to split the result of this operator!
# A global `-C target-feature=-sse2` cannot override a per-function enable, so
# the fix is sha2's `force-soft` backend, steered here for these targets only.
# (`target_os = "none"` also matches non-x86 bare metal, where sha2 is soft
# without its `asm` feature anyway, so the steer is a no-op there.) Workspace
# resolver 2: a target-specific feature never unifies into other targets'
# builds, so every other target keeps the fast default backend.
[target.'cfg(any(target_os = "uefi", target_os = "none"))'.dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
