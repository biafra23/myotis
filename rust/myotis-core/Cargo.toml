[package]
name = "myotis-core"
version.workspace = true
edition = "2021"
description = "Myotis execution-layer primitives: keccak-256, RLP, secp256k1 identity, BlockHeader, ENR (sans-I/O; grows through the EL-phase PRs)"
license = "MIT OR Apache-2.0"

# Sans-I/O like myotis-consensus: no tokio/sockets/fs/clock/entropy. Key
# GENERATION therefore lives in the I/O crates (they own OS entropy); this
# crate only ever derives from caller-supplied secret bytes. Enforced by the
# wasm32 canary (root `cargoCheckWasm` checks this crate too).
# `std` is on by default so JVM/desktop/mobile hosts are unaffected. Firmware and
# other bare-metal embedders build with `default-features = false`: the crate is
# `no_std` + `alloc` then, which is all its sans-I/O code has ever needed.
[features]
default = ["std"]
std = []

[dependencies]
# keccak-256 (EL hashing — never mix with the CL's SHA-256, see docs/reimplementation README §11.6)
sha3 = "=0.10.9"
# secp256k1: sign-prehashed/recover (discv4 packets, RLPx auth) + ECDH (ECIES).
# Pure Rust (RustCrypto) — no C build, cargo-ndk/wasm32-clean. `precomputed-tables`
# deliberately off (binary size; mobile targets). NO `std` feature: k256/std →
# elliptic-curve/std → rand_core/std → getrandom, which doesn't build for plain
# wasm32-unknown-unknown and would kill the sans-I/O canary (this crate needs no
# entropy — key GENERATION lives in the I/O crates).
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "ecdh"] }

# UEFI hosts only. sha2 arrives transitively (k256 -> ecdsa -> digest); its
# default backend compiles to SIMD that firmware has not enabled, and on
# x86_64-unknown-uefi rustc fails outright with
#   rustc-LLVM ERROR: Do not know how to split the result of this operator!
# Declaring it here steers the feature for these targets only; every other
# target keeps the fast default backend.
[target.'cfg(target_os = "uefi")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
