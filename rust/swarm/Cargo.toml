[package]
name = "myotis-swarm"
# Not a member of ../Cargo.toml's workspace (like tor-poc, rust/Cargo.toml `exclude`).
# myotis-engine links it behind its off-by-default `swarm` feature only (the crate doc's
# "Not ready for a release build").
# Not a release crate of its own (it is linked into myotis-engine), so, like tor-poc and
# roost, no version of its own to keep in step and nothing to publish.
version = "0.0.0"
publish = false
edition = "2021"
# ant's floor (its rust-version), above the workspace's.
rust-version = "1.99"
description = "Myotis's embedded Swarm reader: an ant light node linked into the engine (libp2p), for the addr1 address index only (.claude/agent/data-sources.md)"
license = "MIT OR Apache-2.0"

[dependencies]
# ant (https://github.com/freedom-hq/ant), vendored in ../vendor/ant at the commit its
# VENDORED.md names: its crates are not on crates.io, and a git dependency would make
# every cold build fetch it. default-features = false drops ant-chain's JSON-RPC writer
# (reqwest, rustls): reads need no chain access.
ant-node = { path = "../vendor/ant/crates/ant-node", default-features = false }
ant-control = { path = "../vendor/ant/crates/ant-control" }
ant-p2p = { path = "../vendor/ant/crates/ant-p2p", default-features = false }
ant-crypto = { path = "../vendor/ant/crates/ant-crypto" }
libp2p = { version = "=0.56.0", features = ["secp256k1"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
# The addr1 reader's ChunkSource, implemented by SwarmNode (sans-I/O, a workspace member).
myotis-addr1 = { path = "../myotis-addr1" }

# Own workspace root: keeps this out of the parent workspace entirely.
[workspace]

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "time"] }
