[package]
name = "myotis-net"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Myotis consensus-layer networking: discv5 discovery + libp2p eth2 req/resp + the light-client sync loop (ALL I/O lives here; myotis-consensus stays sans-I/O)"
license = "MIT OR Apache-2.0"

[dependencies]
# The sans-I/O verification core this crate drives. The dependency is strictly
# one-way: myotis-consensus must never grow a dependency on this crate (or on
# tokio/libp2p/discv5 through any other path) — that's the wasm32 canary's job
# to enforce (root build.gradle.kts `cargoCheckWasm`).
myotis-consensus = { path = "../myotis-consensus" }
# EL primitives (keccak, RLP, NodeKey, ENR) — sans-I/O, same one-way rule.
myotis-core = { path = "../myotis-core" }
# The tokio-free wire protocols (discv4 codec, RLPx, eth/snap messages), split
# out for hosts without an async runtime (myotis#505); re-exported at the old paths.
myotis-wire = { path = "../myotis-wire" }
# The EVM (revm-backed) for eth_call over verified state — the I/O crate implements
# myotis-evm's sync SnapStateOracle trait and bridges it to the async snap fetch path.
myotis-evm = { path = "../myotis-evm" }

# Exact pins: this crate owns the I/O surface and interop with live CL peers
# depends on wire-level behavior of these exact versions (noise/yamux framing,
# discv5 packet format). Cargo.lock would pin them anyway; the `=` makes the
# intent explicit and survives lockfile regeneration.
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
# `quic`: the consensus p2p spec's PRIMARY transport (QUIC MUST be supported;
# TCP is the fallback, consensus-specs#5330). QUIC carries its own TLS 1.3
# handshake and stream multiplexing, so neither noise nor a muxer is negotiated
# on it — see `reqresp::build_swarm`.
libp2p = { version = "=0.56.0", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "identify", "request-response", "gossipsub", "secp256k1", "macros"] }
# mplex, the TCP stream multiplexer the consensus p2p spec makes MANDATORY
# ("clients that support the TCP transport MUST support mplex and MAY support
# yamux", phase0/p2p-interface.md). rust-libp2p dropped it from the `libp2p`
# facade, so it comes as its own crate — the version libp2p 0.56.0 itself tests
# against (its dev-dependency). Nimbus speaks ONLY mplex on TCP since 2024
# (status-im/nimbus-eth2#6636), which is why a yamux-only host could never
# reach a Nimbus node — see `reqresp::build_swarm`.
libp2p-mplex = "=0.43.1"
discv5 = "=0.11.0"
# The ENR wire codec, for the discv4 fork-id pre-filter (#539): the `enr` crate
# itself arrives through discv5, alloy-rlp is the codec it implements. Already
# in the lock via enr — no new download.
alloy-rlp = "=0.3.16"
# The EIP-1459 DNS tree walk (#539, part 3): TXT lookups over the system
# resolver. Already in every lock through libp2p's `dns` transport with these
# same features — no new download.
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["system-config", "tokio"] }
snap = "=1.1.1"
tracing = "=0.1.44"
futures = "=0.3.32"
async-trait = "=0.1.89"
# EL discv4 (el::discv4): SO_RCVBUF sizing on the UDP socket (the Android
# NEIGHBORS-truncation trap — docs/reimplementation/02 §9.10) and entropy for
# FindNode random targets. Both are I/O-crate concerns by the sans-I/O rules.
socket2 = "=0.5.10"
getrandom = "=0.2.17"
# RLPx's crypto (ECIES, the frame codec's AES/HMAC/Keccak, constant-time MAC
# compare) moved to myotis-wire with the code that uses it (#505).

# Tor (docs/privacy-and-tor.md) — OPTIONAL, off by default. Only a host that
# builds with `--features tor` (today: the desktop engine dylib) pulls the Arti
# dependency tree; the Android/iOS/daemon builds are byte-for-byte unaffected.
# native-tls avoids the rustls 0.23 process-wide CryptoProvider dance (macOS
# Security.framework), matching the tor-poc crate.
arti-client = { version = "0.44", default-features = false, features = ["tokio", "native-tls"], optional = true }
tor-rtcompat = { version = "0.44", default-features = false, features = ["tokio", "native-tls"], optional = true }

[features]
tor = ["dep:arti-client", "dep:tor-rtcompat"]
# The EVM fixture recorder's seam (`ElReader::head_evm_oracle`) and
# myotis-evm's recorded-world files, for examples/record_shield_fixture.rs.
# Test tooling: on only through this crate's own dev-dependency below.
fixture-recorder = ["myotis-evm/fixture"]

[dev-dependencies]
myotis-wire = { path = "../myotis-wire", features = ["test-util"] }
# readstats shape tests parse their own JSON output.
serde_json = "1"
# Tests and examples build this crate with `fixture-recorder`, so the fixture
# recorder example compiles in every `cargo test`/clippy run while the engine
# library and the shipped .so never carry its seam.
myotis-net = { path = ".", features = ["fixture-recorder"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# test-util only: `#[tokio::test(start_paused = true)]` drives the interactive
# read HEDGING on the paused clock, so the timing invariants are asserted
# exactly and instantly instead of by sleeping in real time.
tokio = { version = "=1.52.3", features = ["test-util", "macros", "rt-multi-thread", "time"] }

[[example]]
name = "live_sync"
