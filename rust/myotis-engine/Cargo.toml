[package]
name = "myotis-engine"
version = "0.1.2"
edition = "2021"
description = "Rust implementation of the io.myotis.api engine contract (JNI cdylib)"
license = "MIT OR Apache-2.0"

[lib]
# libmyotis_engine.{so,dylib,dll} — loaded by :myotis-engines' RustEngineNative.
# The iOS static archive is NOT listed here: the cargoBuildIos* Gradle tasks
# build it with `cargo rustc --crate-type staticlib` (which overrides this
# list), so host/Android builds don't pay for an archive they never consume.
crate-type = ["cdylib", "rlib"]

[features]
# Tor verified-read routing (docs/privacy-and-tor.md) — OFF by default. The host
# dylib build (`cargoBuildHost -PtorEngine`) enables it so the desktop/daemon can
# offer the Settings toggle; Android/iOS builds do NOT, so the Arti tree never
# crosses to mobile. The `set_tor_enabled`/`tor_status` FFI functions exist either
# way (they no-op / report "not compiled" without this feature).
tor = ["myotis-net/tor"]

[dependencies]
myotis-consensus = { path = "../myotis-consensus" }
# The consensus-layer I/O + light-client sync loop. The engine OWNS the tokio
# runtime that drives it (the JNI natives are called from JVM threads with no
# runtime of their own) — this is the only crate that pulls in tokio/libp2p; the
# consensus crate stays sans-I/O.
myotis-net = { path = "../myotis-net" }
# Direct dep for U256 (value parsing) + the eth_call bridge types; also pulled
# transitively via myotis-net. revm is gated inside myotis-evm.
myotis-evm = { path = "../myotis-evm" }
tokio = { version = "=1.52.3", features = ["rt-multi-thread"] }
# The JVM boundary: UniFFI proc-macro scaffolding (replaces the old hand-JNI —
# the generated Kotlin bindings live in :myotis-engines and are pinned to this
# uniffi version by UniFFI's own per-function API checksums). Compound values
# still cross as JSON strings (transport swap only; shapes unchanged and pinned
# by the golden tests on both sides). The iOS C ABI (capi.rs) is untouched.
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Global tracing subscriber feeding the drainable ring buffer behind
# nativeDrainLogs — the on-device observability seam (Rust logs were
# invisible on Android; hosts pump the drain into their own log pipeline).
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The block/header types (re-exported through myotis-net) are constructed directly
# in the block_json golden test; myotis-core is otherwise transitive via myotis-net.
myotis-core = { path = "../myotis-core" }
