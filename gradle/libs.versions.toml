[versions]
tuweni = "2.7.2-jvm17.1"
discovery = "26.4.0"
#netty-kotlin = "c5a8303903"
netty-kotlin = "main-SNAPSHOT"
#netty = "4.2.7.Final"
bouncycastle = "1.78.1"
junit = "5.10.0"
slf4j = "2.0.12"
logback = "1.5.6"
snappy = "0.4"
milagro = "0.4.0"
# jblst: Supranational's blst BLS12-381 lib with JNI bindings (Teku ships this).
# Used only in a benchmark today (consensus test scope) to measure the speedup vs
# the pure-Java Milagro path before a production swap. Desktop/JVM natives only —
# Android needs an NDK-built blst (see docs/bls-rust-acceleration.md).
jblst = "0.3.15"
jvm-libp2p = "1.3.2-RELEASE"
trueblocks-kotlin = "main-SNAPSHOT"
dnsjava = "3.6.2"
# Hyperledger Besu, used by myotis-evm. Pinned to a recent stable that ships
# all currently-active mainnet precompiles. Bumping requires a fork-rule audit
# in EvmFactory and a pass over docs/besu-extraction.md.
besu = "24.12.2"
agp = "8.7.3"
kotlin = "2.0.21"
compose-bom = "2024.11.00"
activity-compose = "1.9.3"
# JSON-RPC server (:jsonrpc-server). Ktor server+client + kotlinx are chosen for
# Android compatibility (no java.net.http / com.sun.net.httpserver) and to match
# the project's Ktor/Compose-Multiplatform direction. Aligned with Kotlin 2.0.21.
ktor = "3.0.3"
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",             version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
# Fat-jar packaging for :app (bundleable daemon jar for embedders, e.g. freedom-browser).
# Pinned to the 8.x line for Gradle 8.12 / JDK 21; 9.x is a breaking rewrite.
shadow              = { id = "com.gradleup.shadow",                  version = "8.3.9" }

[libraries]
tuweni-bytes        = { module = "com.github.biafra23.tuweni-kotlin:tuweni-bytes",       version.ref = "tuweni" }
tuweni-rlp          = { module = "com.github.biafra23.tuweni-kotlin:tuweni-rlp",         version.ref = "tuweni" }
tuweni-crypto       = { module = "com.github.biafra23.tuweni-kotlin:tuweni-crypto",      version.ref = "tuweni" }
tuweni-merkle-trie  = { module = "com.github.biafra23.tuweni-kotlin:tuweni-merkle-trie", version.ref = "tuweni" }
tuweni-ssz          = { module = "com.github.biafra23.tuweni-kotlin:tuweni-ssz",         version.ref = "tuweni" }
tuweni-units        = { module = "com.github.biafra23.tuweni-kotlin:tuweni-units",       version.ref = "tuweni" }

netty-transport     = { module = "com.github.biafra23.netty-kotlin:netty-transport",               version.ref = "netty-kotlin" }
netty-codec         = { module = "com.github.biafra23.netty-kotlin:netty-codec",                   version.ref = "netty-kotlin" }
netty-handler       = { module = "com.github.biafra23.netty-kotlin:netty-handler",                 version.ref = "netty-kotlin" }

bouncycastle        = { module = "org.bouncycastle:bcprov-jdk18on",        version.ref = "bouncycastle" }

slf4j-api           = { module = "org.slf4j:slf4j-api",                   version.ref = "slf4j" }
logback-classic     = { module = "ch.qos.logback:logback-classic",         version.ref = "logback" }

snappy              = { module = "org.iq80.snappy:snappy",                  version.ref = "snappy" }

junit-bom           = { module = "org.junit:junit-bom",                    version.ref = "junit" }
junit-jupiter       = { module = "org.junit.jupiter:junit-jupiter" }

milagro             = { module = "org.miracl.milagro.amcl:milagro-crypto-java", version.ref = "milagro" }
jblst               = { module = "tech.pegasys:jblst",                        version.ref = "jblst" }
jvm-libp2p          = { module = "io.libp2p:jvm-libp2p",                   version.ref = "jvm-libp2p" }
trueblocks-kotlin   = { module = "com.github.biafra23:trueblocks-kotlin", version.ref = "trueblocks-kotlin" }
dnsjava             = { module = "dnsjava:dnsjava",                       version.ref = "dnsjava" }
discovery           = { module = "io.consensys.protocols:discovery",       version.ref = "discovery" }

# Besu EVM module. The standalone `evm` artifact is the heart of the Phase 0
# spike — a hand-rolled WorldUpdater plugs into it. `besu-datatypes` carries
# the Address/Wei/Hash value types the EVM expects on its API.
besu-evm            = { module = "org.hyperledger.besu:evm",              version.ref = "besu" }
besu-datatypes      = { module = "org.hyperledger.besu:besu-datatypes",   version.ref = "besu" }

androidx-compose-bom              = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-activity-compose         = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-ui               = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics      = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3        = { module = "androidx.compose.material3:material3" }

# JSON-RPC server (:jsonrpc-server) — all Android-safe (no java.net.http).
ktor-server-core           = { module = "io.ktor:ktor-server-core",  version.ref = "ktor" }
ktor-server-cio            = { module = "io.ktor:ktor-server-cio",   version.ref = "ktor" }
ktor-server-cors           = { module = "io.ktor:ktor-server-cors",  version.ref = "ktor" }
ktor-client-core           = { module = "io.ktor:ktor-client-core",  version.ref = "ktor" }
ktor-client-cio            = { module = "io.ktor:ktor-client-cio",   version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
