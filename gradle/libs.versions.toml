[versions]
# Upstream Tuweni (post-rename Maven coordinates io.consensys.tuweni, still the
# org.apache.tuweni packages). Java-21 bytecode, plain POMs (no Gradle-metadata JVM
# floor) — 17-target modules compile against it fine and Android dexes classfile 65
# already (discv5). Replaces the tuweni-kotlin KMP fork: multiplatform now comes from
# the Rust engine, not from Kotlin-transpiled Java deps.
tuweni = "2.7.2"
# biafra23/discovery fork of ConsenSys discovery 26.4.0, branch 26.4.0-android,
# published via JitPack. Tag 26.4.0-android.1 = fork commit e6168beb7374 — if
# the tag ever points elsewhere, treat the served artifact as compromised — and
# SHA-256 of the files JitPack serves for it. ENFORCED since #734: the jar and
# .module hashes below are pinned in gradle/verification-metadata.xml (they
# matched these values when pinned, 2026-11-09), so a JitPack rebuild that
# serves other bytes fails the build closed (Gradle resolves the .module, so the
# .pom is not in the pinned set). Recheck offline against
# ~/.gradle/caches/modules-2/files-2.1/com.github.biafra23/discovery/ or a
# fresh download; the jar's class files are byte-identical to a local
# `./gradlew publishToMavenLocal` build of the fork commit, though the jar's
# own hash differs per build — compare per-class or against these):
#   discovery-26.4.0-android.1.jar    e4bd2172727b90281849accac1b5f2b963eca2d8f12abca97b86a592873880fc
#   discovery-26.4.0-android.1.pom    2d9424ba346823f826a801495859421494a74aa558296375ea2a4597c38eb548
#   discovery-26.4.0-android.1.module 7a8b39a453fd16b36da88c6833d9b89e7766ba2c315fcfb0f06e7fbb151e928f
# CANONICAL doc for the swap (other comments point here). Patches ONLY the
# post-minSdk-29 JDK API calls that crash Android 10/11 (no ART backports
# there): KBucket's List.addFirst/getLast (SequencedCollection, API 35) and
# Stream.takeWhile (API 34), KBuckets' Stream.toList (API 34, dormant — no
# myotis caller, and desugar_jdk_libs 2.1.5 covers it — patched for the fork's
# standalone completeness), plus CompletableFuture.failedFuture/orTimeout
# (API 31) in RecursiveLookupTasks/NettyDiscoveryServerImpl/AsyncPinger — the
# rest not covered by desugaring. Fork + JitPack mechanics follow the besu
# playbook (besu-android-fork/README.md), but UNLIKE besu the swap is deliberately
# repo-wide via this catalog entry, not an :android-app-only substitution: the
# patches are behavior-preserving, one shared artifact means the JVM daemon and
# test suite exercise exactly the bytes Android ships, and daemon/Android can't
# skew. Accepted cost: a daemon-side discovery bump also goes through
# re-tagging the fork (new <base>-android.N tag, patches re-applied — playbook
# in the fork branch's README). If a future dependency ever pulls upstream
# io.consensys.protocols:discovery transitively, add a dependencySubstitution
# at the hosts — different GAs don't conflict-resolve, so duplicate
# org.ethereum.beacon.discovery classes would land on the classpath.
discovery = "26.4.0-android.1"
# Upstream Netty (NIO-only usage; Android-safe). Replaces the netty-kotlin
# transpile PoC — same io.netty.* FQCNs, so this is a coordinate swap.
netty = "4.2.20.Final"  # matches jvm-libp2p 1.3.2's netty constraint (one netty everywhere)
bouncycastle = "1.86"
junit = "6.1.3"
slf4j = "2.0.20"
log4j = "2.26.1"  # matches Besu 26.4's log4j-bom; bump in lockstep with Besu
logback = "1.6.6"
snappy = "0.5"
milagro = "0.4.0"
# jblst: Supranational's blst BLS12-381 lib with JNI bindings (Teku ships this).
# Used only in a benchmark today (consensus test scope) to measure the speedup vs
# the pure-Java Milagro path before a production swap. Desktop/JVM natives only —
# Android needs an NDK-built blst (see docs/design-history/bls-rust-acceleration.md).
jblst = "0.3.18"
jvm-libp2p = "1.3.2-RELEASE"
# JitPack build of biafra23/trueblocks-kotlin commit d2223849c1 (main's head when
# this was pinned, 2026-11-09). A commit-hash version, never a branch build
# (`main-SNAPSHOT` was one): a branch version changes whenever the branch moves
# and is re-fetched on cache expiry, so two builds of the same tag could ship
# different bytes. The artifact's hashes are pinned in
# gradle/verification-metadata.xml. To move it: pick the new commit, check
# JitPack built it (https://jitpack.io/api/builds/com.github.biafra23/trueblocks-kotlin
# lists "<10-hex>": "ok"), then rerun scripts/update_gradle_pins.sh.
trueblocks-kotlin = "d2223849c1"
dnsjava = "3.7.1"
# Hyperledger Besu (myotis-evm). NOTE: 25.7+ RENAMED the maven artifactIds
# (evm → besu-evm; internal:algorithms → internal:besu-crypto-algorithms) —
# probing the old names 404s and looks like publishing stopped; it didn't.
# Bumping requires a fork-rule audit in EvmFactory, a pass over
# docs/design-history/evm/besu-extraction.md, AND rebasing the Android ART fork
# (biafra23/besu, tag <ver>-android.N — android-app substitutes it in).
besu = "26.4.0"
# JNA (the UniFFI bindings' loader). 5.18.1 matches Besu's transitive jna so the
# jar and Android @aar can't drift apart under conflict resolution.
jna = "5.19.1"
agp = "8.7.3"
# Android NATIVE toolchain, pinned exactly (#734, Part 2). The single source for
# Gradle (ndkVersion/buildToolsVersion in :android-app and :myotis-engine, and the
# root cargoNdkAndroid gate), for CI (.github/actions/android-native-toolchain
# installs these) and for scripts/sign_release_apk.sh. A floating NDK or
# cargo-ndk changes the shipped .so bytes, a floating build-tools the signer.
# NDK r28+ is required for 16 KB-aligned LOAD segments by default (Android 15+
# 16 KB-page devices; rust/build-android.sh checks it); 29.0 is the newest r29
# and preinstalled on GitHub's ubuntu-24.04 image. Bumping any of the three is a
# reviewed PR that rebuilds the APK (android-apk.yml).
android-ndk = "29.0.14206865"
android-build-tools = "37.0.0"
cargo-ndk = "4.1.2"
# Kotlin 2.2.21 is the FLOOR for the iOS target: it's the first release whose
# Kotlin/Native supports Xcode 26 (required to link against the iOS 26 SDK).
kotlin = "2.4.21"
compose-bom = "2024.11.00"
# Compose Multiplatform (shared UI for Android + Desktop + iOS). 1.9.x pairs with
# Kotlin 2.2.20+. Uses the bundled compose-compiler plugin.
compose-multiplatform = "1.9.3"
activity-compose = "1.9.3"
# JSON-RPC server (:jsonrpc-server). Ktor server+client + kotlinx are chosen for
# Android compatibility (no java.net.http / com.sun.net.httpserver) and to match
# the project's Ktor/Compose-Multiplatform direction. Aligned with Kotlin 2.0.21.
ktor = "3.6.1"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
# 0.6.2 = the compatibility release for the kotlin.time.Instant the 2.1.20+ stdlib
# introduced. The iOS (klib) compile still resolves the experimental stdlib Instant
# in :ui's formatLogTime — see the local @OptIn there.
# 0.7.x: kotlinx.datetime.Instant became a typealias for kotlin.time.Instant (no binary class).
# Compose material3-desktop already pulls 0.7.1 onto every desktop runtime classpath, so
# compiling :ui against 0.6.x crashed the desktop Logs tab with NoClassDefFoundError at runtime
# — keep this in sync with what the Compose BOM ships.
kotlinx-datetime = "0.7.1"
# Tiny (~30 KB), dependency-free, Android-safe JSON parser for :myotis-engine-rust's
# JNI JSON marshalling (hand-JNI decision, docs/spec/05).
minimal-json = "0.9.5"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",             version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform",  version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",             version.ref = "compose-multiplatform" }

[libraries]
minimal-json        = { module = "com.eclipsesource.minimal-json:minimal-json", version.ref = "minimal-json" }
tuweni-bytes        = { module = "io.consensys.tuweni:tuweni-bytes",       version.ref = "tuweni" }
tuweni-rlp          = { module = "io.consensys.tuweni:tuweni-rlp",         version.ref = "tuweni" }
tuweni-crypto       = { module = "io.consensys.tuweni:tuweni-crypto",      version.ref = "tuweni" }
tuweni-merkle-trie  = { module = "io.consensys.tuweni:tuweni-merkle-trie", version.ref = "tuweni" }
tuweni-ssz          = { module = "io.consensys.tuweni:tuweni-ssz",         version.ref = "tuweni" }
tuweni-units        = { module = "io.consensys.tuweni:tuweni-units",       version.ref = "tuweni" }

netty-transport     = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-codec         = { module = "io.netty:netty-codec",     version.ref = "netty" }
netty-handler       = { module = "io.netty:netty-handler",   version.ref = "netty" }

bouncycastle        = { module = "org.bouncycastle:bcprov-jdk18on",        version.ref = "bouncycastle" }

slf4j-api           = { module = "org.slf4j:slf4j-api",                   version.ref = "slf4j" }
log4j-to-slf4j      = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
logback-classic     = { module = "ch.qos.logback:logback-classic",         version.ref = "logback" }

snappy              = { module = "org.iq80.snappy:snappy",                  version.ref = "snappy" }

junit-bom           = { module = "org.junit:junit-bom",                    version.ref = "junit" }
junit-jupiter       = { module = "org.junit.jupiter:junit-jupiter" }

milagro             = { module = "org.miracl.milagro.amcl:milagro-crypto-java", version.ref = "milagro" }
jblst               = { module = "tech.pegasys:jblst",                        version.ref = "jblst" }
jvm-libp2p          = { module = "io.libp2p:jvm-libp2p",                   version.ref = "jvm-libp2p" }
# JNA — the FFI layer under the UniFFI-generated Kotlin bindings in :myotis-engine-rust
# (replaces the old hand-JNI). :android-app additionally pins the @aar variant so
# the packaged natives come from JNA's Android artifact.
jna                 = { module = "net.java.dev.jna:jna",                   version.ref = "jna" }
# JitPack-served coordinates (this and kethereum below): the group must be
# allowed by the JitPack content filter in settings.gradle.kts — a cold
# resolve's "Could not find" error will not mention that filter.
trueblocks-kotlin   = { module = "com.github.biafra23:trueblocks-kotlin", version.ref = "trueblocks-kotlin" }
# trueblocks-kotlin's own dependency, made explicit so :tx-history can call
# Bloom.isMemberBytes(Address) at compile time (the JitPack POM exposes kethereum
# only at runtime scope). Keep the version in lockstep with what trueblocks-kotlin
# resolves transitively (0.86.0 today).
kethereum-model     = { module = "com.github.komputing.kethereum:model",   version = "0.86.0" }
dnsjava             = { module = "dnsjava:dnsjava",                       version.ref = "dnsjava" }
discovery           = { module = "com.github.biafra23:discovery",         version.ref = "discovery" }
besu-evm            = { module = "org.hyperledger.besu:besu-evm",         version.ref = "besu" }
besu-datatypes      = { module = "org.hyperledger.besu:besu-datatypes",   version.ref = "besu" }


androidx-compose-bom              = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-activity-compose         = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-compose-ui               = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics      = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3        = { module = "androidx.compose.material3:material3" }
# Java-only Worker (no -ktx needed): the daily beacon catch-up job while the node sleeps.
androidx-work-runtime             = { module = "androidx.work:work-runtime", version = "2.12.0" }
# Instrumented-test stack for :android-app's minSdk boot smoke test (androidTest
# only — never in the APK). Versions from the same androidx.test release train.
androidx-test-core                = { module = "androidx.test:core",       version = "1.6.1" }
androidx-test-runner              = { module = "androidx.test:runner",     version = "1.6.2" }
androidx-test-rules               = { module = "androidx.test:rules",      version = "1.6.1" }
androidx-test-ext-junit           = { module = "androidx.test.ext:junit",  version = "1.2.1" }
# JUnit 4 for :android-app's local AND instrumented tests (the JVM modules use
# JUnit 5 via `junit` above; androidx.test is JUnit-4-based). One alias so the
# two classpaths can't drift onto different JUnit 4 versions.
junit4                            = { module = "junit:junit",              version = "4.13.2" }
# :myotis-engine-ports unit tests ONLY: OkHttp 2.7.5's HttpURLConnection, the code
# Android's platform HttpURLConnection is forked from, so UrlConnectionHttpGatewayTest
# runs on its cancel semantics rather than the host JDK's. Never a runtime dependency. It lacks
# Android's own patch that a cancelled call never recovers (b/33763156): here a call
# cancelled on a pooled connection retries forever, so tests must not pool.
okhttp2-urlconnection             = { module = "com.squareup.okhttp:okhttp-urlconnection", version = "2.7.5" }

# JSON-RPC server (:jsonrpc-server) — all Android-safe (no java.net.http).
ktor-server-core           = { module = "io.ktor:ktor-server-core",  version.ref = "ktor" }
ktor-server-cio            = { module = "io.ktor:ktor-server-cio",   version.ref = "ktor" }
ktor-client-core           = { module = "io.ktor:ktor-client-core",  version.ref = "ktor" }
ktor-client-cio            = { module = "io.ktor:ktor-client-cio",   version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinx-coroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinx-datetime" }
